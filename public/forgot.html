<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="fgPageTitle">忘記密碼 · RegMaster</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="/shared/styles.css">

<script src="/__/firebase/10.7.1/firebase-app-compat.js"></script>
<script src="/__/firebase/10.7.1/firebase-functions-compat.js"></script>
<script src="/__/firebase/init.js"></script>
<script src="/shared/firebase-bridge.js"></script>

<style>
body { min-height:100vh; display:grid; place-items:center; background:var(--surface-2); padding:32px; position:relative; }
body::before { content:''; position:absolute; inset:0; background-image:linear-gradient(var(--hairline) 1px, transparent 1px),linear-gradient(90deg,var(--hairline) 1px, transparent 1px); background-size:60px 60px; mask:radial-gradient(ellipse 60% 50% at 50% 50%, black, transparent 70%); -webkit-mask:radial-gradient(ellipse 60% 50% at 50% 50%, black, transparent 70%); pointer-events:none; }

.shell { width:100%; max-width:520px; position:relative; }
.brand { display:flex; align-items:center; justify-content:center; gap:10px; font:700 16px/1 var(--f-display); margin-bottom:32px; text-decoration:none; color:inherit; }
.brand .logo { width:32px; height:32px; border-radius:8px; background:var(--ink); color:var(--surface); display:grid; place-items:center; font:800 15px/1 var(--f-display); }

.card { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:48px; box-shadow:var(--sh-md); }

.step-header { text-align:center; margin-bottom:32px; }
.step-header .ic-circle { width:64px; height:64px; margin:0 auto 20px; border-radius:50%; background:linear-gradient(135deg, var(--blue-500), var(--blue-700)); display:grid; place-items:center; box-shadow:0 8px 24px rgba(61,107,255,.25); }
.step-header .ic-circle svg { width:28px; height:28px; color:white; }
.step-header h1 { font:700 30px/1.15 var(--f-display); letter-spacing:-.018em; margin-bottom:8px; }
.step-header p { font:400 15px/1.55 var(--f-tc); color:var(--ink-3); }
.step-header p strong { color:var(--ink); font-weight:600; }

.state-pane { display:none; }
.state-pane.on { display:block; }

.success-icon { width:80px; height:80px; margin:0 auto 24px; border-radius:50%; background:color-mix(in srgb, var(--ok) 15%, var(--surface)); display:grid; place-items:center; }
.success-icon svg { width:36px; height:36px; color:var(--ok); }

.alert-box { padding:12px 14px; border-radius:10px; font:400 13px/1.5 var(--f-tc); margin-bottom:14px; }
.alert-box.err { background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.2); color:var(--err-700); }

.foot-link { text-align:center; margin-top:24px; font:400 13px/1 var(--f-tc); color:var(--muted); }
.foot-link a { color:var(--acc); font-weight:500; }

.security-note { padding:14px 16px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; margin-top:20px; display:flex; gap:10px; align-items:flex-start; font:400 12.5px/1.55 var(--f-tc); color:var(--ink-3); }
.security-note .ic { width:24px; height:24px; border-radius:50%; background:var(--acc-soft); color:var(--acc); display:grid; place-items:center; font:700 14px/1 var(--f-display); flex-shrink:0; }

@media (max-width:600px) { .card { padding:32px 24px; } }
</style>
</head>
<body>

<div class="shell">
  <a class="brand" href="/"><span class="logo"><img src="/favicon.png" alt="RegMaster" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block"></span>RegMaster</a>

  <div class="card">
    <!-- STATE 1: enter email -->
    <div class="state-pane on" data-s="1">
      <div class="step-header">
        <div class="ic-circle"><svg data-hero viewBox="0 0 24 24"><path d="M3 8l9 6 9-6M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg></div>
        <h1 data-i18n="fgTitle">忘記密碼了？</h1>
        <p data-i18n-html="fgLead">沒關係。輸入你的註冊信箱，<br>系統會把新密碼寄到你的信箱。</p>
      </div>

      <div class="alert-box err" id="errBox" style="display:none"></div>

      <form id="forgotForm" autocomplete="on">
        <div>
          <label class="label" for="email" data-i18n="fgEmailLabel">註冊信箱</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" required placeholder="you@company.com">
        </div>
        <button class="btn btn-primary btn-lg btn-block" id="submitBtn" type="submit" style="margin-top:18px" data-i18n="fgSubmit">寄送新密碼 →</button>
      </form>

      <div class="security-note">
        <div class="ic">i</div>
        <div data-i18n-html="fgSecurityNote">為了安全，無論信箱是否存在，系統都會顯示相同回覆。請至信箱（含垃圾郵件夾）查看是否收到信件，<b>15 分鐘內僅能請求一次</b>。</div>
      </div>

      <div class="foot-link"><span data-i18n="fgRemembered">想起來了？</span><a href="/login.html" data-i18n="fgBackLogin">回到登入</a></div>
    </div>

    <!-- STATE 2: success -->
    <div class="state-pane" data-s="2">
      <div class="success-icon">
        <svg data-hero viewBox="0 0 24 24" stroke-width="2.4"><path d="M5 13l4 4L19 7"/></svg>
      </div>
      <div class="step-header" style="margin-bottom:24px">
        <h1 data-i18n="fgSuccessTitle">請至信箱查看新密碼</h1>
        <p id="successMsg" data-i18n-html="fgSuccessMsg">若此 Email 已註冊，<br>新密碼將寄送至信箱。</p>
      </div>

      <div class="security-note" style="margin-top:0">
        <div class="ic">i</div>
        <div data-i18n="fgSuccessNote">建議您收到新密碼後立即登入，並至「設定 → 帳號 → 修改密碼」改為自己慣用的密碼。</div>
      </div>

      <a href="/login.html?just=reset" class="btn btn-primary btn-lg btn-block" style="margin-top:24px" data-i18n="fgBackLoginBtn">回到登入頁 →</a>

      <div class="foot-link"><span data-i18n="fgNeedHelp">需要協助？</span><a href="/contact.html?topic=support" data-i18n="fgContactSupport">聯絡客服</a></div>
    </div>
  </div>
</div>

<script src="/shared/app-state.js"></script>
<script src="/shared/i18n.js"></script>
<script src="/shared/i18n-forgot.js"></script>
<script>
(function () {
  AppState.init();

  var errBox = document.getElementById('errBox');
  function showErr(msg) { errBox.textContent = msg; errBox.style.display = 'block'; }
  function hideErr() { errBox.style.display = 'none'; }

  function showState(n) {
    document.querySelectorAll('.state-pane').forEach(function (p) { p.classList.remove('on'); });
    document.querySelector('.state-pane[data-s="' + n + '"]').classList.add('on');
  }

  document.getElementById('forgotForm').addEventListener('submit', function (e) {
    e.preventDefault();
    hideErr();

    var email = document.getElementById('email').value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showErr(window.L('fgInvalidEmail')); return; }

    var btn = document.getElementById('submitBtn');
    btn.disabled = true; var oldText = btn.textContent;
    btn.textContent = window.L('fgSending');

    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.success) {
          // resetAdminPassword returns generic message for security (no account-existence leak)
          if (res.message) {
            document.getElementById('successMsg').innerHTML = res.message;
          }
          showState(2);
        } else {
          btn.disabled = false; btn.textContent = oldText;
          showErr((res && res.message) || window.L('fgSendFailed'));
        }
      })
      .withFailureHandler(function (err) {
        btn.disabled = false; btn.textContent = oldText;
        showErr((err && err.message) || window.L('fgNetworkError'));
      })
      .resetAdminPassword(email);
  });
})();
</script>
</body>
</html>
