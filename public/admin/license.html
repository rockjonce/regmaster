<html lang="zh-Hant" data-theme="light">
<head>

<style>
.cur-plan { background:linear-gradient(135deg, var(--ink), #1a2e52); color:white; border-radius:14px; padding:24px 28px; margin-bottom:24px; position:relative; overflow:hidden; }
.cur-plan::before { content:''; position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px); background-size:32px 32px; }
.cur-plan > * { position:relative; }
.cur-plan .badge-p { display:inline-flex; padding:4px 10px; background:linear-gradient(135deg,#fbcd5b,var(--acc)); color:#3D2410; border-radius:5px; font:700 11px/1 var(--f-mono); margin-bottom:14px; }
.cur-plan h2 { font:800 28px/1.1 var(--f-display); margin-bottom:8px; }
.cur-plan p { color:rgba(255,255,255,.7); margin-bottom:18px; font:400 13.5px/1.55 var(--f-tc); }
.cur-plan .meta-row { display:flex; gap:32px; }
.cur-plan .meta-row .it .lbl { font:500 11px/1 var(--f-mono); opacity:.5; letter-spacing:.06em; text-transform:uppercase; margin-bottom:5px; }
.cur-plan .meta-row .it .v { font:700 15px/1 var(--f-display); }

.activate-card { padding:24px; background:var(--surface); border:1px solid var(--line); border-radius:14px; margin-bottom:24px; }
.activate-card h3 { font:700 16px/1.2 var(--f-display); margin-bottom:6px; }
.activate-card p { font:400 13px/1.5 var(--f-tc); color:var(--ink-3); margin-bottom:14px; }
.activate-card .input-row { display:flex; gap:8px; }
.activate-card input { flex:1; padding:11px 14px; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; font:600 14px/1 var(--f-mono); letter-spacing:.08em; }
.activate-card input:focus { outline:0; border-color:var(--ink); box-shadow:0 0 0 3px rgba(11,28,61,.08); }

.plans-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
.plan { background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:24px; position:relative; display:flex; flex-direction:column; }
.plan.cur { border-color:var(--ink); background:linear-gradient(180deg, var(--surface), color-mix(in srgb, var(--ink) 3%, var(--surface))); }
.plan.cur::before { content:'目前方案'; position:absolute; top:-10px; left:24px; padding:3px 9px; background:var(--ink); color:var(--surface); border-radius:4px; font:600 10.5px/1.3 var(--f-mono); }
.plan h4 { font:700 16px/1.2 var(--f-display); margin-bottom:6px; }
.plan .tag { font:400 12px/1.5 var(--f-tc); color:var(--muted); margin-bottom:14px; min-height:34px; }
.plan .price { display:flex; align-items:baseline; gap:4px; margin-bottom:14px; }
.plan .num { font:800 32px/1 var(--f-display); }
.plan .per { font:500 12px/1 var(--f-tc); color:var(--muted); }
.plan ul { list-style:none; flex:1; margin-bottom:14px; }
.plan li { padding:4px 0 4px 22px; position:relative; font:400 12.5px/1.4 var(--f-tc); color:var(--ink-2); }
.plan li::before { content:'✓'; position:absolute; left:0; top:4px; color:var(--ok-500); font-weight:700; }
.plan .btn-plan { padding:9px; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; font:600 12.5px/1 var(--f-tc); text-align:center; cursor:pointer; }
.plan.cur .btn-plan { background:var(--ink); color:var(--surface); }

.history-card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:24px; }
.history-card h3 { font:700 16px/1.2 var(--f-display); margin-bottom:14px; }
.history-tbl { width:100%; border-collapse:collapse; font:400 13px/1.5 var(--f-tc); }
.history-tbl th { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); font:600 10.5px/1 var(--f-mono); color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
.history-tbl td { padding:10px 12px; border-bottom:1px solid var(--line-2); color:var(--ink-2); }
.history-tbl tr:last-child td { border-bottom:0; }
.status-tag { padding:2px 7px; border-radius:4px; font:600 10px/1.4 var(--f-mono); }
.status-tag.active { background:color-mix(in srgb, var(--ok-500) 14%, transparent); color:var(--ok-700); }
.status-tag.expired { background:var(--surface-2); color:var(--muted); }
@media (max-width:768px){
  .plans-grid { grid-template-columns:1fr; }
  .cur-plan { padding:20px; }
  .cur-plan .meta-row { flex-direction:column; gap:14px; }
  .activate-card .input-row { flex-direction:column; }
  .history-card { overflow-x:auto; }
  .history-tbl { min-width:520px; }
}
@media (min-width:481px) and (max-width:768px){ .plans-grid { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<div class="admin">
  <aside class="side">
    <a class="brand" href="/admin/"><div class="logo"><img src="/favicon.png" alt="RegMaster" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block"></div><div class="nm">RegMaster<small>主辦後台</small></div></a>
    <div class="org-switcher"><div class="av" id="orgAv">—</div><div class="body"><h6 id="orgName">—</h6><p>主辦方</p></div></div>
    <div class="nav-grp">
      <div class="l-grp">概覽</div>
      <a class="nav-it" href="/admin/"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/></svg>儀表板</a>
      <a class="nav-it" href="/admin/events/"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3M3 11h18"/></svg>所有活動</a>
      <a class="nav-it" href="/admin/ai.html"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M12 2l2 7h7l-5.5 4 2 7L12 16l-5.5 4 2-7L3 9h7z"/></svg>AI 助理</a>

      <div class="l-grp">系統</div>

      <a class="nav-it" href="/admin/audit.html"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M21 12c0 5-4 9-9 9s-9-4-9-9 4-9 9-9 9 4 9 9z"/></svg>操作日誌</a>

  <main>
    <header class="head">
      <div class="crumbs"><a href="/admin/" data-i18n="anBrandSubOrg">主辦後台</a><span class="sep">/</span><b data-i18n="anLicense">方案與授權</b></div>
      <div class="actions"><div class="me-h"><div class="av-c" id="meAv">—</div><span id="meName">—</span></div></div>

    <div class="main-c">
      <div id="errorBanner" class="error-banner" style="display:none"></div>
      <div class="cur-plan">
        <div class="badge-p" id="planBadge" data-i18n="adLicBadgeLoading">⏳ 載入中</div>
        <h2 id="planTitle">—</h2>
        <p id="planDesc" data-i18n="adLicPlanDescDefault">查詢您的授權狀態與額度⋯</p>

          <div class="it"><div class="lbl" data-i18n="adLicLblStatus">狀態</div><div class="v" id="planStatus">—</div></div>

      <div class="activate-card">
        <h3 data-i18n="adLicActivateH3">輸入授權碼</h3>

        <div class="input-row">
          <input id="licCodeInput" placeholder="例：RM-XXXX-XXXX-XXXX-XXXX" data-i18n-placeholder="adLicCodePlaceholder" maxlength="22">
          <button class="btn btn-primary" id="activateBtn" data-i18n="adLicActivateBtn">啟用</button>

      <h2 style="font:700 20px/1.2 var(--f-display); margin-bottom:14px" data-i18n="adLicUpgradeH2">可升級方案</h2>
      <p style="font:400 12.5px/1.6 var(--f-tc); color:var(--ink-3); margin-bottom:14px" data-i18n="adLicUpgradeP">輸入授權碼即可升級，或直接線上刷卡（PayUni）綁定方案。價格以年計。</p>
      <div class="plans-grid" id="plansGrid">
        <div class="plan"><h4 data-i18n="adLicCardLoading">載入中⋯</h4></div>

      <div class="history-card">
        <h3 data-i18n="adLicHistH3">授權碼歷史</h3>
        <table class="history-tbl">
          <thead><tr><th data-i18n="adLicHistCode">授權碼</th><th data-i18n="adLicHistType">類型</th><th data-i18n="adLicHistQuota">額度</th><th data-i18n="adLicHistStatus">狀態</th><th data-i18n="adLicHistExpiry">到期</th></tr></thead>
          <tbody id="histBody"><tr><td colspan="5" style="text-align:center; padding:32px; color:var(--muted)" data-i18n="adLicCardLoading">載入中⋯</td></tr></tbody>

<script src="/shared/app-state.js"></script>
<script src="/shared/i18n.js"></script>
<script src="/shared/i18n-admin-license.js"></script>
<script src="/shared/admin-nav.js"></script>
<script>
(function(){
  AppState.init();
  var me = AppState.getMe();
  if (!me || !me.sessionToken) { location.href = '/login.html?next=' + encodeURIComponent(location.pathname); return; }
  function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]; }); }
  document.getElementById('orgAv').textContent = (me.displayName || me.username).charAt(0).toUpperCase();
  document.getElementById('orgName').textContent = me.displayName || me.username;
  document.getElementById('meAv').textContent = (me.displayName || me.username).charAt(0).toUpperCase();
  document.getElementById('meName').textContent = me.displayName || me.username;

  function load() {
    google.script.run
      .withSuccessHandler(function (res) {
        res = res || {};
        var tier = res.tier || 'free';
        var label = res.planLabel || tier.toUpperCase();
        document.getElementById('planBadge').textContent = res.hasValid ? ('★ ' + label) : 'FREE';
        document.getElementById('planTitle').textContent = label + window.L('adLicPlanSuffix');
        document.getElementById('planDesc').textContent = res.hasValid ? (res.message || '') : window.L('adLicFreePlanDesc');
        document.getElementById('planStatus').textContent = res.hasValid ? window.L('adLicStatusActivated') : window.L('adLicStatusFree');
        document.getElementById('planExpiry').textContent = res.expiresAt || '—';
        document.getElementById('planQuota').textContent = label;
        var hist = res.history || [];
        var tbody = document.getElementById('histBody');
        if (hist.length > 0) {
          tbody.innerHTML = hist.map(function (h) {
            var stClass = h.status === '已啟用' ? 'active' : 'expired';
            return '<tr><td style="font-family:var(--f-mono); font-weight:500">' + escapeHtml(h.code) + '</td>' +
              '<td>' + escapeHtml(h.type) + '</td>' +
              '<td>' + escapeHtml(h.quota) + '</td>' +
              '<td><span class="status-tag ' + stClass + '">' + escapeHtml(h.status) + '</span></td>' +
              '<td>' + escapeHtml(h.expiresAt || '—') + '</td></tr>';
          }).join('');
        } else {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:32px; color:var(--muted)">' + window.L('adLicHistEmpty') + '</td></tr>';
        }
        // Fetch prices + per-tier upgrade quotes, then render the plan cards.
        Promise.all([
          new Promise(function (r) { google.script.run.withSuccessHandler(r).withFailureHandler(function () { r({}); }).getSalesConfig(); }),
          new Promise(function (r) { google.script.run.withSuccessHandler(r).withFailureHandler(function () { r({ options: [] }); }).getUpgradeOptions(); })
        ]).then(function (arr) { renderPlans(tier, arr[0] || {}, arr[1] || { options: [] }); });
      })
      .withFailureHandler(function (err) {
        document.getElementById('errorBanner').innerHTML = window.L('adLicErrLoadStatus') + escapeHtml((err && err.message) || '');
        document.getElementById('errorBanner').style.display = 'block';
      })
      .getLicenseStatus();
  }
  load();
  // Dynamically-rendered content (current-plan card, plan cards, history) is built with
  // window.L at load time, so re-fetch + re-render when the language switches.
  if (window.AppState && typeof window.AppState.on === 'function') {
    window.AppState.on('lang-changed', function () { load(); });
  }

  // Name + tagline are presentational; the FEATURE list & limits now come from config.
  var TIER_DEFS = [
    { id: 'free',    nameKey: 'adLicTierFreeName',    tagKey: 'adLicTierFreeTag' },
    { id: 'starter', nameKey: 'adLicTierStarterName', tagKey: 'adLicTierStarterTag' },
    { id: 'pro',     nameKey: 'adLicTierProName',     tagKey: 'adLicTierProTag' },
    { id: 'team',    nameKey: 'adLicTierTeamName',    tagKey: 'adLicTierTeamTag' }
  ];
  var FEATURE_LABEL_KEY = { payment: 'adLicFeatPayment', csvExport: 'adLicFeatCsvExport', ai: 'adLicFeatAi', eventAi: 'adLicFeatEventAi', scoring: 'adLicFeatScoring', multiJudge: 'adLicFeatMultiJudge', campaigns: 'adLicFeatCampaigns', checkin: 'adLicFeatCheckin', waitlist: 'adLicFeatWaitlist', certificate: 'adLicFeatCertificate' };
  var FEATURE_ORDER = ['payment','csvExport','scoring','multiJudge','campaigns','checkin','waitlist','eventAi','ai','certificate'];
  var DEFAULT_PLANS_FE = {
    free:    { price:0,     feePct:5, maxActiveEvents:1,  maxCapacity:60,   features:{ payment:true, csvExport:false, ai:false, eventAi:false, scoring:false, multiJudge:false, campaigns:false, checkin:false, waitlist:false, certificate:false } },
    starter: { price:4990,  feePct:3, maxActiveEvents:3,  maxCapacity:300,  features:{ payment:true, csvExport:true,  ai:false, eventAi:true,  scoring:true,  multiJudge:false, campaigns:false, checkin:true,  waitlist:true,  certificate:false } },
    pro:     { price:13990, feePct:2, maxActiveEvents:15, maxCapacity:1500, features:{ payment:true, csvExport:true,  ai:true,  eventAi:true,  scoring:true,  multiJudge:true,  campaigns:true,  checkin:true,  waitlist:true,  certificate:false } },
    team:    { price:39900, feePct:1, maxActiveEvents:0,  maxCapacity:0,    features:{ payment:true, csvExport:true,  ai:true,  eventAi:true,  scoring:true,  multiJudge:true,  campaigns:true,  checkin:true,  waitlist:true,  certificate:false } }
  };
  function _lim(n){ return (n === 0 || n == null) ? window.L('adLicUnlimited') : Number(n).toLocaleString(); }
  var TIER_RANK_FE = { free: 0, starter: 1, pro: 2, team: 3 };
  var UPG = {};   // tier → quote { amount, credit, newPrice, remainingDays, canBuy }
  // Substitute {token} placeholders in an i18n string with provided values.
  function _fmt(key, vars) {
    return window.L(key).replace(/\{(\w+)\}/g, function (m, k) { return (vars && vars[k] != null) ? vars[k] : m; });
  }
  // Prefer the backend per-tier localized name/tagline; fall back to TIER_DEFS keys.
  function _tierName(p, t) {
    var lang = window.LANG || 'zh';
    if (p && p.name && p.name[lang]) return p.name[lang];
    return window.L(t.nameKey);
  }
  function _tierTag(p, t) {
    var lang = window.LANG || 'zh';
    if (p && p.tagline && p.tagline[lang]) return p.tagline[lang];
    return window.L(t.tagKey);
  }
  function renderPlans(curTier, cfg, upgRes) {
    var plans = (cfg && cfg.plans) || DEFAULT_PLANS_FE;
    var curRank = TIER_RANK_FE[curTier || 'free'] || 0;
    UPG = {};
    ((upgRes && upgRes.options) || []).forEach(function (o) { UPG[o.newTier] = o; });
    var grid = document.getElementById('plansGrid');
    grid.innerHTML = TIER_DEFS.map(function (t) {
      var p = plans[t.id] || DEFAULT_PLANS_FE[t.id] || {};
      var feats = p.features || {};
      var isCur = (curTier || 'free') === t.id;
      var rank = TIER_RANK_FE[t.id] || 0;
      var price = Number(p.price) || 0;
      var priceStr = price > 0 ? ('$' + price.toLocaleString()) : '$0';
      var q = UPG[t.id];
      var btn, upgNote = '';
      if (isCur) btn = '<div class="btn-plan">' + window.L('adLicCurPlan') + '</div>';
      else if (rank < curRank) btn = '<div class="btn-plan" style="opacity:.4">' + window.L('adLicLowerPlan') + '</div>';
      else if (t.id === 'free') btn = '<div class="btn-plan" style="opacity:.45">' + window.L('adLicFree') + '</div>';
      else if (price <= 0) btn = '<div class="btn-plan" style="opacity:.45" title="' + window.L('adLicNoPriceTitle') + '">' + window.L('adLicNotOpen') + '</div>';
      else if (q && q.canBuy) {
        // Upgrade from a paid tier shows the prorated differential; from Free shows full price.
        if (q.isUpgrade && q.credit > 0) {
          btn = '<button class="btn-plan" data-buy="' + t.id + '" data-amt="' + q.amount + '" style="background:var(--ink); color:var(--surface); border:0; cursor:pointer">' + _fmt('adLicUpgradeBtn', { amt: q.amount.toLocaleString() }) + '</button>';
          upgNote = '<li style="border-top:1px dashed var(--line); margin-top:6px; padding-top:6px; color:var(--acc)"><b>' + _fmt('adLicUpgradeNoteHead', { amt: q.amount.toLocaleString() }) + '</b><br><span style="font:400 10.5px/1.4 var(--f-tc); color:var(--muted)">' + _fmt('adLicUpgradeNoteSub', { days: q.remainingDays, credit: q.credit.toLocaleString() }) + '</span></li>';
        } else {
          btn = '<button class="btn-plan" data-buy="' + t.id + '" data-amt="' + q.amount + '" style="background:var(--ink); color:var(--surface); border:0; cursor:pointer">' + _fmt('adLicBuyNowAmt', { amt: q.amount.toLocaleString() }) + '</button>';
        }
      } else {
        btn = '<button class="btn-plan" data-buy="' + t.id + '" data-amt="' + price + '" style="background:var(--ink); color:var(--surface); border:0; cursor:pointer">' + window.L('adLicBuyNowArrow') + '</button>';
      }
      var limRows = '<li>' + window.L('adLicLimActiveEvents') + _lim(p.maxActiveEvents) + '</li><li>' + window.L('adLicLimCapacity') + _lim(p.maxCapacity) + '</li>';
      var featRows = FEATURE_ORDER.filter(function (k) { return feats[k] === true; })
        .map(function (k) { return '<li>' + window.L(FEATURE_LABEL_KEY[k]) + '</li>'; }).join('');
      var feeRow = '<li style="border-top:1px solid var(--line-2); margin-top:6px; padding-top:6px"><b>' + window.L('adLicFeePrefix') + (Number(p.feePct) || 0).toFixed(1) + '%</b><br><span style="font:400 11px/1.4 var(--f-tc); color:var(--muted)">' + window.L('adLicFeeNote') + '</span></li>';
      return '<div class="plan' + (isCur ? ' cur' : '') + '"><h4>' + escapeHtml(_tierName(p, t)) + '</h4><p class="tag">' + escapeHtml(_tierTag(p, t)) + '</p>' +
        '<div class="price"><span class="num">' + priceStr + '</span><span class="per">' + (price > 0 ? window.L('adLicPerYear') : '') + '</span></div>' +
        '<ul>' + limRows + featRows + feeRow + upgNote + '</ul>' + btn + '</div>';
    }).join('');
    grid.querySelectorAll('[data-buy]').forEach(function (b) {
      b.addEventListener('click', function () { purchaseTier(b.dataset.buy, parseInt(b.dataset.amt, 10) || 0, b); });
    });
    if (typeof window.applyI18n === 'function') window.applyI18n();
  }
  function purchaseTier(tier, amount, btn) {
    var q = UPG[tier];
    var label = (tier || '').toUpperCase();
    var msg = q && q.isUpgrade && q.credit > 0
      ? _fmt('adLicConfirmUpgrade', { label: label, amt: (amount || q.amount).toLocaleString(), days: q.remainingDays, credit: q.credit.toLocaleString() })
      : _fmt('adLicConfirmBuy', { label: label, amt: (amount || (q && q.amount) || 0).toLocaleString() });
    uiConfirm(msg, { title: window.L('adLicConfirmTitle'), okText: window.L('adLicConfirmOk') }).then(function (ok) {
      if (!ok) return;
      // T0 stopgap: lock the whole plan grid the instant the buy is confirmed.
      // createPayuniOrder has no backend idempotency, so a 1-3s double-click would
      // mint a second pending order (orphan / possible double charge). The real fix
      // is backend idempotency (tracked separately); this just shuts the window.
      var allBtns = Array.prototype.slice.call(document.querySelectorAll('[data-buy]'));
      var busyLabel = (window.LANG === 'en') ? 'Creating order…' : '建立訂單中…';
      var origText = btn ? btn.textContent : '';
      allBtns.forEach(function (el) { el.disabled = true; });
      if (btn) btn.textContent = busyLabel;
      function unlock() { allBtns.forEach(function (el) { el.disabled = false; }); if (btn) btn.textContent = origText; }
      // Stash so payuni-return.html can route the buyer back to this page.
      try { localStorage.setItem('regmaster_pending_plan', JSON.stringify({ tier: tier, ts: Date.now() })); } catch (e) {}
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.success && res.payuni) submitPayuni(res.payuni); // navigates away; keep grid locked
          else { unlock(); uiAlert((res && res.message) || window.L('adLicOrderFail')); }
        })
        .withFailureHandler(function (e) { unlock(); uiAlert(window.L('adLicErrFail') + (e && e.message)); })
        .createPayuniOrder([{ type: 'tier', tier: tier, years: 1 }], '', me.username);
    });
  }
  function submitPayuni(p) {
    var f = document.createElement('form');
    f.method = 'POST'; f.action = p.action; f.style.display = 'none';
    [['MerID', p.MerID], ['Version', p.Version], ['EncryptInfo', p.EncryptInfo], ['HashInfo', p.HashInfo]].forEach(function (kv) {
      var i = document.createElement('input'); i.type = 'hidden'; i.name = kv[0]; i.value = kv[1]; f.appendChild(i);
    });
    document.body.appendChild(f); f.submit();
  }

  document.getElementById('activateBtn').addEventListener('click', function () {
    var code = document.getElementById('licCodeInput').value.trim().toUpperCase();
    if (!code) return alert(window.L('adLicAlertNoCode'));
    var btn = this; btn.disabled = true; btn.textContent = window.L('adLicActivating');
    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false; btn.textContent = window.L('adLicActivateBtn');
        if (res && res.success) {
          alert(window.L('adLicActivateOk') + (res.expiresAt ? _fmt('adLicActivateOkUntil', { date: res.expiresAt }) : ''));
          document.getElementById('licCodeInput').value = '';
          load();
        } else {
          alert((res && res.message) || window.L('adLicActivateFail'));
        }
      })
      .withFailureHandler(function (err) { btn.disabled = false; btn.textContent = window.L('adLicActivateBtn'); alert(window.L('adLicErrFail') + (err && err.message)); })
      .activateLicense(code, me.username);
  });
})();
</script>
</body>
</html>
