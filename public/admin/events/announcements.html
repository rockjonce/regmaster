<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公告 / EDM · 主辦後台 · RegMaster</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/shared/styles.css">
<link rel="stylesheet" href="/shared/admin-layout.css">
<script src="/__/firebase/10.7.1/firebase-app-compat.js"></script>
<script src="/__/firebase/10.7.1/firebase-functions-compat.js"></script>
<script src="/__/firebase/init.js"></script>
<script src="/shared/firebase-bridge.js"></script>
<script src="/shared/ui-dialog.js"></script>
<style>
.main-3 { display:grid; grid-template-columns:300px 1fr 320px; min-height:calc(100vh - 60px); }
.left-c { background:var(--surface); border-right:1px solid var(--line); padding:18px; overflow-y:auto; }
.left-c h3 { font:700 14px/1.2 var(--f-display); margin-bottom:12px; }
.new-camp-btn { width:100%; padding:10px; background:var(--ink); color:white; border-radius:8px; font:600 13px/1 var(--f-tc); margin-bottom:14px; }
.new-camp-btn:hover { background:var(--ink-2); }
.camp-list { display:flex; flex-direction:column; gap:8px; }
.camp { padding:12px 14px; background:var(--surface-2); border:1px solid var(--line-2); border-radius:8px; cursor:pointer; transition:.15s; }
.camp:hover { background:var(--surface); border-color:var(--ink-3); }
.camp.on { background:var(--surface); border-color:var(--ink); box-shadow:var(--ring); }
.camp .top { display:flex; gap:8px; align-items:center; margin-bottom:6px; }
.camp .st { padding:2px 6px; border-radius:4px; font:600 10px/1.3 var(--f-mono); }
.camp .st.draft { background:var(--surface); color:var(--muted); }
.camp .st.sent { background:color-mix(in srgb, var(--ok-500) 14%, transparent); color:var(--ok-700); }
.camp .st.scheduled { background:color-mix(in srgb, var(--amber-500) 14%, transparent); color:var(--warn-700); }
.camp .ch-icons { display:flex; gap:3px; margin-left:auto; font:600 10px/1 var(--f-mono); color:var(--muted); }
.camp h4 { font:600 13.5px/1.3 var(--f-display); margin-bottom:4px; }
.camp .meta { font:500 11px/1.4 var(--f-mono); color:var(--muted); }

.center-c { display:flex; flex-direction:column; min-height:0; background:var(--bg); }
.editor-h { padding:18px 28px; background:var(--surface); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; }
.editor-h h2 { font:700 18px/1.2 var(--f-display); flex:1; }
.editor-h h2 input { width:100%; max-width:500px; border:0; background:transparent; font:inherit; padding:4px 6px; border-radius:5px; }
.editor-h h2 input:hover, .editor-h h2 input:focus { background:var(--surface-2); outline:0; }
.editor-h .actions { display:flex; gap:8px; }
.compose { flex:1; overflow-y:auto; padding:24px 28px; }
.cmp-meta { padding:18px; background:var(--surface); border:1px solid var(--line); border-radius:10px; margin-bottom:14px; }
.cmp-meta .r { display:flex; gap:14px; padding:8px 0; border-bottom:1px solid var(--line-2); align-items:center; }
.cmp-meta .r:last-child { border-bottom:0; }
.cmp-meta .lbl { width:80px; font:500 12px/1.4 var(--f-mono); color:var(--muted); flex-shrink:0; }
.cmp-meta .val { flex:1; font:400 13px/1.4 var(--f-tc); color:var(--ink-2); }
.cmp-meta .val select, .cmp-meta .val input { width:100%; padding:8px 12px; background:var(--surface); border:1px solid var(--line); border-radius:7px; font:inherit; }
.channel-pills { display:flex; gap:6px; flex-wrap:wrap; }
.channel-pill { padding:6px 12px; border:1px solid var(--line); border-radius:6px; font:500 12px/1 var(--f-tc); cursor:pointer; background:var(--surface); display:flex; gap:5px; align-items:center; }
.channel-pill.on { background:var(--ink); color:white; border-color:var(--ink); }
.channel-pill.disabled { opacity:.4; cursor:not-allowed; }
.channel-pill .soon { font:600 9.5px/1 var(--f-mono); padding:2px 4px; background:rgba(245,158,11,.14); color:var(--warn-700); border-radius:3px; margin-left:4px; }
.email-canvas { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:32px 28px; max-width:680px; margin:0 auto; }
.email-canvas h1 { font:800 22px/1.2 var(--f-display); margin-bottom:14px; }
.email-canvas h1 input { width:100%; border:0; background:transparent; font:inherit; padding:2px 0; outline:0; }
.email-canvas .body-edit { font:400 14.5px/1.7 var(--f-tc); color:var(--ink-2); }
.email-canvas .body-edit textarea { width:100%; border:0; background:transparent; resize:vertical; min-height:240px; font:inherit; color:inherit; outline:0; }

.right-c { background:var(--surface); border-left:1px solid var(--line); padding:18px; overflow-y:auto; }
.right-c h4 { font:600 12px/1 var(--f-mono); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:14px; }
.recipient-card { padding:14px; background:var(--surface-2); border:1px solid var(--line-2); border-radius:9px; margin-bottom:14px; }
.recipient-card .v { font:800 28px/1 var(--f-display); margin-bottom:4px; }
.recipient-card .l { font:500 11.5px/1.4 var(--f-mono); color:var(--muted); }
.stats-row { padding:14px; background:var(--surface-2); border:1px solid var(--line-2); border-radius:9px; font:400 13px/1.5 var(--f-tc); margin-bottom:14px; }
.stats-row b { color:var(--ink); font-weight:600; }
.help-tip { padding:12px 14px; background:var(--acc-soft); border:1px solid color-mix(in srgb, var(--acc) 20%, var(--line)); border-radius:9px; font:400 12px/1.55 var(--f-tc); color:var(--ink-2); }
.recip-team { padding:8px 10px; border:1px solid var(--line-2); border-radius:8px; margin-bottom:6px; background:var(--surface-2); }
.recip-team .tn { font:600 12px/1.4 var(--f-display); color:var(--ink); margin-bottom:2px; }
.recip-team .em { font:400 11px/1.5 var(--f-mono); color:var(--muted); word-break:break-all; }
.camp .camp-del { margin-left:6px; color:var(--err-700); cursor:pointer; font:700 14px/1 var(--f-tc); padding:0 4px; opacity:.6; }
.camp .camp-del:hover { opacity:1; }
.pv-bg { position:fixed; inset:0; background:rgba(11,28,61,.55); display:grid; place-items:center; z-index:9999; padding:20px; }
.pv-card { background:var(--surface); border-radius:14px; max-width:680px; width:100%; max-height:90vh; overflow:hidden; display:flex; flex-direction:column; box-shadow:var(--sh-lg); }
.pv-h { padding:12px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
.pv-h h3 { font:700 15px/1.2 var(--f-display); }
.pv-body { overflow:auto; background:#f0f4f8; padding:0; }
.pv-body iframe { width:100%; border:0; min-height:60vh; display:block; }
@media (max-width:768px){ .main-3 { grid-template-columns:1fr; min-height:0; } }
</style>
</head>
<body>
<div class="admin">
  <aside class="side">
    <a class="brand" href="/admin/"><div class="logo"><img src="/favicon.png" alt="RegMaster" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block"></div><div class="nm">RegMaster<small>主辦後台</small></div></a>
    <div class="org-switcher"><div class="av" id="orgAv">—</div><div class="body"><h6 id="orgName">—</h6><p>主辦方</p></div></div>
    <div class="nav-grp">
      <div class="l-grp">概覽</div>
      <a class="nav-it" href="/admin/"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/></svg>儀表板</a>
      <a class="nav-it" href="/admin/events/"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3M3 11h18"/></svg>所有活動</a>
    </div>
    <div class="nav-grp">
      <div class="l-grp">本活動</div>
      <a class="nav-it" id="hubLink"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M3 3h18v18H3z"/></svg>總覽</a>
      <a class="nav-it" id="editLink"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg>設定</a>
      <a class="nav-it on"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5"/></svg>公告 / EDM</a>
      <a class="nav-it" id="paymentsLink"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M3 10h18"/></svg>付款</a>
      <a class="nav-it" id="scoringLink"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4"/></svg>評分</a>
      <a class="nav-it" id="checkinLink"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M3 11h8V3H3v8z"/></svg>報到</a>
    </div>
  </aside>
  <main>
    <header class="head">
      <div class="crumbs"><a href="/admin/">主辦後台</a><span class="sep">/</span><a href="/admin/events/">活動</a><span class="sep">/</span><a id="crumbHub">—</a><span class="sep">/</span><b>公告 / EDM</b></div>
      <div class="actions"><div class="me-h"><div class="av-c" id="meAv">—</div><span id="meName">—</span></div></div>
    </header>
    <div id="loadingState" class="loading-c">載入公告⋯</div>
    <div class="main-3" id="content" style="display:none">
      <aside class="left-c">
        <h3>所有範本</h3>
        <button class="new-camp-btn" id="newCampBtn">＋ 新增範本</button>
        <div class="camp-list" id="campList"></div>
      </aside>
      <section class="center-c">
        <header class="editor-h">
          <h2><input id="campTitle" placeholder="範本標題"></h2>
          <div class="actions">
            <button class="btn btn-ghost btn-sm" id="previewBtn">🔍 預覽</button>
            <button class="btn btn-ghost btn-sm" id="saveCampBtn">儲存草稿</button>
            <button class="btn btn-primary btn-sm" id="sendNowBtn">立即發送 →</button>
          </div>
        </header>
        <div class="compose">
          <div class="cmp-meta">
            <div class="r"><div class="lbl">通道</div><div class="val">
              <div class="channel-pills">
                <span class="channel-pill on" data-ch="email">📧 Email</span>
                <span class="channel-pill disabled" data-ch="sms">📱 SMS<span class="soon">即將</span></span>
                <span class="channel-pill disabled" data-ch="line">💬 LINE<span class="soon">即將</span></span>
              </div>
            </div></div>
            <div class="r"><div class="lbl">收件對象</div><div class="val">
              <select id="recipFilter">
                <option value="all">所有報名者</option>
                <option value="paid">已付款</option>
                <option value="unpaid">未付款</option>
                <option value="waitlist">候補</option>
              </select>
            </div></div>
            <div class="r"><div class="lbl">主旨</div><div class="val"><input id="subjectInput" placeholder="例：場地調整通知"></div></div>
          </div>
          <div class="email-canvas">
            <h1><input id="bodyTitleInput" placeholder="信件標題（讀者第一眼看到）"></h1>
            <div class="body-edit"><textarea id="bodyContent" placeholder="開始寫信⋯&#10;&#10;可使用換行符。系統會自動套上 RegMaster 模板（含 logo、頁尾）。"></textarea></div>
          </div>
        </div>
      </section>
      <aside class="right-c">
        <h4>預計收件人</h4>
        <div class="recipient-card">
          <div class="v" id="recipCount">—</div>
          <div class="l">符合條件的 Email 數</div>
        </div>
        <div id="recipList" style="margin-bottom:14px; max-height:320px; overflow-y:auto"></div>
        <h4 style="margin-top:18px">傳送統計</h4>
        <div class="stats-row" id="statsBox">尚未發送</div>
        <div class="help-tip">💡 Email 範本含 RegMaster 標題列、頁尾與 footer。<br><br>SMS / LINE 通道將於後續整合上線。</div>
      </aside>
    </div>
  </main>
</div>
<script src="/shared/app-state.js"></script>
<script src="/shared/admin-nav.js"></script>
<script>
(function(){
  AppState.init();
  var me = AppState.getMe();
  if (!me || !me.sessionToken) { location.href = '/login.html?next=' + encodeURIComponent(location.pathname); return; }
  var compId = '';
  var m = location.pathname.match(/\/admin\/events\/([^/]+)\/announcements/);
  if (m) compId = decodeURIComponent(m[1]); if (!compId) compId = new URLSearchParams(location.search).get('id') || '';
  if (!compId) { alert('未指定活動編號'); location.href = '/admin/events/'; return; }
  function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]; }); }
  ['hubLink','editLink','paymentsLink','scoringLink','checkinLink'].forEach(function (id) {
    var el = document.getElementById(id);
    var suffix = { hubLink: '', editLink: '/edit', paymentsLink: '/payments', scoringLink: '/scoring', checkinLink: '/checkin' }[id];
    if (el) el.href = '/admin/events/' + encodeURIComponent(compId) + suffix;
  });
  document.getElementById('orgAv').textContent = (me.displayName || me.username).charAt(0).toUpperCase();
  document.getElementById('orgName').textContent = me.displayName || me.username;
  document.getElementById('meAv').textContent = (me.displayName || me.username).charAt(0).toUpperCase();
  document.getElementById('meName').textContent = me.displayName || me.username;

  var CAMPS = [], SELECTED = null;
  var CHANNELS = ['email'];
  var CAN_SEND = true;   // resolved from the caller's plan (公告群發 = PRO+)
  google.script.run
    .withSuccessHandler(function (p) { CAN_SEND = !!(p && p.features && p.features.campaigns); applySendGate(); })
    .withFailureHandler(function () {})
    .getMyPlan();
  function applySendGate() {
    var btn = document.getElementById('sendNowBtn');
    if (!btn) return;
    if (!CAN_SEND) {
      btn.title = '公告群發為 Pro 以上方案功能';
      btn.style.opacity = '.55';
    } else { btn.title = ''; btn.style.opacity = ''; }
  }

  function load() {
    Promise.all([
      new Promise(function (res) { google.script.run.withSuccessHandler(res).withFailureHandler(function () { res([]); }).listCampaigns(compId); }),
      new Promise(function (res) { google.script.run.withSuccessHandler(res).withFailureHandler(function () { res({}); }).getRegistrationBundle(compId); })
    ]).then(function (r) {
      CAMPS = r[0] || [];
      var bundle = r[1] || {};
      var cfg = bundle.config || {};
      document.getElementById('crumbHub').href = '/admin/events/' + encodeURIComponent(compId);
      document.getElementById('crumbHub').textContent = cfg.competitionName || compId;
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('content').style.display = 'grid';
      renderList();
      // BUGFIX M3 (Phase 9.1): no longer auto-create draft on empty state.
      // Previously this fired createCampaign() during page load, polluting the
      // collection. Now we show an empty-state prompt; user must click "+ 新增".
      if (CAMPS.length > 0) selectCamp(CAMPS[0]);
      else showEmptyEditor();
      updateRecipCount();
    });
  }

  function showEmptyEditor() {
    SELECTED = null;
    document.getElementById('campTitle').value = '';
    document.getElementById('campTitle').placeholder = '尚未選擇範本 — 請點左側「＋ 新增範本」';
    document.getElementById('subjectInput').value = '';
    document.getElementById('subjectInput').disabled = true;
    document.getElementById('bodyTitleInput').value = '';
    document.getElementById('bodyContent').value = '';
    document.getElementById('bodyContent').disabled = true;
    document.getElementById('saveCampBtn').disabled = true;
    document.getElementById('sendNowBtn').disabled = true;
    document.getElementById('previewBtn').disabled = true;
    document.getElementById('statsBox').textContent = '請先建立或選擇範本';
  }

  function renderList() {
    var list = document.getElementById('campList');
    if (CAMPS.length === 0) { list.innerHTML = '<p style="color:var(--muted); padding:14px 0; text-align:center; font:500 12px/1.5 var(--f-tc)">尚無範本</p>'; return; }
    list.innerHTML = CAMPS.map(function (c) {
      var chIcons = c.channels.map(function (x) { return x === 'email' ? '📧' : x === 'sms' ? '📱' : '💬'; }).join('');
      return '<div class="camp" data-id="' + c.id + '">' +
        '<div class="top"><span class="st ' + (c.status || 'draft') + '">' + (c.status === 'sent' ? '已發送' : c.status === 'scheduled' ? '已排程' : '草稿') + '</span><span class="ch-icons">' + chIcons + '</span><span class="camp-del" data-del="' + c.id + '" title="刪除範本">✕</span></div>' +
        '<h4>' + escapeHtml(c.subject || '(無標題)') + '</h4>' +
        '<div class="meta">' + escapeHtml(c.createdAt || '') + ' · 收件 ' + ((c.stats && c.stats.sent) || 0) + '</div>' +
      '</div>';
    }).join('');
    list.querySelectorAll('.camp').forEach(function (el) {
      el.addEventListener('click', function () {
        var c = CAMPS.find(function (x) { return x.id === el.dataset.id; });
        if (c) selectCamp(c);
      });
    });
    list.querySelectorAll('[data-del]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var id = b.dataset.del;
        var c = CAMPS.find(function (x) { return x.id === id; });
        uiConfirm('確定刪除範本「' + ((c && c.subject) || '') + '」？此操作無法復原。', { title: '刪除範本', okText: '刪除', danger: true }).then(function (ok) {
          if (!ok) return;
          google.script.run
            .withSuccessHandler(function (res) {
              if (res && res.success) { if (SELECTED && SELECTED.id === id) SELECTED = null; load(); }
              else uiAlert((res && res.message) || '刪除失敗');
            })
            .withFailureHandler(function (err) { uiAlert('失敗：' + (err && err.message)); })
            .deleteCampaign(id);
        });
      });
    });
  }

  function selectCamp(c) {
    SELECTED = c;
    document.querySelectorAll('.camp').forEach(function (x) { x.classList.toggle('on', x.dataset.id === c.id); });
    document.getElementById('campTitle').value = c.subject || '';
    document.getElementById('campTitle').placeholder = '範本標題';
    document.getElementById('subjectInput').value = c.subject || '';
    document.getElementById('subjectInput').disabled = false;
    document.getElementById('bodyTitleInput').value = c.subject || '';
    document.getElementById('bodyContent').value = c.body || '';
    document.getElementById('bodyContent').disabled = false;
    document.getElementById('saveCampBtn').disabled = false;
    document.getElementById('previewBtn').disabled = false;
    document.getElementById('recipFilter').value = c.recipientFilter || 'all';
    CHANNELS = (c.channels || ['email']).slice();
    document.querySelectorAll('.channel-pill').forEach(function (p) {
      p.classList.toggle('on', !p.classList.contains('disabled') && CHANNELS.includes(p.dataset.ch));
    });
    updateRecipCount();
    var stats = c.stats || {};
    document.getElementById('statsBox').innerHTML = c.status === 'sent'
      ? '✓ 已發送於 <b>' + escapeHtml(c.sentAt || '') + '</b><br>收件數：<b>' + (stats.sent || 0) + '</b>'
      : '尚未發送';
    document.getElementById('sendNowBtn').disabled = (c.status === 'sent');
  }

  function createDraft() {
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.success) {
          load();
        }
      })
      .createCampaign(compId, { subject: '新公告 ' + new Date().toLocaleString(), body: '', channels: ['email'], recipientFilter: 'all' });
  }
  document.getElementById('newCampBtn').addEventListener('click', createDraft);

  function updateRecipCount() {
    var filter = document.getElementById('recipFilter').value;
    document.getElementById('recipCount').textContent = '⋯';
    document.getElementById('recipList').innerHTML = '';
    google.script.run
      .withSuccessHandler(function (res) {
        res = res || {};
        document.getElementById('recipCount').textContent = (res.total != null ? res.total : 0);
        var teams = res.teams || [];
        document.getElementById('recipList').innerHTML = teams.length
          ? teams.map(function (t) {
              return '<div class="recip-team"><div class="tn">' + escapeHtml(t.teamName) +
                '<span style="color:var(--muted); font-weight:400"> · ' + t.emails.length + ' 封</span></div>' +
                '<div class="em">' + t.emails.map(escapeHtml).join('、') + '</div></div>';
            }).join('')
          : '<p style="color:var(--muted); font:400 12px/1.5 var(--f-tc); padding:6px 0">此條件下沒有可寄送的 Email。</p>';
      })
      .withFailureHandler(function () { document.getElementById('recipCount').textContent = '?'; document.getElementById('recipList').innerHTML = ''; })
      .getCampaignRecipients(compId, filter);
  }
  document.getElementById('recipFilter').addEventListener('change', updateRecipCount);

  document.querySelectorAll('.channel-pill').forEach(function (p) {
    if (p.classList.contains('disabled')) return;
    p.addEventListener('click', function () {
      p.classList.toggle('on');
      CHANNELS = Array.from(document.querySelectorAll('.channel-pill.on')).map(function (x) { return x.dataset.ch; });
    });
  });

  // Sync title fields
  document.getElementById('campTitle').addEventListener('input', function (e) {
    document.getElementById('subjectInput').value = e.target.value;
    document.getElementById('bodyTitleInput').value = e.target.value;
  });
  document.getElementById('subjectInput').addEventListener('input', function (e) {
    document.getElementById('campTitle').value = e.target.value;
    document.getElementById('bodyTitleInput').value = e.target.value;
  });
  document.getElementById('bodyTitleInput').addEventListener('input', function (e) {
    document.getElementById('campTitle').value = e.target.value;
    document.getElementById('subjectInput').value = e.target.value;
  });

  document.getElementById('saveCampBtn').addEventListener('click', function () {
    if (!SELECTED) return alert('請先選一個範本');
    var payload = {
      subject: document.getElementById('subjectInput').value.trim(),
      body: document.getElementById('bodyContent').value,
      channels: CHANNELS,
      recipientFilter: document.getElementById('recipFilter').value
    };
    var btn = this; btn.disabled = true; btn.textContent = '儲存中⋯';
    google.script.run
      .withSuccessHandler(function () { btn.disabled = false; btn.textContent = '儲存草稿'; load(); })
      .withFailureHandler(function (err) { btn.disabled = false; btn.textContent = '儲存草稿'; alert('失敗：' + (err && err.message)); })
      .updateCampaign(SELECTED.id, payload);
  });

  document.getElementById('sendNowBtn').addEventListener('click', function () {
    if (!SELECTED) return;
    var btn = this;
    if (!CAN_SEND) {
      uiAlert('公告群發（EDM）為 Pro 以上方案功能。\n升級至 Pro 後，即可一次將公告 Email 寄送給符合條件的所有報名者（可依已付款 / 未付款 / 候補篩選）。\n\n請至「方案與授權」頁升級方案，或聯繫客服洽詢。', { title: '需要升級方案', okText: '前往升級' }).then(function () { location.href = '/admin/license.html'; });
      return;
    }
    uiConfirm('立即發送給 ' + document.getElementById('recipCount').textContent + ' 位收件人？', { title: '發送公告', okText: '立即發送' }).then(function (ok) {
    if (!ok) return;
    var payload = {
      subject: document.getElementById('subjectInput').value.trim(),
      body: document.getElementById('bodyContent').value,
      channels: CHANNELS,
      recipientFilter: document.getElementById('recipFilter').value
    };
    btn.disabled = true; btn.textContent = '發送中⋯';
    // Save first then send
    google.script.run
      .withSuccessHandler(function () {
        google.script.run
          .withSuccessHandler(function (res) {
            if (res && res.success) {
              alert('✓ 已發送 ' + res.sent + ' 封 Email' + (res.channels.length > 1 ? '（SMS/LINE 已記錄為排程，待後續整合）' : ''));
              load();
            } else { alert('發送失敗：' + ((res && res.message) || '')); }
            btn.disabled = false; btn.textContent = '立即發送 →';
          })
          .withFailureHandler(function (err) { btn.disabled = false; btn.textContent = '立即發送 →'; alert('失敗：' + (err && err.message)); })
          .sendCampaignNow(SELECTED.id);
      })
      .withFailureHandler(function (err) { btn.disabled = false; btn.textContent = '立即發送 →'; alert('儲存失敗：' + (err && err.message)); })
      .updateCampaign(SELECTED.id, payload);
    });
  });

  // ----- Item 12: email preview (internal modal, RegMaster template) -----
  function buildPreviewHtml(subject, bodyText) {
    var body = escapeHtml(bodyText || '').replace(/\n/g, '<br>');
    var LOGO = 'https://regmaster-v3.web.app/favicon.png';
    return '<!DOCTYPE html><html><head><meta charset="utf-8"></head>' +
      '<body style="margin:0;padding:0;background:#f0f4f8;font-family:Segoe UI,Roboto,Arial,sans-serif">' +
      '<table cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#f0f4f8"><tr><td align="center" style="padding:20px 10px">' +
      '<table cellpadding="0" cellspacing="0" border="0" width="600" style="max-width:600px;background:#fff;border:1px solid #d1d9e0">' +
      '<tr><td style="background:#0A437A;padding:12px 24px"><img src="' + LOGO + '" alt="RegMaster" height="40" style="height:40px;display:block;border:0"></td></tr>' +
      '<tr><td style="background:#0D5BA8;padding:18px 24px;text-align:center"><h2 style="margin:0;font-size:20px;font-weight:800;color:#fff">' + escapeHtml(subject || '活動公告') + '</h2></td></tr>' +
      '<tr><td style="padding:28px 24px;background:#fff;color:#333;font-size:15px;line-height:1.7">' + body + '</td></tr>' +
      '<tr><td style="background:#f1f5f9;padding:16px 24px;text-align:center;font-size:12px;color:#64748b"><div>Copyright © RegMaster Pro</div><div style="margin-top:4px;color:#94a3b8">此為系統自動發送之信件，請勿直接回覆。</div></td></tr>' +
      '</table></td></tr></table></body></html>';
  }
  document.getElementById('previewBtn').addEventListener('click', function () {
    var subject = document.getElementById('subjectInput').value.trim() || '活動公告';
    var html = buildPreviewHtml(subject, document.getElementById('bodyContent').value);
    var bg = document.createElement('div'); bg.className = 'pv-bg';
    bg.innerHTML = '<div class="pv-card"><div class="pv-h"><h3>📧 信件預覽（套用 RegMaster 範本）</h3><button class="btn btn-ghost btn-sm" id="pvClose">關閉</button></div><div class="pv-body"><iframe id="pvFrame" title="email preview"></iframe></div></div>';
    document.body.appendChild(bg);
    bg.querySelector('#pvFrame').srcdoc = html;
    function close() { if (bg.parentNode) bg.parentNode.removeChild(bg); }
    bg.addEventListener('click', function (e) { if (e.target === bg) close(); });
    bg.querySelector('#pvClose').addEventListener('click', close);
  });

  load();
})();
</script>
</body>
</html>
