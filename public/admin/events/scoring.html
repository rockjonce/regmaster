<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="aeScoreDocTitle">評分 · 主辦後台 · RegMaster</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/shared/styles.css">
<link rel="stylesheet" href="/shared/admin-layout.css">
<script src="/__/firebase/10.7.1/firebase-app-compat.js"></script>
<script src="/__/firebase/10.7.1/firebase-functions-compat.js"></script>
<script src="/__/firebase/init.js"></script>
<script src="/shared/firebase-bridge.js"></script>
<script src="/shared/ui-dialog.js"></script>
<style>
.body-3 { display:grid; grid-template-columns:360px 1fr; min-height:calc(100vh - 60px); }
.left-c { background:var(--surface); border-right:1px solid var(--line); padding:18px; overflow-y:auto; }
.lc-h { padding-bottom:14px; border-bottom:1px solid var(--line-2); margin-bottom:14px; }
.lc-h h3 { font:700 16px/1.2 var(--f-display); display:flex; align-items:center; gap:8px; }
.lc-h .live-pill { padding:3px 8px; background:linear-gradient(135deg, var(--ok-500), #047857); color:white; border-radius:var(--r-sm); font:700 10px/1 var(--f-mono); margin-left:auto; }

.lb-row { display:grid; grid-template-columns:32px 1fr auto; gap:10px; padding:10px 12px; align-items:center; cursor:pointer; transition:.12s; border-bottom:1px solid var(--line-2); border-radius:var(--r-sm); }
.lb-row:hover { background:var(--surface-2); }
.lb-row.on { background:color-mix(in srgb, var(--acc) 8%, var(--surface)); border-left:3px solid var(--ink); padding-left:9px; }
.lb-row .rank { font:800 18px/1 var(--f-display); color:var(--muted); text-align:center; font-feature-settings:"tnum"; }
.lb-row.top-1 .rank { color:#D4A017; }
.lb-row.top-2 .rank { color:#9AA4BD; }
.lb-row.top-3 .rank { color:#CD7F32; }
.lb-row .nm { font:600 13.5px/1.3 var(--f-display); }
.lb-row .meta { font:500 10.5px/1.3 var(--f-mono); color:var(--muted); margin-top:2px; }
.lb-row .pts { font:800 16px/1 var(--f-display); font-feature-settings:"tnum"; }
.lb-row .pts small { display:block; font:500 9.5px/1 var(--f-mono); color:var(--muted); margin-top:3px; }

.center-c { padding:24px 28px; overflow-y:auto; max-width:1080px; margin:0 auto; width:100%; }
.cc-h { display:flex; align-items:center; gap:14px; padding:18px 22px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); margin-bottom:18px; }
.cc-h .av-l { width:48px; height:48px; border-radius:11px; background:linear-gradient(135deg, var(--ink), #1a2e52); color:white; display:grid; place-items:center; font:800 18px/1 var(--f-display); }
.cc-h h2 { font:700 19px/1.2 var(--f-display); margin-bottom:3px; }
.cc-h p { font:500 12px/1.4 var(--f-mono); color:var(--muted); margin:0; }

.score-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:18px; }
.score-card { padding:18px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); }
.score-card h4 { font:700 14px/1.2 var(--f-display); margin-bottom:10px; }
.score-card .input-row { display:flex; gap:10px; align-items:center; }
.score-card input { flex:1; padding:14px 16px; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-sm); font:800 28px/1 var(--f-display); text-align:center; font-feature-settings:"tnum"; color:var(--ink); }
.score-card input:focus { outline:0; border-color:var(--acc); box-shadow:var(--ring); }
.score-card .max { font:500 14px/1 var(--f-mono); color:var(--muted); }
.score-card .weight { font:500 10.5px/1 var(--f-mono); color:var(--muted); padding:2px 6px; background:var(--surface-2); border-radius:var(--r-sm); margin-left:auto; }
.score-card .input-row .stepper { display:flex; flex-direction:column; gap:2px; }
.score-card .input-row .stepper button { width:30px; height:24px; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-sm); cursor:pointer; }

.total-card { padding:24px; background:linear-gradient(135deg, var(--ink), #1a2e52); color:white; border-radius:var(--r-lg); display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
.total-card .l { font:500 11px/1 var(--f-mono); color:rgba(255,255,255,.6); letter-spacing:.06em; text-transform:uppercase; }
.total-card .v { font:800 48px/1 var(--f-display); margin-top:4px; }
.total-card .v em { font-style:normal; font-size:16px; opacity:.6; margin-left:6px; font-weight:500; }
.total-card .actions button { padding:10px 18px; border-radius:var(--r-sm); font:600 13px/1 var(--f-tc); cursor:pointer; }
.total-card .actions .btn-primary-w { background:white; color:var(--ink); border:0; }
.total-card .actions .btn-primary-w:hover { background:rgba(255,255,255,.9); }

.comment-card { padding:18px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); }
.comment-card label { font:500 12.5px/1.4 var(--f-tc); color:var(--ink-2); margin-bottom:8px; display:block; }
.comment-card textarea { width:100%; padding:10px 14px; background:var(--surface); border:1px solid var(--line); border-radius:9px; font:400 14px/1.6 var(--f-tc); color:var(--ink); resize:vertical; min-height:80px; }
.comment-card textarea:focus { outline:0; border-color:var(--acc); box-shadow:var(--ring); }

.empty-cc { text-align:center; padding:80px 32px; color:var(--muted); font:400 13px/1.6 var(--f-tc); }
@media (max-width:768px){ .body-3 { grid-template-columns:1fr; min-height:0; } .score-grid { grid-template-columns:1fr; } }

/* ===== Manager console (Phase A) ===== */
.mc-wrap { max-width:1080px; margin:0 auto; padding:24px 28px; }
.mc-head { display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
.mc-head h2 { font:700 20px/1.2 var(--f-display); margin-bottom:4px; }
.mc-head p { font:400 12.5px/1.5 var(--f-tc); color:var(--ink-3); margin:0; }
.mc-head .spacer { flex:1 1 auto; }
.mc-tabs { margin-bottom:18px; max-width:100%; overflow-x:auto; }
.mc-panel { display:none; }
.mc-panel.on { display:block; }
.mc-hint { display:flex; gap:10px; padding:12px 14px; background:var(--surface-2); border:1px solid var(--line-2); border-radius:var(--r); font:400 12.5px/1.6 var(--f-tc); color:var(--ink-2); margin-bottom:16px; }
.mc-hint svg { width:18px; height:18px; flex-shrink:0; color:var(--muted); margin-top:1px; }

/* rubric tree */
.rb-node { border:1px solid var(--line); border-radius:var(--r); background:var(--surface); margin-bottom:10px; }
.rb-node.branch { border-left:3px solid color-mix(in srgb, var(--acc) 70%, var(--line)); }
.rb-node.leaf { border-left:3px solid color-mix(in srgb, var(--ok-500) 70%, var(--line)); }
.rb-row { display:flex; align-items:center; gap:8px; padding:10px 12px; flex-wrap:wrap; }
.rb-tag { font:600 9.5px/1 var(--f-mono); text-transform:uppercase; letter-spacing:.04em; padding:3px 7px; border-radius:var(--r-sm); background:var(--surface-2); color:var(--muted); }
.rb-node.branch .rb-tag { background:color-mix(in srgb, var(--acc) 12%, var(--surface)); color:var(--acc); }
.rb-node.leaf .rb-tag { background:color-mix(in srgb, var(--ok-500) 12%, var(--surface)); color:var(--ok-700); }
.rb-row input.rb-label { flex:1 1 160px; min-width:120px; padding:9px 12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); font:500 14px/1.4 var(--f-tc); color:var(--ink); }
.rb-row input.rb-weight { width:78px; padding:9px 12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); font:600 14px/1.4 var(--f-mono); text-align:center; color:var(--ink); }
.rb-row input:focus { outline:0; border-color:var(--acc); box-shadow:var(--ring); }
.rb-row .rb-actions { display:flex; gap:6px; margin-left:auto; }
.rb-leaf-fields { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:0 12px 12px 12px; }
.rb-leaf-fields .fld { display:flex; flex-direction:column; gap:6px; }
.rb-leaf-fields .fld label { font:500 12px/1.4 var(--f-tc); color:var(--ink-2); }
.rb-leaf-fields .fld input, .rb-leaf-fields .fld select { padding:9px 12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); font:400 14px/1.4 var(--f-tc); color:var(--ink); }
.rb-leaf-fields .fld input:focus, .rb-leaf-fields .fld select:focus { outline:0; border-color:var(--acc); box-shadow:var(--ring); }
.rb-children { padding:0 12px 4px 22px; }
.rb-sum { font:600 11px/1 var(--f-mono); padding:4px 9px; border-radius:var(--r-sm); }
.rb-sum.ok { background:color-mix(in srgb, var(--ok-500) 14%, var(--surface)); color:var(--ok-700); }
.rb-sum.bad { background:color-mix(in srgb, var(--err-500,#dc2626) 12%, var(--surface)); color:var(--err-700,#dc2626); }
.rb-group-foot { display:flex; align-items:center; gap:10px; margin:6px 0 16px 0; }
.rb-node.invalid { border-color:var(--err-500,#dc2626); box-shadow:0 0 0 3px color-mix(in srgb, var(--err-500,#dc2626) 14%, transparent); }

/* panels */
.pn-card { border:1px solid var(--line); border-radius:var(--r-lg); background:var(--surface); padding:18px; margin-bottom:14px; }
.pn-card .pn-top { display:flex; gap:10px; align-items:center; margin-bottom:14px; }
.pn-card .pn-top input { flex:1; padding:10px 14px; background:var(--surface); border:1px solid var(--line); border-radius:9px; font:600 14px/1.4 var(--f-tc); color:var(--ink); }
.pn-card .pn-top input:focus { outline:0; border-color:var(--acc); box-shadow:var(--ring); }
.pn-grid { display:grid; grid-template-columns:200px 1fr 1fr; gap:14px; }
.pn-grid .fld label { display:block; font:500 12.5px/1.4 var(--f-tc); color:var(--ink-2); margin-bottom:6px; }
.pn-grid select.input { padding:10px 14px; }
.pn-checks { border:1px solid var(--line); border-radius:9px; background:var(--surface-2); max-height:170px; overflow-y:auto; padding:6px; }
.pn-check { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:var(--r-sm); cursor:pointer; font:500 12.5px/1.3 var(--f-tc); color:var(--ink-2); }
.pn-check:hover { background:var(--surface); }
.pn-check input { width:15px; height:15px; flex-shrink:0; accent-color:var(--acc); }
.pn-check small { color:var(--muted); font:400 11px/1 var(--f-mono); margin-left:auto; }
.pn-empty { padding:14px; color:var(--muted); font:400 12.5px/1.5 var(--f-tc); text-align:center; }

/* fairness toggles */
.fr-list { display:flex; flex-direction:column; gap:14px; max-width:620px; }
.fr-row { display:flex; align-items:center; gap:14px; padding:14px 16px; border:1px solid var(--line); border-radius:var(--r-lg); background:var(--surface); }
.fr-row .fr-l { flex:1; font:500 13.5px/1.4 var(--f-tc); color:var(--ink); }
.fr-row select.input { width:auto; min-width:120px; }
.fr-toggle { position:relative; width:42px; height:24px; flex-shrink:0; }
.fr-toggle input { position:absolute; opacity:0; width:0; height:0; }
.fr-toggle .tk { position:absolute; inset:0; background:var(--line); border-radius:999px; transition:.18s; cursor:pointer; }
.fr-toggle .tk::after { content:''; position:absolute; top:3px; left:3px; width:18px; height:18px; background:#fff; border-radius:50%; transition:.18s; box-shadow:var(--sh-sm); }
.fr-toggle input:checked + .tk { background:var(--acc); }
.fr-toggle input:checked + .tk::after { transform:translateX(18px); }

/* ===== Phase C: results table ===== */
.res-toolbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
.res-toolbar .fld { display:flex; align-items:center; gap:8px; }
.res-toolbar .fld label { font:500 12.5px/1.3 var(--f-tc); color:var(--ink-2); }
.res-toolbar .spacer { flex:1 1 auto; }
.res-table { width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; }
.res-table th { font:600 10.5px/1 var(--f-mono); text-transform:uppercase; letter-spacing:.04em; color:var(--muted); text-align:left; padding:11px 14px; background:var(--surface-2); border-bottom:1px solid var(--line); }
.res-table th.num, .res-table td.num { text-align:right; font-feature-settings:"tnum"; }
.res-table td { padding:12px 14px; border-bottom:1px solid var(--line-2); font:400 13px/1.5 var(--f-tc); color:var(--ink-2); vertical-align:middle; }
.res-table tbody tr.res-row { cursor:pointer; transition:.12s; }
.res-table tbody tr.res-row:hover td { background:var(--surface-2); }
.res-table tbody tr:last-child td { border-bottom:0; }
.res-table .res-rank { font:800 16px/1 var(--f-display); color:var(--muted); font-feature-settings:"tnum"; }
.res-table tr.top-1 .res-rank { color:#D4A017; }
.res-table tr.top-2 .res-rank { color:#9AA4BD; }
.res-table tr.top-3 .res-rank { color:#CD7F32; }
.res-table .res-tm { font:600 13.5px/1.3 var(--f-display); color:var(--ink); }
.res-table .res-tid { font:500 10.5px/1.3 var(--f-mono); color:var(--muted); margin-top:2px; }
.res-table .res-total { font:800 16px/1 var(--f-display); font-feature-settings:"tnum"; color:var(--ink); }
.res-table tr.unjudged td { color:var(--muted); }
.res-badge { display:inline-block; font:600 10.5px/1.4 var(--f-mono); padding:2px 7px; border-radius:var(--r-sm); background:color-mix(in srgb, var(--err-500,#dc2626) 12%, transparent); color:var(--err-700,#dc2626); }
.res-bk { background:var(--surface-2); }
.res-bk td { padding:14px 18px; }
.res-bk-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:10px; }
.res-bk-item { display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:9px 12px; background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r-sm); }
.res-bk-item .bk-l { font:500 12.5px/1.3 var(--f-tc); color:var(--ink-2); }
.res-bk-item .bk-w { font:500 10px/1 var(--f-mono); color:var(--muted); }
.res-bk-item .bk-s { font:700 14px/1 var(--f-display); font-feature-settings:"tnum"; margin-left:auto; color:var(--ink); }

/* ===== Phase D: statistics + box plot ===== */
.st-section { margin-bottom:26px; }
.st-section h3 { font:700 16px/1.2 var(--f-display); margin-bottom:12px; }
.st-table { width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; margin-bottom:18px; }
.st-table th { font:600 10.5px/1 var(--f-mono); text-transform:uppercase; letter-spacing:.04em; color:var(--muted); text-align:right; padding:11px 14px; background:var(--surface-2); border-bottom:1px solid var(--line); }
.st-table th:first-child, .st-table td:first-child { text-align:left; }
.st-table td { padding:12px 14px; border-bottom:1px solid var(--line-2); font:500 13px/1.4 var(--f-mono); color:var(--ink-2); text-align:right; font-feature-settings:"tnum"; }
.st-table tbody tr:last-child td { border-bottom:0; }
.st-table td.gname { font:600 13.5px/1.3 var(--f-display); color:var(--ink); text-align:left; }
.box-wrap { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px; margin-bottom:18px; }
.box-svg { width:100%; height:auto; display:block; font-family:var(--f-mono); }
.box-svg .bx-axis-line { stroke:var(--line); stroke-width:1; }
.box-svg .bx-tick { fill:var(--muted); font-size:10px; }
.box-svg .bx-glabel { fill:var(--ink-2); font-size:12px; font-family:var(--f-display); font-weight:600; }
.box-svg .bx-whisker { stroke:var(--ink-3); stroke-width:1.5; }
.box-svg .bx-cap { stroke:var(--ink-3); stroke-width:1.5; }
.box-svg .bx-box { fill:color-mix(in srgb, var(--acc) 14%, var(--surface)); stroke:var(--acc); stroke-width:1.5; }
.box-svg .bx-median { stroke:var(--acc); stroke-width:2.5; }
.box-svg .bx-dot { fill:var(--ink); fill-opacity:.55; stroke:var(--surface); stroke-width:.5; }
.box-legend { display:flex; gap:18px; flex-wrap:wrap; margin-top:6px; font:500 11px/1.4 var(--f-mono); color:var(--muted); }
.box-legend span { display:inline-flex; align-items:center; gap:6px; }
.box-legend i { width:14px; height:10px; border-radius:2px; display:inline-block; }
.export-row { display:flex; gap:12px; flex-wrap:wrap; }
.hist-wrap { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px; margin-bottom:18px; }

@media (max-width:768px){ .rb-leaf-fields { grid-template-columns:1fr 1fr; } .pn-grid { grid-template-columns:1fr; } }
</style>
<link rel="stylesheet" href="/shared/mobile.css">
</head>
<body>
<div class="admin">
  <aside class="side">
    <a class="brand" href="/admin/"><div class="logo"><img src="/favicon.png" alt="RegMaster" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block"></div><div class="nm">RegMaster<small>主辦後台</small></div></a>
    <div class="org-switcher"><div class="av" id="orgAv">—</div><div class="body"><h6 id="orgName">—</h6><p>主辦方</p></div></div>
    <div class="nav-grp">
      <div class="l-grp">概覽</div>
      <a class="nav-it" href="/admin/"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/></svg>儀表板</a>
      <a class="nav-it" href="/admin/events/"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3M3 11h18"/></svg>所有活動</a>
    </div>
    <div class="nav-grp">
      <div class="l-grp">本活動</div>
      <a class="nav-it" id="hubLink"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M3 3h18v18H3z"/></svg>總覽</a>
      <a class="nav-it" id="editLink"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg>設定</a>
      <a class="nav-it" id="annLink"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5"/></svg>公告</a>
      <a class="nav-it" id="paymentsLink"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M3 10h18"/></svg>付款</a>
      <a class="nav-it on"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4"/></svg>評分</a>
      <a class="nav-it" id="checkinLink"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M3 11h8V3H3v8z"/></svg>報到</a>
    </div>
  </aside>
  <main>
    <header class="head">
      <div class="crumbs"><a href="/admin/" data-i18n="aeScoreCrumbHome">主辦後台</a><span class="sep">/</span><a href="/admin/events/" data-i18n="aeScoreCrumbEvents">活動</a><span class="sep">/</span><a id="crumbHub">載入中⋯</a><span class="sep">/</span><b data-i18n="aeScoreCrumbThis">評分</b></div>
      <div class="actions"><div class="me-h"><div class="av-c" id="meAv">—</div><span id="meName">—</span></div></div>
    </header>
    <div id="loadingState" class="loading-c" data-i18n="aeScoreLoading">載入評分資料⋯</div>

    <!-- Manager console (Phase A) — shown only for owner/manager -->
    <div class="mc-wrap" id="mcConsole" style="display:none">
      <div class="mc-head">
        <div>
          <h2 data-i18n="aeScoreConsoleTitle">評分設定</h2>
          <p data-i18n="aeScoreConsoleSub">設定評分量表、評審分派與公平性規則</p>
        </div>
        <div class="spacer"></div>
        <button class="btn btn-primary" id="mcSaveBtn" data-i18n="aeScoreSaveBtn">儲存設定</button>
      </div>
      <div class="seg mc-tabs" id="mcTabs">
        <button data-tab="rubric" class="on" data-i18n="aeScoreTabRubric">評分量表</button>
        <button data-tab="panels" data-i18n="aeScoreTabPanels">評審組群 / 分派</button>
        <button data-tab="fairness" data-i18n="aeScoreTabFairness">公平性設定</button>
        <button data-tab="results" data-i18n="aeScoreTabResults">結果排名</button>
        <button data-tab="stats" data-i18n="aeScoreTabStats">統計分布</button>
      </div>

      <!-- Tab 1: rubric -->
      <div class="mc-panel on" data-panel="rubric">
        <div class="mc-hint">
          <svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
          <span data-i18n="aeScoreRubricHint">建立評分項目樹（最多三層：主項 → 細項 → 子細項）。同一層級的權重總和須為 100%。</span>
        </div>
        <div id="rbTree"></div>
        <div class="rb-group-foot" id="rbRootFoot">
          <button class="btn btn-ghost btn-sm" id="rbAddRoot" data-i18n="aeScoreAddRoot">＋ 新增主項目</button>
          <span class="rb-sum" id="rbRootSum"></span>
        </div>
      </div>

      <!-- Tab 2: panels -->
      <div class="mc-panel" data-panel="panels">
        <div class="mc-hint">
          <svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
          <span data-i18n="aeScorePanelsHint">未建立組群時，整個報名組別視為一個組群、所有被分派評審評全組；正規化與去極值以「組群內隊伍」為分布範圍。</span>
        </div>
        <div id="pnList"></div>
        <button class="btn btn-ghost btn-sm" id="pnAdd" data-i18n="aeScoreAddPanel">＋ 新增組群</button>

      <!-- Tab 3: fairness -->
      <div class="mc-panel" data-panel="fairness">
        <div class="fr-list">
          <div class="fr-row">
            <span class="fr-l" data-i18n="aeScoreAggJudgesLabel">跨評審合併方式</span>
            <select class="input select" id="frAggJudges">
              <option value="avg" data-i18n="aeScoreAggJudgesAvg">平均</option>
              <option value="max" data-i18n="aeScoreAggJudgesMax">最大</option>
              <option value="min" data-i18n="aeScoreAggJudgesMin">最小</option>
            </select>
          </div>
          <div class="fr-row">
            <span class="fr-l" data-i18n="aeScoreTrimLabel">去極值（跨評審先去最高 + 最低再合併）</span>
            <label class="fr-toggle"><input type="checkbox" id="frTrim"><span class="tk"></span></label>
          </div>
          <div class="fr-row">
            <span class="fr-l" data-i18n="aeScoreSeeRegInfoLabel">評審可看到報名者個資</span>
            <label class="fr-toggle"><input type="checkbox" id="frSeeReg"><span class="tk"></span></label>
          </div>
          <div class="fr-row">
            <span class="fr-l" data-i18n="aeScoreSeeRankingLabel">評審可看到即時排名</span>
            <label class="fr-toggle"><input type="checkbox" id="frSeeRank"><span class="tk"></span></label>
          </div>
        </div>
      </div>

      <!-- Tab 4: results (Phase C) -->
      <div class="mc-panel" data-panel="results">
        <div class="res-toolbar">
          <div class="fld">
            <label data-i18n="aeScoreResGroupFilter">組別檢視</label>
            <select class="input select" id="resGroupSel" style="width:auto;min-width:160px"></select>
          </div>
          <div class="spacer"></div>
          <button class="btn btn-ghost btn-sm" id="resReload" data-i18n="aeScoreResReload">重新整理</button>
        </div>
        <div id="resBody"></div>
      </div>

      <!-- Tab 5: statistics (Phase D) -->
      <div class="mc-panel" data-panel="stats">
        <div class="export-row" style="margin-bottom:18px">
          <button class="btn btn-ghost btn-sm" id="expCsvBtn" data-i18n="aeScoreExportCsv">匯出 CSV</button>
          <button class="btn btn-primary btn-sm" id="expXlsxBtn" data-i18n="aeScoreExportXlsx">匯出 Excel</button>
        </div>
        <div id="statsBody"></div>
      </div>
    </div>

    <div class="body-3" id="content" style="display:none">
      <aside class="left-c">
        <div class="lc-h">
          <h3><span data-i18n="aeScoreLeaderboardTitle">🏆 即時排行榜</span><span class="live-pill">LIVE</span></h3>
          <p style="font:500 11px/1.4 var(--f-mono); color:var(--muted); margin-top:6px"><span data-i18n="aeScoreJudgePrefix">您為評審：</span><b id="judgeBadge">—</b></p>
        </div>
        <div id="leaderboard"></div>
      </aside>
      <section class="center-c" id="centerC">
        <div class="empty-cc" data-i18n="aeScoreSelectPrompt">👈 從左側選擇隊伍開始評分</div>
      </section>
    </div>

</div>
<script src="/shared/app-state.js"></script>
<script src="/shared/i18n.js"></script>
<script src="/shared/i18n-admin-events-scoring.js"></script>
<script src="/shared/admin-nav.js"></script>
<script>
(function(){
  AppState.init();
  var me = AppState.getMe();
  if (!me || !me.sessionToken) { location.href = '/login.html?next=' + encodeURIComponent(location.pathname); return; }
  var compId = '';
  var m = location.pathname.match(/\/admin\/events\/([^/]+)\/scoring/);
  if (m) compId = decodeURIComponent(m[1]); if (!compId) compId = new URLSearchParams(location.search).get('id') || '';
  if (!compId) { alert(window.L('aeScoreNoCompId')); location.href = '/admin/events/'; return; }
  function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]; }); }
  ['hubLink','editLink','annLink','paymentsLink','checkinLink'].forEach(function (id) {
    var el = document.getElementById(id);
    var suffix = { hubLink: '', editLink: '/edit', annLink: '/announcements', paymentsLink: '/payments', checkinLink: '/checkin' }[id];
    if (el) el.href = '/admin/events/' + encodeURIComponent(compId) + suffix;
  });
  document.getElementById('orgAv').textContent = (me.displayName || me.username).charAt(0).toUpperCase();
  document.getElementById('orgName').textContent = me.displayName || me.username;
  document.getElementById('meAv').textContent = (me.displayName || me.username).charAt(0).toUpperCase();
  document.getElementById('meName').textContent = me.displayName || me.username;
  document.getElementById('judgeBadge').textContent = me.displayName || me.username;

  // =========================================================================
  // Phase B: rubric-driven judge scoring UI (non-managers).
  // Uses scoringApi(compId,'judgeContext'). No hard-coded criteria.
  // =========================================================================
  var JCTX = null;          // { rubric, teams, myScores, seeInfo, canSeeRanking }
  var JLEAVES = [];         // flattened leaf nodes in rubric order
  var SELECTED_TEAM = null; // teamId
  var TEAMS = [];           // assigned teams from judgeContext
  var DONE = {};            // { teamId: true } locally-marked submitted

  // walk rubric.nodes → flat array of leaves (a node with no children)
  function flattenLeaves(nodes, out) {
    out = out || [];
    (nodes || []).forEach(function (n) {
      if (n.children && n.children.length) flattenLeaves(n.children, out);
      else out.push(n);
    });
    return out;
  }

  function load() {
    google.script.run
      .withSuccessHandler(function (ctx) {
        document.getElementById('crumbHub').href = '/admin/events/' + encodeURIComponent(compId);
        document.getElementById('loadingState').style.display = 'none';
        if (!ctx || !ctx.ok) {
          document.getElementById('content').style.display = 'grid';
          document.getElementById('leaderboard').innerHTML = '';
          document.getElementById('centerC').innerHTML = '<div class="empty-cc"><span data-i18n="aeScoreNoScorePerm">無評分權限</span></div>';
          window.applyI18n(document.getElementById('centerC'));
          return;
        }
        JCTX = ctx;
        JLEAVES = flattenLeaves((ctx.rubric && ctx.rubric.nodes) || []);
        TEAMS = ctx.teams || [];
        (TEAMS).forEach(function (t) {
          var s = ctx.myScores && ctx.myScores[t.teamId];
          if (s && s.cells && Object.keys(s.cells).length) DONE[t.teamId] = true;
        });
        document.getElementById('content').style.display = 'grid';
        renderTeamList();
        if (ctx.canSeeRanking) loadJudgeLeaderboard();
        else hideLeaderboardCol();
      })
      .withFailureHandler(function () {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('content').style.display = 'grid';
        document.getElementById('centerC').innerHTML = '<div class="empty-cc"><span data-i18n="aeScoreNoScorePerm">無評分權限</span></div>';
        window.applyI18n(document.getElementById('centerC'));
      })
      .scoringApi(compId, 'judgeContext');
  }

  // when ranking is hidden, repurpose the left column into a plain team list
  function hideLeaderboardCol() {
    var h = document.querySelector('.left-c .lc-h h3');
    if (h) h.innerHTML = '<span data-i18n="aeScoreTeamListTitle">評分隊伍</span>';
    var pill = document.querySelector('.left-c .live-pill');
    if (pill) pill.style.display = 'none';
    window.applyI18n(document.querySelector('.left-c'));
  }

  // ranking visible → live leaderboard rows
  function loadJudgeLeaderboard() {
    google.script.run
      .withSuccessHandler(function (r) {
        var rows = (r && !r.hidden && r.rows) ? r.rows : null;
        if (!rows) { hideLeaderboardCol(); return; }
        var byId = {}; rows.forEach(function (x) { byId[x.teamId] = x; });
        var lb = document.getElementById('leaderboard');
        var sorted = rows.slice().sort(function (a, b) { return (a.rank || 999) - (b.rank || 999); });
        lb.innerHTML = sorted.map(function (t) {
          var topClass = t.rank === 1 ? 'top-1' : t.rank === 2 ? 'top-2' : t.rank === 3 ? 'top-3' : '';
          return '<div class="lb-row ' + topClass + '" data-tid="' + escapeHtml(t.teamId) + '">' +
            '<div class="rank">' + (t.rank || '—') + '</div>' +
            '<div><div class="nm">' + escapeHtml(t.teamNameCN || window.L('aeScoreNoTeamName')) + '</div><div class="meta">' + escapeHtml(t.group || '') + ' · ' + (t.judgeCount || 0) + window.L('aeScoreJudgeUnit') + '</div></div>' +
            '<div class="pts">' + (t.avg != null ? Number(t.avg).toFixed(1) : '—') + '<small>/100</small></div>' +
          '</div>';
        }).join('');
        lb.querySelectorAll('.lb-row').forEach(function (el) {
          el.addEventListener('click', function () {
            var t = TEAMS.find(function (x) { return x.teamId === el.dataset.tid; });
            if (t) selectTeam(t.teamId);
          });
        });
      })
      .withFailureHandler(function () { hideLeaderboardCol(); })
      .getLiveLeaderboard(compId);
  }

  // assigned team list (always rendered; doubles as the picker when ranking hidden)
  function renderTeamList() {
    var lb = document.getElementById('leaderboard');
    if (!TEAMS.length) {
      lb.innerHTML = '<p style="text-align:center; padding:48px 14px; color:var(--muted)" data-i18n="aeScoreLeaderboardEmpty">尚無報名隊伍</p>';
      window.applyI18n(lb);
      return;
    }
    if (!JCTX.canSeeRanking) {
      lb.innerHTML = TEAMS.map(function (t) {
        var done = DONE[t.teamId];
        return '<div class="lb-row" data-tid="' + escapeHtml(t.teamId) + '">' +
          '<div class="rank" style="font-size:13px">' + (done ? '✓' : '·') + '</div>' +
          '<div><div class="nm">' + escapeHtml(t.teamNameCN || window.L('aeScoreNoTeamName')) + '</div><div class="meta">' + escapeHtml(t.teamId) + ' · ' + escapeHtml(t.group || '') + '</div></div>' +
          '<div class="pts" style="font-size:11px;color:var(--muted)">' + window.L(done ? 'aeScoreDone' : 'aeScorePending') + '</div>' +
        '</div>';
      }).join('');
      lb.querySelectorAll('.lb-row').forEach(function (el) {
        el.addEventListener('click', function () { selectTeam(el.dataset.tid); });
      });
    }
  }

  function markTeamDone(teamId) {
    DONE[teamId] = true;
    var row = document.querySelector('.left-c .lb-row[data-tid="' + (window.CSS && CSS.escape ? CSS.escape(teamId) : teamId) + '"]');
    // re-render the (non-ranking) list to reflect ✓; ranking list refreshes via reload
    if (!JCTX.canSeeRanking) renderTeamList();
    else loadJudgeLeaderboard();
  }

  // render the rubric tree as a nested scoring form for one team
  function renderJudgeNode(n, depth) {
    var isBranch = n.children && n.children.length > 0;
    if (isBranch) {
      var hdr = '<div class="rb-node branch" style="margin-bottom:10px"><div class="rb-row">' +
        '<span class="rb-tag" data-i18n="aeScoreBranchTag">群組</span>' +
        '<span style="font:600 14px/1.3 var(--f-display);color:var(--ink);flex:1">' + escapeHtml(n.label || '') + '</span>' +
        '<span class="weight" style="font:500 10.5px/1 var(--f-mono);color:var(--muted)">' + window.L('aeScoreWeightLabel') + ' ' + (Number(n.weightPct) || 0) + '%</span>' +
        '</div><div class="rb-children">' +
        n.children.map(function (c) { return renderJudgeNode(c, depth + 1); }).join('') +
        '</div></div>';
      return hdr;
    }
    // leaf → label + records inputs (pre-filled)
    var recs = Math.max(1, parseInt(n.records, 10) || 1);
    var max = (n.max != null ? Number(n.max) : 100);
    var pre = (JCTX.myScores && JCTX.myScores[SELECTED_TEAM] && JCTX.myScores[SELECTED_TEAM].cells && JCTX.myScores[SELECTED_TEAM].cells[n.id]) || [];
    var inputs = '';
    for (var i = 0; i < recs; i++) {
      var val = (pre[i] != null ? pre[i] : '');
      var lab = recs > 1 ? (window.L('aeScoreRecordNth').replace('{n}', (i + 1))) : '';
      inputs += '<div class="fld" style="display:flex;flex-direction:column;gap:4px">' +
        (recs > 1 ? '<label style="font:500 10.5px/1 var(--f-mono);color:var(--muted)">' + escapeHtml(lab) + '</label>' : '') +
        '<input type="number" class="input" data-leaf="' + escapeHtml(n.id) + '" data-rec="' + i + '" min="0" max="' + max + '" step="0.1" value="' + escapeHtml(String(val)) + '" style="width:96px;text-align:center;font-feature-settings:\'tnum\'">' +
        '</div>';
    }
    return '<div class="rb-node leaf" style="margin-bottom:10px"><div class="rb-row" style="align-items:flex-start">' +
      '<span class="rb-tag" data-i18n="aeScoreLeafTag">評分項</span>' +
      '<div style="flex:1 1 160px;min-width:120px">' +
        '<div style="font:600 13.5px/1.3 var(--f-tc);color:var(--ink)">' + escapeHtml(n.label || '') + '</div>' +
        '<div style="font:500 10.5px/1.3 var(--f-mono);color:var(--muted);margin-top:2px">' + window.L('aeScoreCriterionMaxPre') + max + ' · ' + window.L('aeScoreWeightLabel') + ' ' + (Number(n.weightPct) || 0) + '%</div>' +
      '</div>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-left:auto">' + inputs + '</div>' +
      '</div></div>';
  }

  function selectTeam(teamId) {
    var t = TEAMS.find(function (x) { return x.teamId === teamId; });
    if (!t) return;
    SELECTED_TEAM = teamId;
    document.querySelectorAll('.lb-row').forEach(function (x) { x.classList.toggle('on', x.dataset.tid === teamId); });
    var my = (JCTX.myScores && JCTX.myScores[teamId]) || {};

    var infoHtml = '';
    if (JCTX.seeInfo && t.customAnswers && Object.keys(t.customAnswers).length) {
      var rows = Object.keys(t.customAnswers).map(function (k) {
        var v = t.customAnswers[k];
        if (v && typeof v === 'object') v = JSON.stringify(v);
        return '<div class="res-bk-item"><span class="bk-l">' + escapeHtml(k) + '</span><span class="bk-s" style="font:500 13px/1.3 var(--f-tc)">' + escapeHtml(String(v == null ? '' : v)) + '</span></div>';
      }).join('');
      infoHtml = '<div class="comment-card" style="margin-bottom:18px"><label data-i18n="aeScoreRegInfoLabel">報名資料</label><div class="res-bk-grid">' + rows + '</div></div>';
    }

    var rubricHtml = JLEAVES.length
      ? ((JCTX.rubric.nodes || []).map(function (n) { return renderJudgeNode(n, 1); }).join(''))
      : '<div class="empty-cc"><span data-i18n="aeScoreNoRubric">尚未設定評分量表，請聯絡主辦方。</span></div>';

    document.getElementById('centerC').innerHTML =
      '<div class="cc-h">' +
        '<div class="av-l">' + escapeHtml((t.teamNameCN || '?').charAt(0)) + '</div>' +
        '<div><h2>' + escapeHtml(t.teamNameCN || window.L('aeScoreNoTeamName')) + '</h2><p>' + escapeHtml(t.teamId) + ' · ' + escapeHtml(t.group || '') + '</p></div>' +
      '</div>' +
      infoHtml +
      '<div id="jRubric" style="margin-bottom:18px">' + rubricHtml + '</div>' +
      '<div class="comment-card" style="margin-bottom:18px"><label data-i18n="aeScoreCommentLabel">評審評語（選填）</label><textarea id="commentInput" data-i18n-placeholder="aeScoreCommentPlaceholder" placeholder="可寫給選手的建議⋯">' + escapeHtml(my.comment || '') + '</textarea></div>' +
      '<div class="total-card">' +
        '<div><div class="l" data-i18n="aeScoreSubmitHint">提交後主辦方會跨隊正規化計分</div></div>' +
        '<div class="actions"><button class="btn-primary-w" id="submitScoreBtn" data-i18n="aeScoreSubmitBtn">提交評分</button></div>' +
      '</div>';

    window.applyI18n(document.getElementById('centerC'));

    var sbtn = document.getElementById('submitScoreBtn');
    if (sbtn) sbtn.addEventListener('click', function () {
      if (!JLEAVES.length) return;
      // build cells = { [leafId]: [v1..vN] } for every leaf
      var cells = {};
      var bad = false;
      JLEAVES.forEach(function (lf) {
        var recs = Math.max(1, parseInt(lf.records, 10) || 1);
        var arr = [];
        for (var i = 0; i < recs; i++) {
          var inp = document.querySelector('[data-leaf="' + (window.CSS && CSS.escape ? CSS.escape(lf.id) : lf.id) + '"][data-rec="' + i + '"]');
          var v = inp ? parseFloat(inp.value) : NaN;
          if (isNaN(v)) v = 0;
          arr.push(v);
        }
        cells[lf.id] = arr;
      });
      var comment = (document.getElementById('commentInput') || {}).value || '';
      var btn = this; btn.disabled = true; btn.textContent = window.L('aeScoreSubmittingBtn');
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.success) {
            btn.textContent = window.L('aeScoreSubmittedBtn');
            // keep my submitted values in context for re-edit pre-fill
            JCTX.myScores = JCTX.myScores || {};
            JCTX.myScores[teamId] = { cells: cells, comment: comment };
            markTeamDone(teamId);
            (window.uiToast || function (m) { alert(m); })(window.L('aeScoreSubmitToast'), 'ok');
            setTimeout(function () { btn.disabled = false; btn.textContent = window.L('aeScoreSubmitBtn'); }, 800);
          } else {
            btn.disabled = false; btn.textContent = window.L('aeScoreSubmitBtn');
            (window.uiAlert || function (m) { alert(m); })(window.L('aeScoreFailPre') + ((res && res.message) || ''));
          }
        })
        .withFailureHandler(function (err) {
          btn.disabled = false; btn.textContent = window.L('aeScoreSubmitBtn');
          (window.uiAlert || function (m) { alert(m); })(window.L('aeScoreFailPre') + ((err && err.message) || ''));
        })
        .submitJudgeScore(compId, teamId, cells, null, null, comment);
    });
  }

  // =========================================================================
  // Manager console (Phase A): rubric editor, panels, fairness.
  // Activated only when getMyEventRole → owner/manager. Does NOT touch the
  // judge flow above (CRITERIA / submitJudgeScore / leaderboard).
  // =========================================================================
  var NORM_OPTS = [
    ['none', 'aeScoreNormNone'], ['linear', 'aeScoreNormLinear'],
    ['zscore', 'aeScoreNormZscore'], ['tdist', 'aeScoreNormTdist']
  ];
  var AGGREC_OPTS = [
    ['avg', 'aeScoreAggRecAvg'], ['max', 'aeScoreAggRecMax'],
    ['min', 'aeScoreAggRecMin'], ['last', 'aeScoreAggRecLast']
  ];
  var uid = 0;
  function newId() { return 'n' + (Date.now().toString(36)) + '_' + (++uid); }

  // ---- working state (UI tree mirrors the data model + a UI-only id) ----
  var RUBRIC = [];          // tree of UI nodes
  var PANELS = [];          // [{id,label,group,judges:[],teams:[]}]
  var ORG_MEMBERS = [];     // judge-eligible members
  var ALL_TEAMS = [];       // [{teamId,teamNameCN,group}]
  var FAIRNESS = { aggregateJudges: 'avg', trimExtremes: false, judgeSeeRegistrantInfo: false, judgeSeeLiveRanking: false };

  function makeLeaf() {
    return { _id: newId(), label: '', weightPct: 0, max: 100, records: 1, aggregateRecords: 'avg', normalize: 'tdist', children: [] };
  }
  function nodeFromData(d) {
    var n = { _id: newId(), label: d.label || '', weightPct: Number(d.weightPct) || 0, children: [] };
    if (Array.isArray(d.children) && d.children.length) {
      n.children = d.children.map(nodeFromData);
    } else {
      n.max = (d.max != null ? Number(d.max) : 100);
      n.records = Math.max(1, parseInt(d.records, 10) || 1);
      n.aggregateRecords = d.aggregateRecords || 'avg';
      n.normalize = d.normalize || 'tdist';
      n.children = [];
    }
    return n;
  }
  // strip UI-only fields → clean data-model node
  function nodeToData(n) {
    if (n.children && n.children.length) {
      return { label: n.label, weightPct: Number(n.weightPct) || 0, children: n.children.map(nodeToData) };
    }
    return {
      label: n.label, weightPct: Number(n.weightPct) || 0,
      max: Number(n.max) || 0, records: Math.max(1, parseInt(n.records, 10) || 1),
      aggregateRecords: n.aggregateRecords || 'avg', normalize: n.normalize || 'none'
    };
  }
  function findNode(list, id) {
    for (var i = 0; i < list.length; i++) {
      if (list[i]._id === id) return { parent: list, idx: i, node: list[i] };
      if (list[i].children && list[i].children.length) {
        var r = findNode(list[i].children, id); if (r) return r;
      }
    }
    return null;
  }
  function depthOf(list, id, d) {
    d = d || 1;
    for (var i = 0; i < list.length; i++) {
      if (list[i]._id === id) return d;
      if (list[i].children && list[i].children.length) {
        var r = depthOf(list[i].children, id, d + 1); if (r) return r;
      }
    }
    return 0;
  }

  function opts(list, sel) {
    return list.map(function (o) {
      return '<option value="' + o[0] + '"' + (o[0] === sel ? ' selected' : '') + ' data-i18n="' + o[1] + '">' + escapeHtml(window.L(o[1])) + '</option>';
    }).join('');
  }

  // group sum badge: returns {sum, ok}
  function groupSum(list) {
    var s = 0; list.forEach(function (n) { s += Number(n.weightPct) || 0; });
    return { sum: Math.round(s * 100) / 100, ok: Math.abs(s - 100) <= 0.5 };
  }
  function sumBadge(list) {
    var g = groupSum(list);
    return '<span class="rb-sum ' + (g.ok ? 'ok' : 'bad') + '">' + window.L('aeScoreSumLabel') + ' ' + g.sum + '%</span>';
  }

  function renderNode(n, depth) {
    var isBranch = n.children && n.children.length > 0;
    var canAddChild = depth < 3;
    var h = '<div class="rb-node ' + (isBranch ? 'branch' : 'leaf') + '" data-id="' + n._id + '">';
    h += '<div class="rb-row">';
    h += '<span class="rb-tag">' + escapeHtml(window.L(isBranch ? 'aeScoreBranchTag' : 'aeScoreLeafTag')) + '</span>';

  // event delegation for the rubric tree
  function wireRubric() {
    var tree = document.getElementById('rbTree');
    tree.addEventListener('input', function (e) {
      var nodeEl = e.target.closest('.rb-node'); if (!nodeEl) return;
      var f = e.target.getAttribute('data-f'); if (!f) return;
      var r = findNode(RUBRIC, nodeEl.dataset.id); if (!r) return;
      var v = e.target.value;
      if (f === 'weightPct' || f === 'max') r.node[f] = parseFloat(v) || 0;
      else if (f === 'records') r.node[f] = Math.max(1, parseInt(v, 10) || 1);
      else r.node[f] = v;
      if (f === 'weightPct') refreshSums();
    });
    tree.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-act]'); if (!btn) return;
      var nodeEl = btn.closest('.rb-node'); if (!nodeEl) return;
      var act = btn.getAttribute('data-act');
      var r = findNode(RUBRIC, nodeEl.dataset.id); if (!r) return;
      if (act === 'addChild') {
        // converting a leaf to a branch: drop leaf fields, add first child
        r.node.children = r.node.children || [];
        r.node.children.push(makeLeaf());
        renderRubric();
      } else if (act === 'addSibling') {
        r.node.children.push(makeLeaf());
        renderRubric();
      } else if (act === 'del') {
        r.parent.splice(r.idx, 1);
        renderRubric();
      }
    });
    document.getElementById('rbAddRoot').addEventListener('click', function () {
      RUBRIC.push(makeLeaf()); renderRubric();
    });
  }

    // each branch's child-group foot

  // recursive front-end weight check (each sibling group sums to 100 ±0.5)
  function rubricWeightsValid(list) {
    if (!list.length) return true;
    if (!groupSum(list).ok) return false;
    for (var i = 0; i < list.length; i++) {
      if (list[i].children && list[i].children.length && !rubricWeightsValid(list[i].children)) return false;
    }
    return true;
  }
  function markInvalidGroups() {
    // highlight the root sum + any branch whose own child-group is invalid

    document.querySelectorAll('#rbTree .rb-node.branch').forEach(function (el) {
      var r = findNode(RUBRIC, el.dataset.id);
      el.classList.toggle('invalid', !!(r && !groupSum(r.node.children).ok));
    });

  function quantile(sorted, q) {
    // linear interpolation between closest ranks (same method as numpy default)
    if (!sorted.length) return 0;
    var pos = (sorted.length - 1) * q;
    var base = Math.floor(pos), rest = pos - base;
    if (sorted[base + 1] != null) return sorted[base] + rest * (sorted[base + 1] - sorted[base]);
    return sorted[base];
  }
  function statsOf(vals) {
    var n = vals.length;
    if (!n) return { n: 0, mean: 0, std: 0, min: 0, max: 0, median: 0, q1: 0, q3: 0 };
    var s = vals.slice().sort(function (a, b) { return a - b; });
    var sum = 0; s.forEach(function (v) { sum += v; });
    var mean = sum / n;
    var varSum = 0; s.forEach(function (v) { varSum += (v - mean) * (v - mean); });
    var std = Math.sqrt(varSum / n);
    return {
      n: n, mean: mean, std: std, min: s[0], max: s[n - 1],
      median: quantile(s, 0.5), q1: quantile(s, 0.25), q3: quantile(s, 0.75)
    };
  }

      if (!map[g]) { map[g] = []; order.push(g); }
      map[g].push(Number(r.total) || 0);
    });
    return { map: map, order: order };
  }

    tbl += '</tbody></table></div>';

    // box-and-whisker SVG
    var boxSvg = '<div class="st-section"><h3 data-i18n="aeScoreBoxTitle">盒鬚圖（各組別總分分布）</h3>' +
      '<div class="box-wrap">' + buildBoxSvg(grp, statsByGroup) + buildBoxLegend() + '</div></div>';

    // #4: per-group spread of individual judge scores (multi-judge only) — shows where each
    // group's judge scores fall and how consistent the judges were.
    var judgeBox = '';
    if (RESULTS.multiJudgeUsed && RESULTS.judgeSpreadByGroup) {
      var js = RESULTS.judgeSpreadByGroup, jorder = [], jmap = {};
      Object.keys(js).forEach(function (g) {
        if (js[g] && js[g].length) { var gl = g || window.L('aeScoreNoGroup'); jorder.push(gl); jmap[gl] = js[g]; }
      });
      if (jorder.length) {
        var grp2 = { order: jorder, map: jmap }, statsByGroup2 = {};
        jorder.forEach(function (g) { statsByGroup2[g] = statsOf(jmap[g]); });
        judgeBox = '<div class="st-section"><h3 data-i18n="aeScoreJudgeBoxTitle">盒鬚圖（各組別評審間評分分布）</h3>' +
          '<p class="mc-hint" data-i18n="aeScoreJudgeBoxHint">每筆為一位評審對該組某隊的原始加權總分（0–100），用以判斷各組評審評分的區間與一致性。</p>' +
          '<div class="box-wrap">' + buildBoxSvg(grp2, statsByGroup2) + buildBoxLegend() + '</div></div>';
      }
    }

    body.innerHTML = tbl + boxSvg + judgeBox;
    window.applyI18n(body);
  }

  // map a 0–100 score to an x coordinate, given plot geometry
  function buildBoxSvg(grp, statsByGroup) {
    var padL = 130, padR = 24, padT = 16, rowH = 64, axisH = 28;
    var plotW = 760, innerW = plotW - padL - padR;
    var nG = grp.order.length;
    var height = padT + nG * rowH + axisH;
    var xOf = function (v) { return padL + (Math.max(0, Math.min(100, v)) / 100) * innerW; };

    var svg = '<svg class="box-svg" viewBox="0 0 ' + plotW + ' ' + height + '" preserveAspectRatio="xMidYMid meet" role="img">';
    // x axis gridlines + ticks (0,20,40,60,80,100)
    for (var t = 0; t <= 100; t += 20) {
      var x = xOf(t);
      svg += '<line class="bx-axis-line" x1="' + x.toFixed(1) + '" y1="' + padT + '" x2="' + x.toFixed(1) + '" y2="' + (padT + nG * rowH).toFixed(1) + '"></line>';
      svg += '<text class="bx-tick" x="' + x.toFixed(1) + '" y="' + (padT + nG * rowH + 18) + '" text-anchor="middle">' + t + '</text>';
    }
    grp.order.forEach(function (g, gi) {
      var st = statsByGroup[g];
      var cy = padT + gi * rowH + rowH / 2;
      var boxTop = cy - 14, boxBot = cy + 14, boxH = boxBot - boxTop;
      var x1 = xOf(st.q1), x3 = xOf(st.q3), xmin = xOf(st.min), xmax = xOf(st.max), xmed = xOf(st.median);
      // group label
      svg += '<text class="bx-glabel" x="' + (padL - 12) + '" y="' + (cy + 4).toFixed(1) + '" text-anchor="end">' + escapeXml(g) + '</text>';
      // whiskers (min..q1, q3..max) + caps
      svg += '<line class="bx-whisker" x1="' + xmin.toFixed(1) + '" y1="' + cy.toFixed(1) + '" x2="' + x1.toFixed(1) + '" y2="' + cy.toFixed(1) + '"></line>';
      svg += '<line class="bx-whisker" x1="' + x3.toFixed(1) + '" y1="' + cy.toFixed(1) + '" x2="' + xmax.toFixed(1) + '" y2="' + cy.toFixed(1) + '"></line>';
      svg += '<line class="bx-cap" x1="' + xmin.toFixed(1) + '" y1="' + (cy - 8).toFixed(1) + '" x2="' + xmin.toFixed(1) + '" y2="' + (cy + 8).toFixed(1) + '"></line>';
      svg += '<line class="bx-cap" x1="' + xmax.toFixed(1) + '" y1="' + (cy - 8).toFixed(1) + '" x2="' + xmax.toFixed(1) + '" y2="' + (cy + 8).toFixed(1) + '"></line>';
      // box (q1..q3)
      svg += '<rect class="bx-box" x="' + Math.min(x1, x3).toFixed(1) + '" y="' + boxTop.toFixed(1) + '" width="' + Math.max(1, Math.abs(x3 - x1)).toFixed(1) + '" height="' + boxH + '" rx="2"></rect>';
      // median
      svg += '<line class="bx-median" x1="' + xmed.toFixed(1) + '" y1="' + boxTop.toFixed(1) + '" x2="' + xmed.toFixed(1) + '" y2="' + boxBot.toFixed(1) + '"></line>';
      // dots per team
      grp.map[g].forEach(function (v) {
        svg += '<circle class="bx-dot" cx="' + xOf(v).toFixed(1) + '" cy="' + (cy + 22).toFixed(1) + '" r="3"></circle>';
      });
    });
    svg += '</svg>';
    return svg;
  }
  function buildBoxLegend() {
    return '<div class="box-legend">' +
      '<span><i style="background:color-mix(in srgb, var(--acc) 14%, var(--surface));border:1.5px solid var(--acc)"></i><span data-i18n="aeScoreBoxLegendBox">盒：Q1–Q3</span></span>' +
      '<span><i style="background:var(--acc);width:3px;height:12px"></i><span data-i18n="aeScoreBoxLegendMedian">中位數</span></span>' +
      '<span><i style="background:var(--ink-3);height:2px"></i><span data-i18n="aeScoreBoxLegendWhisker">鬚：最小–最大</span></span>' +
      '<span><i style="background:var(--ink);opacity:.55;width:8px;height:8px;border-radius:50%"></i><span data-i18n="aeScoreBoxLegendDot">隊伍</span></span>' +
      '</div>';
  }
  function escapeXml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]; }); }

  // ---- export (CSV + Excel via SheetJS lazy-load) ----
  function fetchExport(cb) {
    google.script.run
      .withSuccessHandler(function (d) { cb(d || { leaves: [], results: [], raw: [] }); })
      .withFailureHandler(function () { cb(null); })
      .scoringApi(compId, 'export');
  }
  // aggregate one leaf's records array using the leaf's aggregateRecords rule
  function aggRec(arr, rule) {
    if (!arr || !arr.length) return '';
    var nums = arr.map(Number);
    if (rule === 'max') return Math.max.apply(null, nums);
    if (rule === 'min') return Math.min.apply(null, nums);
    if (rule === 'last') return nums[nums.length - 1];
    var s = 0; nums.forEach(function (n) { s += n; }); return s / nums.length; // avg default
  }
  // build two tables for CSV/Excel from export payload
  function buildExportTables(d) {
    var leaves = d.leaves || [];      // [{id,label,normalize,max}]
    // sheet 1: raw per (team, judge)
    var rawHead = ['teamId', 'judgeId'].concat(leaves.map(function (l) { return l.label; })).concat(['totalScore', 'comment']);
    var rawRows = (d.raw || []).map(function (row) {
      var cells = row.cells || {};
      var line = [row.teamId, row.judgeId];
      leaves.forEach(function (l) {
        var arr = cells[l.id];
        // raw export: show record-aggregated value if array, else raw items value
        var v = '';
        if (Array.isArray(arr)) v = (arr.length ? aggRec(arr, 'avg') : '');
        else if (row.items && row.items[l.id] != null) v = row.items[l.id];
        line.push(v === '' ? '' : (typeof v === 'number' ? Math.round(v * 100) / 100 : v));
      });
      line.push(row.totalScore != null ? row.totalScore : '');
      line.push(row.comment || '');
      return line;
    });

    // sheet 2: final results with per-node breakdown
    var results = d.results || [];
    var nodeLabels = [];
    if (results.length && results[0].breakdown) nodeLabels = results[0].breakdown.map(function (b) { return b.label; });
    var resHead = ['rankOverall', 'rankInGroup', 'teamId', 'teamNameCN', 'group', 'judgeCount', 'total'].concat(nodeLabels);
    var resRows = results.slice().sort(function (a, b) { return (a.rankOverall || 9999) - (b.rankOverall || 9999); }).map(function (r) {
      var line = [r.rankOverall || '', r.rankInGroup || '', r.teamId, r.teamNameCN || '', r.group || '', r.judgeCount || 0, r.judged ? (Math.round((r.total || 0) * 10) / 10) : ''];
      (r.breakdown || []).forEach(function (b) { line.push(Math.round((b.score || 0) * 10) / 10); });
      return line;
    });

    return { rawHead: rawHead, rawRows: rawRows, resHead: resHead, resRows: resRows };
  }

  function csvCell(v) {
    var s = (v == null ? '' : String(v));
    if (/[",\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function downloadBlob(content, filename, mime) {
    var blob = new Blob([content], { type: mime });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  function exportCsv() {
    var btn = document.getElementById('expCsvBtn'); btn.disabled = true;
    fetchExport(function (d) {
      btn.disabled = false;
      if (!d) { (window.uiToast || function (m) { alert(m); })(window.L('aeScoreExportFail'), 'err'); return; }
      var t = buildExportTables(d);
      var lines = [];
      lines.push('# ' + window.L('aeScoreExportSheetRaw'));
      lines.push(t.rawHead.map(csvCell).join(','));
      t.rawRows.forEach(function (r) { lines.push(r.map(csvCell).join(',')); });
      lines.push('');
      lines.push('# ' + window.L('aeScoreExportSheetResults'));
      lines.push(t.resHead.map(csvCell).join(','));
      t.resRows.forEach(function (r) { lines.push(r.map(csvCell).join(',')); });
      downloadBlob('﻿' + lines.join('\r\n'), 'scoring_' + compId + '.csv', 'text/csv;charset=utf-8;');
      (window.uiToast || function (m) { alert(m); })(window.L('aeScoreExportDone'), 'ok');
    });
  }

  var XLSX_LOADING = null;
  function ensureSheetJS() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (XLSX_LOADING) return XLSX_LOADING;
    XLSX_LOADING = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
      s.integrity = 'sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw';  // SRI (P1-2)
      s.crossOrigin = 'anonymous';
      s.onload = function () { resolve(window.XLSX); };
      s.onerror = function () { reject(new Error('xlsx load failed')); };
      document.head.appendChild(s);
    });
    return XLSX_LOADING;
  }

  function exportXlsx() {
    var btn = document.getElementById('expXlsxBtn'); btn.disabled = true;
    fetchExport(function (d) {
      if (!d) { btn.disabled = false; (window.uiToast || function (m) { alert(m); })(window.L('aeScoreExportFail'), 'err'); return; }
      var t = buildExportTables(d);
      ensureSheetJS().then(function (XLSX) {
        btn.disabled = false;
        var wb = XLSX.utils.book_new();
        var ws1 = XLSX.utils.aoa_to_sheet([t.rawHead].concat(t.rawRows));
        var ws2 = XLSX.utils.aoa_to_sheet([t.resHead].concat(t.resRows));
        XLSX.utils.book_append_sheet(wb, ws1, window.L('aeScoreExportSheetRaw'));
        XLSX.utils.book_append_sheet(wb, ws2, window.L('aeScoreExportSheetResults'));
        XLSX.writeFile(wb, 'scoring_' + compId + '.xlsx');
        (window.uiToast || function (m) { alert(m); })(window.L('aeScoreExportDone'), 'ok');
      }).catch(function () {
        btn.disabled = false;
        // fall back to CSV
        (window.uiToast || function (m) { alert(m); })(window.L('aeScoreXlsxFallback'), 'err');
        var lines = [];
        lines.push('# ' + window.L('aeScoreExportSheetRaw'));
        lines.push(t.rawHead.map(csvCell).join(','));
        t.rawRows.forEach(function (r) { lines.push(r.map(csvCell).join(',')); });
        lines.push('');
        lines.push('# ' + window.L('aeScoreExportSheetResults'));
        lines.push(t.resHead.map(csvCell).join(','));
        t.resRows.forEach(function (r) { lines.push(r.map(csvCell).join(',')); });
        downloadBlob('﻿' + lines.join('\r\n'), 'scoring_' + compId + '.csv', 'text/csv;charset=utf-8;');
      });
    });
  }

  function wireResultsStats() {
    document.getElementById('resGroupSel').addEventListener('change', function () { RES_GROUP = this.value; renderResults(); });
    document.getElementById('resReload').addEventListener('click', function () { RESULTS = null; loadResults(); });
    document.getElementById('expCsvBtn').addEventListener('click', exportCsv);
    document.getElementById('expXlsxBtn').addEventListener('click', exportXlsx);
  }

  // ---- tabs ----
  var RES_LOADED = false, STATS_LOADED = false;
  function switchTab(name) {
    document.querySelectorAll('#mcTabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === name); });
    document.querySelectorAll('.mc-panel').forEach(function (p) { p.classList.toggle('on', p.dataset.panel === name); });
    if (name === 'results' && !RES_LOADED) { RES_LOADED = true; loadResults(); }
    if (name === 'stats') { if (!STATS_LOADED) { STATS_LOADED = true; loadStats(); } }
  }
  function wireTabs() {
    document.getElementById('mcTabs').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-tab]'); if (b) switchTab(b.dataset.tab);
    });
  }
  // #5-1: 評分輸入即時 clamp 至 [0, 滿分]（後端為權威；此為避免畫面顯示超出滿分）。
  // R5 L-3: clamp 不再靜默 — 提示已自動調整（1.5s 節流避免連續輸入洗版）。
  var _lastClampToast = 0;
  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el && el.matches && el.matches('input[type=number][data-leaf]')) {
      var mx = parseFloat(el.max), v = parseFloat(el.value);
      if (!isNaN(v)) {
        if (!isNaN(mx) && v > mx) {
          el.value = mx;
          var _nowT = Date.now();
          if (_nowT - _lastClampToast > 1500 && window.uiToast) { _lastClampToast = _nowT; uiToast(window.L('aeScoreClampedToast').replace('{max}', mx), 'err'); }
        } else if (v < 0) el.value = 0;
      }
    }
  });

  function loadConsole() {
    document.getElementById('crumbHub').href = '/admin/events/' + encodeURIComponent(compId);
    Promise.all([
      new Promise(function (res) { google.script.run.withSuccessHandler(res).withFailureHandler(function () { res({}); }).getCompetitionConfig(compId); }),
      new Promise(function (res) { google.script.run.withSuccessHandler(res).withFailureHandler(function () { res([]); }).getAllTeams(compId); }),
      new Promise(function (res) { google.script.run.withSuccessHandler(res).withFailureHandler(function () { res({ members: [] }); }).listOrgMembers(); })
    ]).then(function (r) {
      var cfg = r[0] || {};
      ALL_TEAMS = Array.isArray(r[1]) ? r[1] : (r[1] && r[1].teams) || [];
      var mem = r[2];
      var members = Array.isArray(mem) ? mem : (mem && mem.members) || [];
      // only active members with a username can be assigned as judges
      ORG_MEMBERS = members.filter(function (m) { return m && m.memberUsername && (m.status == null || m.status === 'active'); });

      document.getElementById('crumbHub').textContent = cfg.competitionName || cfg.name || compId;

      var rubric = cfg.scoringRubric || {};
      RUBRIC = Array.isArray(rubric.nodes) ? rubric.nodes.map(nodeFromData) : [];
      PANELS = Array.isArray(cfg.scoringPanels) ? cfg.scoringPanels.map(function (p) {
        return { id: p.id || newId(), label: p.label || '', group: p.group || '', judges: Array.isArray(p.judges) ? p.judges.slice() : [], teams: Array.isArray(p.teams) ? p.teams.slice() : [] };
      }) : [];
      FAIRNESS = {
        aggregateJudges: rubric.aggregateJudges || 'avg',
        trimExtremes: !!rubric.trimExtremes,
        judgeSeeRegistrantInfo: !!cfg.judgeSeeRegistrantInfo,
        judgeSeeLiveRanking: !!cfg.judgeSeeLiveRanking
      };

      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('mcConsole').style.display = 'block';

      wireTabs(); wireRubric(); wirePanels(); wireSave(); wireResultsStats();
      renderRubric(); renderPanels(); renderFairness();
      // #5-3: owner/manager 若也被指派為評審 → 提供「以評審身分評分」浮動入口（原本只能進設定視圖無法評分）。
      try {
        var _myName = (window.AppState && AppState.getMe && (AppState.getMe() || {}).username) || '';
        var _meRole = (window.AppState && AppState.getMe && (AppState.getMe() || {}).role) || '';
        var _inPanel = PANELS.some(function (p) { return (p.judges || []).indexOf(_myName) >= 0; });
        if ((_inPanel || _meRole === 'system') && !document.getElementById('gotoScoreBtn')) {
          var _b = document.createElement('button');
          _b.id = 'gotoScoreBtn'; _b.className = 'btn btn-primary btn-sm';
          _b.style.cssText = 'position:fixed; right:24px; bottom:24px; z-index:50; box-shadow:var(--sh-lg)';
          _b.textContent = '🎯 ' + window.L('aeScoreGotoScore');
          _b.addEventListener('click', function () { var c = document.getElementById('mcConsole'); if (c) c.style.display = 'none'; _b.remove(); load(); });
          document.body.appendChild(_b);
        }
      } catch (e) {}
    });
  }

  // =========================================================================
  // Role-aware bootstrap
  // =========================================================================
  google.script.run
    .withSuccessHandler(function (res) {
      var role = res && res.role;
      // UX-020: the sidebar prefix must reflect the ACTUAL role, not a hard-wired
      // "您為評審" — a staff member (no scoring right) seeing "您為評審…無評分權限"
      // is self-contradictory. Swap the i18n key so a later lang-switch stays correct.
      if (role === 'staff') {
        var _pfx = document.querySelector('[data-i18n="aeScoreJudgePrefix"]');
        if (_pfx) { _pfx.setAttribute('data-i18n', 'aeScoreStaffPrefix'); _pfx.textContent = window.L('aeScoreStaffPrefix'); }
      }
      if (role === 'owner' || role === 'manager' || role == null) {
        // owner (role null for system / creator returns 'owner') & manager → console.
        // Note: getMyEventRole returns 'owner' for creators/system; null means no
        // membership — those users wouldn't reach this page, but treat as judge.
        if (role === 'owner' || role === 'manager') loadConsole();
        else load();
      } else {
        load();
      }
    })
    .withFailureHandler(function () { load(); })
    .getMyEventRole(compId);
})();
</script>
