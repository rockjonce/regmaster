<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>付款對帳 · 主辦後台 · RegMaster</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/shared/styles.css">
<link rel="stylesheet" href="/shared/admin-layout.css">
<script src="/__/firebase/10.7.1/firebase-app-compat.js"></script>
<script src="/__/firebase/10.7.1/firebase-functions-compat.js"></script>
<script src="/__/firebase/init.js"></script>
<script src="/shared/firebase-bridge.js"></script>
<script src="/shared/ui-dialog.js"></script>
<style>
.sum-row { display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:14px; margin-bottom:20px; }
.sum-card { padding:18px; background:var(--surface); border:1px solid var(--line); border-radius:12px; }
.sum-card.featured { background:linear-gradient(135deg, var(--ink), #1a2e52); color:white; border-color:var(--ink); }
.sum-card.featured .l { color:rgba(255,255,255,.65); }
.sum-card .l { font:500 11px/1 var(--f-mono); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
.sum-card .v { font:700 28px/1 var(--f-display); letter-spacing:-.018em; }
.sum-card .v em { font-style:normal; font-size:14px; color:var(--muted); margin-left:4px; font-weight:500; }
.sum-card .sub { font:400 11.5px/1.5 var(--f-tc); color:var(--ink-3); margin-top:6px; }
.sum-card.featured .sub { color:rgba(255,255,255,.6); }

.tbl-wrap { background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow-x:auto; }
.tbl { min-width:680px; }
.tbl { width:100%; border-collapse:collapse; font:400 13px/1.5 var(--f-tc); }
.tbl thead th { text-align:left; padding:11px 14px; background:var(--surface-2); border-bottom:1px solid var(--line); font:600 10.5px/1 var(--f-mono); letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
.tbl thead th.right { text-align:right; }
.tbl tbody td { padding:12px 14px; border-bottom:1px solid var(--line-2); color:var(--ink-2); vertical-align:middle; }
.tbl tbody td.right { text-align:right; font-family:var(--f-mono); font-weight:500; }
.tbl tbody tr:hover td { background:var(--surface-2); }
.tbl tbody tr:last-child td { border-bottom:0; }
.pay-pill { padding:2px 7px; border-radius:4px; font:600 10.5px/1.4 var(--f-mono); display:inline-flex; align-items:center; gap:4px; }
.pay-pill.confirmed { background:color-mix(in srgb, var(--ok-500) 14%, transparent); color:var(--ok-700); }
.pay-pill.pending { background:color-mix(in srgb, var(--amber-500) 14%, transparent); color:var(--warn-700); }
.pay-pill.refund { background:color-mix(in srgb, var(--err-500) 14%, transparent); color:var(--err-700); }
.action-btn { padding:5px 9px; background:var(--surface-2); border:1px solid var(--line); border-radius:5px; font:500 11px/1 var(--f-tc); color:var(--ink-2); cursor:pointer; margin-right:4px; }
.action-btn:hover { background:var(--surface); border-color:var(--ink-3); }
.action-btn.primary { background:var(--ink); color:white; border-color:var(--ink); }

.reconcile-bar { padding:18px; background:linear-gradient(135deg, color-mix(in srgb, var(--acc) 8%, var(--surface)), var(--surface)); border:1px solid color-mix(in srgb, var(--acc) 30%, var(--line)); border-radius:12px; display:flex; gap:14px; align-items:center; margin-bottom:14px; }
.reconcile-bar .ic-r { width:36px; height:36px; border-radius:9px; background:var(--acc); color:white; display:grid; place-items:center; flex-shrink:0; }
.reconcile-bar .body { flex:1; }
.reconcile-bar h5 { font:700 13.5px/1.3 var(--f-display); margin-bottom:3px; }
.reconcile-bar p { font:400 11.5px/1.4 var(--f-tc); color:var(--ink-3); margin:0; }
.reconcile-bar .input-bar { display:flex; gap:6px; align-items:center; }
.reconcile-bar input { padding:7px 10px; border:1px solid var(--line); border-radius:6px; font:500 12px/1 var(--f-mono); width:140px; }
@media (max-width:768px){
  .sum-row { grid-template-columns:1fr 1fr; gap:10px; }
  .reconcile-bar { flex-direction:column; align-items:stretch; }
  .reconcile-bar .input-bar { width:100%; }
  .reconcile-bar input { flex:1; width:auto; }
}
@media (max-width:480px){ .sum-row { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="admin">
  <aside class="side">
    <a class="brand" href="/admin/"><div class="logo"><img src="/favicon.png" alt="RegMaster" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block"></div><div class="nm">RegMaster<small>主辦後台</small></div></a>
    <div class="org-switcher"><div class="av" id="orgAv">—</div><div class="body"><h6 id="orgName">—</h6><p>主辦方</p></div></div>
    <div class="nav-grp">
      <div class="l-grp">概覽</div>
      <a class="nav-it" href="/admin/"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/></svg>儀表板</a>
      <a class="nav-it" href="/admin/events/"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3M3 11h18"/></svg>所有活動</a>
    </div>
    <div class="nav-grp">
      <div class="l-grp">本活動</div>
      <a class="nav-it" id="hubLink"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M3 3h18v18H3z"/></svg>總覽</a>
      <a class="nav-it" id="editLink"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg>設定</a>
      <a class="nav-it" id="annLink"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5"/></svg>公告</a>
      <a class="nav-it on"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M3 10h18"/></svg>付款</a>
      <a class="nav-it" id="scoringLink"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4"/></svg>評分</a>
      <a class="nav-it" id="checkinLink"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M3 11h8V3H3v8z"/></svg>報到</a>
    </div>
  </aside>
  <main>
    <header class="head">
      <div class="crumbs"><a href="/admin/">主辦後台</a><span class="sep">/</span><a href="/admin/events/">活動</a><span class="sep">/</span><a id="crumbHub">—</a><span class="sep">/</span><b>付款對帳</b></div>
      <div class="actions"><button class="btn-ic-h" id="exportBtn" title="匯出"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button><div class="me-h"><div class="av-c" id="meAv">—</div><span id="meName">—</span></div></div>
    </header>
    <div id="loadingState" class="loading-c">載入付款資料⋯</div>
    <div class="main-c" id="content" style="display:none">
      <div class="sum-row" id="sumRow"></div>
      <div class="reconcile-bar">
        <div class="ic-r"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/></svg></div>
        <div class="body">
          <h5>快速對帳</h5>
          <p>輸入銀行帳號末 4 碼，系統會自動標記匹配的隊伍為「已確認」</p>
        </div>
        <div class="input-bar">
          <input id="reconcileSuffix" placeholder="例：8923" maxlength="4">
          <button class="btn btn-primary btn-sm" id="reconcileBtn">執行對帳</button>
        </div>
      </div>
      <div class="tbl-wrap">
        <table class="tbl">
          <thead><tr><th>隊伍編號</th><th>隊名</th><th>狀態</th><th>付款狀態</th><th>付款方式</th><th class="right">金額</th><th>動作</th></tr></thead>
          <tbody id="tblBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="/shared/app-state.js"></script>
<script src="/shared/admin-nav.js"></script>
<script>
(function(){
  AppState.init();
  var me = AppState.getMe();
  if (!me || !me.sessionToken) { location.href = '/login.html?next=' + encodeURIComponent(location.pathname); return; }
  var compId = '';
  var m = location.pathname.match(/\/admin\/events\/([^/]+)\/payments/);
  if (m) compId = decodeURIComponent(m[1]); if (!compId) compId = new URLSearchParams(location.search).get('id') || '';
  if (!compId) { alert('未指定活動編號'); location.href = '/admin/events/'; return; }
  function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]; }); }
  ['hubLink','editLink','annLink','scoringLink','checkinLink'].forEach(function (id) {
    var el = document.getElementById(id);
    var suffix = { hubLink: '', editLink: '/edit', annLink: '/announcements', scoringLink: '/scoring', checkinLink: '/checkin' }[id];
    if (el) el.href = '/admin/events/' + encodeURIComponent(compId) + suffix;
  });
  document.getElementById('orgAv').textContent = (me.displayName || me.username).charAt(0).toUpperCase();
  document.getElementById('orgName').textContent = me.displayName || me.username;
  document.getElementById('meAv').textContent = (me.displayName || me.username).charAt(0).toUpperCase();
  document.getElementById('meName').textContent = me.displayName || me.username;

  var FEE = 0;
  var TEAMS = [];

  function load() {
    Promise.all([
      new Promise(function (res) { google.script.run.withSuccessHandler(res).withFailureHandler(function () { res({}); }).getRegistrationBundle(compId); }),
      new Promise(function (res) { google.script.run.withSuccessHandler(res).withFailureHandler(function () { res([]); }).getAllTeams(compId); })
    ]).then(function (r) {
      var bundle = r[0] || {}; var cfg = bundle.config || {};
      FEE = parseInt(cfg.registrationFee || 0) || 0;
      TEAMS = r[1] || [];
      document.getElementById('crumbHub').href = '/admin/events/' + encodeURIComponent(compId);
      document.getElementById('crumbHub').textContent = cfg.competitionName || compId;
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      renderSum(); renderTable();
    });
  }
  function renderSum() {
    var paid = 0, pending = 0;
    TEAMS.forEach(function (t) {
      if (t.status === '已取消') return;
      if ((t.paymentStatus || '').includes('已確認')) paid++; else pending++;
    });
    var total = paid + pending;
    var revenue = paid * FEE;
    document.getElementById('sumRow').innerHTML =
      '<div class="sum-card featured"><div class="l">應收總額</div><div class="v">NT$ ' + (total * FEE).toLocaleString() + '</div><div class="sub">' + total + ' 筆 × NT$ ' + FEE.toLocaleString() + '</div></div>' +
      '<div class="sum-card"><div class="l">已收</div><div class="v" style="color:var(--ok-700)">NT$ ' + revenue.toLocaleString() + '</div><div class="sub">' + paid + ' 筆已確認</div></div>' +
      '<div class="sum-card"><div class="l">待收</div><div class="v" style="color:var(--warn-700)">NT$ ' + (pending * FEE).toLocaleString() + '</div><div class="sub">' + pending + ' 筆待付款</div></div>' +
      '<div class="sum-card"><div class="l">收款率</div><div class="v">' + (total > 0 ? Math.round(paid / total * 100) : 0) + '<em>%</em></div><div class="sub">已付款 / 總報名</div></div>';
  }
  function renderTable() {
    var rows = TEAMS.filter(function (t) { return t.status !== '已取消'; });
    if (rows.length === 0) {
      document.getElementById('tblBody').innerHTML = '<tr><td colspan="7" style="text-align:center; color:var(--muted); padding:40px">尚無報名資料</td></tr>';
      return;
    }
    document.getElementById('tblBody').innerHTML = rows.map(function (t) {
      var paid = (t.paymentStatus || '').includes('已確認');
      return '<tr>' +
        '<td style="font:500 12px/1 var(--f-mono); color:var(--ink)">' + escapeHtml(t.teamId) + '</td>' +
        '<td><b>' + escapeHtml(t.teamNameCN || t.teamNameEN || '(無)') + '</b></td>' +
        '<td>' + escapeHtml(t.status || '') + '</td>' +
        '<td><span class="pay-pill ' + (paid ? 'confirmed' : 'pending') + '">' + escapeHtml(t.paymentStatus || '待確認') + '</span></td>' +
        '<td>' + escapeHtml(t.paymentMethod || '—') + '</td>' +
        '<td class="right">NT$ ' + FEE.toLocaleString() + '</td>' +
        '<td>' +
          (!paid ? '<button class="action-btn primary" data-act="confirm" data-tid="' + escapeHtml(t.teamId) + '">確認付款</button>' : '') +
          '<button class="action-btn" data-act="view" data-tid="' + escapeHtml(t.teamId) + '">查看</button>' +
        '</td>' +
      '</tr>';
    }).join('');
    document.querySelectorAll('[data-act]').forEach(function (b) {
      b.addEventListener('click', function () {
        var tid = b.dataset.tid;
        if (b.dataset.act === 'confirm') {
          uiConfirm('確認此筆付款？', { title: '確認付款' }).then(function (ok) {
            if (!ok) return;
            google.script.run
              .withSuccessHandler(function () { load(); })
              .withFailureHandler(function (err) { uiAlert('失敗：' + (err && err.message)); })
              .confirmPayment(tid, me.username);
          });
        } else if (b.dataset.act === 'view') {
          window.open('/events/payment.html?id=' + encodeURIComponent(compId) + '&team=' + encodeURIComponent(tid), '_blank');
        }
      });
    });
  }

  document.getElementById('reconcileBtn').addEventListener('click', function () {
    var suffix = document.getElementById('reconcileSuffix').value.trim();
    if (!/^\d{4}$/.test(suffix)) return alert('請輸入 4 位數字');
    var btn = this; btn.disabled = true; btn.textContent = '對帳中⋯';
    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false; btn.textContent = '執行對帳';
        alert('對帳完成：標記 ' + ((res && res.matched) || 0) + ' 筆為已確認');
        load();
      })
      .withFailureHandler(function (err) { btn.disabled = false; btn.textContent = '執行對帳'; alert('失敗：' + (err && err.message)); })
      .reconcilePayments(compId, suffix);
  });
  document.getElementById('exportBtn').addEventListener('click', function () {
    google.script.run
      .withSuccessHandler(function (csv) {
        var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
        var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'payments-' + compId + '-' + new Date().toISOString().slice(0,10) + '.csv'; a.click();
      })
      .exportTeamsCSV(compId);
  });
  load();
})();
</script>
</body>
</html>
