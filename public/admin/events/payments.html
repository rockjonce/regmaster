<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>帳務 · 主辦後台 · RegMaster</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/shared/styles.css">
<link rel="stylesheet" href="/shared/admin-layout.css">
<script src="/__/firebase/10.7.1/firebase-app-compat.js"></script>
<script src="/__/firebase/10.7.1/firebase-functions-compat.js"></script>
<script src="/__/firebase/init.js"></script>
<script src="/shared/firebase-bridge.js"></script>
<script src="/shared/ui-dialog.js"></script>
<style>
.sum-row { display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:14px; margin-bottom:20px; }
.sum-card { padding:18px; background:var(--surface); border:1px solid var(--line); border-radius:12px; }
.sum-card.featured { background:linear-gradient(135deg, var(--ink), #1a2e52); color:white; border-color:var(--ink); }
.sum-card.featured .l { color:rgba(255,255,255,.65); }
.sum-card .l { font:500 11px/1 var(--f-mono); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
.sum-card .v { font:700 28px/1 var(--f-display); letter-spacing:-.018em; }
.sum-card .v em { font-style:normal; font-size:14px; color:var(--muted); margin-left:4px; font-weight:500; }
.sum-card .sub { font:400 11.5px/1.5 var(--f-tc); color:var(--ink-3); margin-top:6px; }
.sum-card.featured .sub { color:rgba(255,255,255,.6); }

.tbl-wrap { background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow-x:auto; }
.tbl { min-width:680px; }
.tbl { width:100%; border-collapse:collapse; font:400 13px/1.5 var(--f-tc); }
.tbl thead th { text-align:left; padding:11px 14px; background:var(--surface-2); border-bottom:1px solid var(--line); font:600 10.5px/1 var(--f-mono); letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
.tbl thead th.right { text-align:right; }
.tbl tbody td { padding:12px 14px; border-bottom:1px solid var(--line-2); color:var(--ink-2); vertical-align:middle; }
.tbl tbody td.right { text-align:right; font-family:var(--f-mono); font-weight:500; }
.tbl tbody tr:hover td { background:var(--surface-2); }
.tbl tbody tr:last-child td { border-bottom:0; }
.pay-pill { padding:2px 7px; border-radius:4px; font:600 10.5px/1.4 var(--f-mono); display:inline-flex; align-items:center; gap:4px; }
.pay-pill.confirmed { background:color-mix(in srgb, var(--ok-500) 14%, transparent); color:var(--ok-700); }
.pay-pill.pending { background:color-mix(in srgb, var(--amber-500) 14%, transparent); color:var(--warn-700); }
.pay-pill.refund { background:color-mix(in srgb, var(--err-500) 14%, transparent); color:var(--err-700); }
.action-btn { padding:5px 9px; background:var(--surface-2); border:1px solid var(--line); border-radius:5px; font:500 11px/1 var(--f-tc); color:var(--ink-2); cursor:pointer; margin-right:4px; }
.action-btn:hover { background:var(--surface); border-color:var(--ink-3); }
.action-btn.primary { background:var(--ink); color:white; border-color:var(--ink); }
.action-btn.danger { background:var(--surface); border-color:color-mix(in srgb, var(--err-500) 40%, var(--line)); color:var(--err-700); }
.action-btn.danger:hover { background:color-mix(in srgb, var(--err-500) 8%, var(--surface)); }
/* Shared modal — same shell as registrations.html for consistency */
.modal-bg { position:fixed; inset:0; background:rgba(11,28,61,.55); display:grid; place-items:center; z-index:9999; padding:20px; }
.modal-card { background:var(--surface); border:1px solid var(--line); border-radius:14px; max-width:880px; width:100%; max-height:88vh; overflow:hidden; display:flex; flex-direction:column; box-shadow:var(--sh-lg); }
.modal-h { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px; }
.modal-h h3 { font:700 15px/1.3 var(--f-display); color:var(--ink); }
.modal-body { padding:18px; overflow:auto; }
.modal-body .group { padding:14px; background:var(--surface-2); border:1px solid var(--line-2); border-radius:9px; margin-bottom:12px; }
.modal-body .group h5 { font:700 13px/1.3 var(--f-display); margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--line); }
.modal-body .kv { display:grid; grid-template-columns:120px 1fr; gap:6px 12px; font:400 12.5px/1.5 var(--f-tc); }
.modal-body .kv .k { color:var(--muted); }
.modal-body .kv .v { color:var(--ink-2); word-break:break-all; }
.modal-body .file-link { color:var(--acc); text-decoration:underline; }
@media (max-width:900px){ .modal-body .kv { grid-template-columns:1fr; } }

/* FF3: billing card — same shell as .sum-card / .reconcile-bar so the page reads consistently. */
.billing-card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:20px; }
.billing-h { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap; margin-bottom:16px; }
.billing-h h3 { font:700 16px/1.2 var(--f-display); margin-bottom:4px; }
.billing-h p { font:400 12px/1.5 var(--f-tc); color:var(--muted); margin:0; }
.range-bar { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.range-bar select, .range-bar input[type=date] { padding:7px 10px; border:1px solid var(--line); border-radius:7px; font:500 12.5px/1.4 var(--f-tc); background:var(--surface); color:var(--ink); }
.bill-summary { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:10px; margin-bottom:16px; }
.bill-summary .b-c { padding:12px 14px; background:var(--surface-2); border:1px solid var(--line-2); border-radius:9px; }
.bill-summary .b-c.featured { background:linear-gradient(135deg, var(--ink), #1a2e52); color:white; border-color:var(--ink); }
.bill-summary .b-c .l { font:500 10.5px/1 var(--f-mono); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
.bill-summary .b-c.featured .l { color:rgba(255,255,255,.7); }
.bill-summary .b-c .v { font:700 19px/1 var(--f-display); }
.bill-summary .b-c .sub { font:400 10.5px/1.4 var(--f-tc); color:var(--muted); margin-top:4px; }
.bill-summary .b-c.featured .sub { color:rgba(255,255,255,.65); }
.bill-detail .b-tbl { width:100%; min-width:760px; border-collapse:collapse; font:400 12.5px/1.5 var(--f-tc); }
.bill-detail .b-tbl-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:9px; background:var(--surface); }
.bill-detail .b-tbl thead th { text-align:left; padding:9px 12px; background:var(--surface-2); border-bottom:1px solid var(--line); font:600 10px/1 var(--f-mono); letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
.bill-detail .b-tbl thead th.right { text-align:right; }
.bill-detail .b-tbl tbody td { padding:10px 12px; border-bottom:1px solid var(--line-2); color:var(--ink-2); vertical-align:middle; }
.bill-detail .b-tbl tbody td.right { text-align:right; font-family:var(--f-mono); }
.bill-detail .b-tbl tbody tr:hover td { background:var(--surface-2); }
.bill-detail .b-tbl tbody tr:last-child td { border-bottom:0; }
.bill-detail .b-tbl .type-pill { font:600 10px/1 var(--f-mono); padding:2px 6px; border-radius:4px; }
.bill-detail .b-tbl .type-pill.payuni { background:color-mix(in srgb, var(--acc) 14%, transparent); color:var(--acc); }
.bill-detail .b-tbl .type-pill.atm { background:color-mix(in srgb, var(--ok-500) 14%, transparent); color:var(--ok-700); }
.bill-remitted-tag { display:inline-flex; align-items:center; gap:5px; padding:4px 10px; background:color-mix(in srgb, var(--ok-500) 14%, transparent); color:var(--ok-700); border-radius:5px; font:600 11px/1 var(--f-mono); margin-left:8px; }
@media (max-width: 600px) {
  .billing-h { flex-direction:column; align-items:stretch; }
  .range-bar { justify-content:flex-start; }
  .bill-summary { grid-template-columns:repeat(2, 1fr); }
  .bill-summary .b-c .v { font-size:16px; }
}

.reconcile-bar { padding:18px; background:linear-gradient(135deg, color-mix(in srgb, var(--acc) 8%, var(--surface)), var(--surface)); border:1px solid color-mix(in srgb, var(--acc) 30%, var(--line)); border-radius:12px; display:flex; gap:14px; align-items:center; margin-bottom:14px; }
.reconcile-bar .ic-r { width:36px; height:36px; border-radius:9px; background:var(--acc); color:white; display:grid; place-items:center; flex-shrink:0; }
.reconcile-bar .body { flex:1; }
.reconcile-bar h5 { font:700 13.5px/1.3 var(--f-display); margin-bottom:3px; }
.reconcile-bar p { font:400 11.5px/1.4 var(--f-tc); color:var(--ink-3); margin:0; }
.reconcile-bar .input-bar { display:flex; gap:6px; align-items:center; }
.reconcile-bar input { padding:7px 10px; border:1px solid var(--line); border-radius:6px; font:500 12px/1 var(--f-mono); width:140px; }
@media (max-width:768px){
  .sum-row { grid-template-columns:1fr 1fr; gap:10px; }
  .reconcile-bar { flex-direction:column; align-items:stretch; }
  .reconcile-bar .input-bar { width:100%; }
  .reconcile-bar input { flex:1; width:auto; }
}
@media (max-width:480px){ .sum-row { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="admin">
  <aside class="side">
    <a class="brand" href="/admin/"><div class="logo"><img src="/favicon.png" alt="RegMaster" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block"></div><div class="nm">RegMaster<small>主辦後台</small></div></a>
    <div class="org-switcher"><div class="av" id="orgAv">—</div><div class="body"><h6 id="orgName">—</h6><p>主辦方</p></div></div>
    <div class="nav-grp">
      <div class="l-grp">概覽</div>
      <a class="nav-it" href="/admin/"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/></svg>儀表板</a>
      <a class="nav-it" href="/admin/events/"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3M3 11h18"/></svg>所有活動</a>
    </div>
    <div class="nav-grp">
      <div class="l-grp">本活動</div>
      <a class="nav-it" id="hubLink"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M3 3h18v18H3z"/></svg>總覽</a>
      <a class="nav-it" id="editLink"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg>設定</a>
      <a class="nav-it" id="annLink"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5"/></svg>公告</a>
      <a class="nav-it on"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M3 10h18"/></svg>帳務</a>
      <a class="nav-it" id="scoringLink"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4"/></svg>評分</a>
      <a class="nav-it" id="checkinLink"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M3 11h8V3H3v8z"/></svg>報到</a>
    </div>
  </aside>
  <main>
    <header class="head">
      <div class="crumbs"><a href="/admin/">主辦後台</a><span class="sep">/</span><a href="/admin/events/">活動</a><span class="sep">/</span><a id="crumbHub">—</a><span class="sep">/</span><b>帳務</b></div>
      <div class="actions"><button class="btn-ic-h" id="exportBtn" title="匯出"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button><div class="me-h"><div class="av-c" id="meAv">—</div><span id="meName">—</span></div></div>
    </header>
    <div id="loadingState" class="loading-c">載入付款資料⋯</div>
    <div class="main-c" id="content" style="display:none">
      <div class="sum-row" id="sumRow"></div>

      <!-- FF3: organiser-side billing summary. Hidden when there's nothing payable
           (no PayUNI orders + no confirmed bank transfers in any period). -->
      <div class="billing-card" id="billingCard" style="display:none">
        <div class="billing-h">
          <div>
            <h3>💰 帳務匯出</h3>
            <p>此頁面是「<b>本活動</b>」的帳務；如需跨活動匯出，請於每個活動分別下載。</p>
          </div>
          <div class="range-bar">
            <select id="billPreset">
              <option value="thisMonth">本月迄今</option>
              <option value="lastMonth">上月</option>
              <option value="last7">近 7 日</option>
              <option value="last30">近 30 日</option>
              <option value="last90">近 90 日</option>
              <option value="thisYear">今年</option>
              <option value="all">全部期間</option>
              <option value="custom">自訂期間</option>
            </select>
            <input type="date" id="billFrom" style="display:none">
            <input type="date" id="billTo"   style="display:none">
            <button class="btn btn-ghost btn-sm" id="billReload">↻ 重新計算</button>
            <button class="btn btn-primary btn-sm" id="billExport">⬇️ 匯出帳單</button>
          </div>
        </div>
        <div class="bill-summary" id="billSummary"></div>
        <div class="bill-detail" id="billDetail"></div>
      </div>

      <div class="reconcile-bar" id="reconcileBar" style="display:none">
        <div class="ic-r"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/></svg></div>
        <div class="body">
          <h5>快速銀行對帳</h5>
          <p>輸入銀行帳號末 4 碼，系統會自動標記匹配的隊伍為「已確認」（PayUni 線上付款會自動對帳，無需手動）</p>
        </div>
        <div class="input-bar">
          <input id="reconcileSuffix" placeholder="例：8923" maxlength="4">
          <button class="btn btn-primary btn-sm" id="reconcileBtn">執行對帳</button>
        </div>
      </div>
      <div class="reconcile-bar" id="reconcileDisabledNote" style="display:none; background:var(--surface-2)">
        <div class="ic-r" style="background:var(--muted)"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 11V7a5 5 0 0110 0v4M5 11h14v9H5z"/></svg></div>
        <div class="body">
          <h5>快速銀行對帳未啟用</h5>
          <p>請至「設定 → 收費 → 銀行 / ATM 轉帳」開啟「啟用銀行轉帳收款與對帳」並填寫銀行帳號後，此功能才會開放。</p>
        </div>
      </div>
      <div class="tbl-wrap">
        <table class="tbl">
          <thead><tr><th>編號</th><th>隊名</th><th>狀態</th><th>付款狀態</th><th>付款方式</th><th class="right">金額</th><th>動作</th></tr></thead>
          <tbody id="tblBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="/shared/app-state.js"></script>
<script src="/shared/admin-nav.js"></script>
<script>
(function(){
  AppState.init();
  var me = AppState.getMe();
  if (!me || !me.sessionToken) { location.href = '/login.html?next=' + encodeURIComponent(location.pathname); return; }
  var compId = '';
  var m = location.pathname.match(/\/admin\/events\/([^/]+)\/payments/);
  if (m) compId = decodeURIComponent(m[1]); if (!compId) compId = new URLSearchParams(location.search).get('id') || '';
  if (!compId) { alert('未指定活動編號'); location.href = '/admin/events/'; return; }
  function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]; }); }
  ['hubLink','editLink','annLink','scoringLink','checkinLink'].forEach(function (id) {
    var el = document.getElementById(id);
    var suffix = { hubLink: '', editLink: '/edit', annLink: '/announcements', scoringLink: '/scoring', checkinLink: '/checkin' }[id];
    if (el) el.href = '/admin/events/' + encodeURIComponent(compId) + suffix;
  });
  document.getElementById('orgAv').textContent = (me.displayName || me.username).charAt(0).toUpperCase();
  document.getElementById('orgName').textContent = me.displayName || me.username;
  document.getElementById('meAv').textContent = (me.displayName || me.username).charAt(0).toUpperCase();
  document.getElementById('meName').textContent = me.displayName || me.username;

  var FEE = 0;
  var TEAMS = [];

  function load() {
    Promise.all([
      new Promise(function (res) { google.script.run.withSuccessHandler(res).withFailureHandler(function () { res({}); }).getRegistrationBundle(compId); }),
      new Promise(function (res) { google.script.run.withSuccessHandler(res).withFailureHandler(function () { res([]); }).getAllTeams(compId); })
    ]).then(function (r) {
      var bundle = r[0] || {}; var cfg = bundle.config || {};
      FEE = parseInt(cfg.registrationFee || 0) || 0;
      TEAMS = r[1] || [];
      document.getElementById('crumbHub').href = '/admin/events/' + encodeURIComponent(compId);
      document.getElementById('crumbHub').textContent = cfg.competitionName || compId;
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      // Item 12: quick bank reconciliation only available when bank transfer is enabled in settings.
      var bankOn = (cfg.bankTransferEnabled === true) || (cfg.bankTransferEnabled === undefined && !!(cfg.bankInfo && cfg.bankInfo.accountNumber));
      document.getElementById('reconcileBar').style.display = bankOn ? '' : 'none';
      document.getElementById('reconcileDisabledNote').style.display = bankOn ? 'none' : '';
      renderSum(); renderTable();
    });
  }
  function renderSum() {
    var paid = 0, pending = 0;
    TEAMS.forEach(function (t) {
      if (t.status === '已取消') return;
      if ((t.paymentStatus || '').includes('已確認')) paid++; else pending++;
    });
    var total = paid + pending;
    var revenue = paid * FEE;
    document.getElementById('sumRow').innerHTML =
      '<div class="sum-card featured"><div class="l">應收總額</div><div class="v">NT$ ' + (total * FEE).toLocaleString() + '</div><div class="sub">' + total + ' 筆 × NT$ ' + FEE.toLocaleString() + '</div></div>' +
      '<div class="sum-card"><div class="l">已收</div><div class="v" style="color:var(--ok-700)">NT$ ' + revenue.toLocaleString() + '</div><div class="sub">' + paid + ' 筆已確認</div></div>' +
      '<div class="sum-card"><div class="l">待收</div><div class="v" style="color:var(--warn-700)">NT$ ' + (pending * FEE).toLocaleString() + '</div><div class="sub">' + pending + ' 筆待付款</div></div>' +
      '<div class="sum-card"><div class="l">收款率</div><div class="v">' + (total > 0 ? Math.round(paid / total * 100) : 0) + '<em>%</em></div><div class="sub">已付款 / 總報名</div></div>';
  }
  function renderTable() {
    var rows = TEAMS.filter(function (t) { return t.status !== '已取消'; });
    if (rows.length === 0) {
      document.getElementById('tblBody').innerHTML = '<tr><td colspan="7" style="text-align:center; color:var(--muted); padding:40px">尚無報名資料</td></tr>';
      return;
    }
    document.getElementById('tblBody').innerHTML = rows.map(function (t) {
      var paid = (t.paymentStatus || '').includes('已確認');
      return '<tr>' +
        '<td style="font:500 12px/1 var(--f-mono); color:var(--ink)">' + escapeHtml(t.teamId) + '</td>' +
        '<td><b>' + escapeHtml(t.teamNameCN || t.teamNameEN || '(無)') + '</b></td>' +
        '<td>' + escapeHtml(t.status || '') + '</td>' +
        '<td><span class="pay-pill ' + (paid ? 'confirmed' : 'pending') + '">' + escapeHtml(t.paymentStatus || '待確認') + '</span></td>' +
        '<td>' + escapeHtml(t.paymentMethod || '—') + '</td>' +
        '<td class="right">NT$ ' + FEE.toLocaleString() + '</td>' +
        '<td>' +
          (!paid ? '<button class="action-btn primary" data-act="confirm" data-tid="' + escapeHtml(t.teamId) + '">確認付款</button>' : '') +
          '<button class="action-btn" data-act="view" data-tid="' + escapeHtml(t.teamId) + '">查看</button>' +
          '<button class="action-btn danger" data-act="del" data-tid="' + escapeHtml(t.teamId) + '">刪除</button>' +
        '</td>' +
      '</tr>';
    }).join('');
    document.querySelectorAll('[data-act]').forEach(function (b) {
      b.addEventListener('click', function () {
        var tid = b.dataset.tid;
        if (b.dataset.act === 'confirm') {
          uiConfirm('確認此筆付款？', { title: '確認付款' }).then(function (ok) {
            if (!ok) return;
            google.script.run
              .withSuccessHandler(function () { load(); })
              .withFailureHandler(function (err) { uiAlert('失敗：' + (err && err.message)); })
              .confirmPayment(tid, me.username);
          });
        } else if (b.dataset.act === 'view') {
          openTeamDetail(tid);
        } else if (b.dataset.act === 'del') {
          confirmDelete(tid);
        }
      });
    });
  }

  // ----- Internal team-detail modal (mirrors registrations.html behaviour) -----
  function openModal(title, innerHtml) {
    var ov = document.createElement('div');
    ov.className = 'modal-bg';
    ov.innerHTML =
      '<div class="modal-card">' +
        '<div class="modal-h"><h3>' + escapeHtml(title) + '</h3>' +
          '<button class="btn btn-ghost btn-sm" id="modalClose">關閉</button>' +
        '</div>' +
        '<div class="modal-body">' + innerHtml + '</div>' +
      '</div>';
    document.body.appendChild(ov);
    function close() { if (ov.parentNode) document.body.removeChild(ov); }
    ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
    ov.querySelector('#modalClose').addEventListener('click', close);
    return { ov: ov, close: close };
  }
  function kvHtml(k, v) { if (v === undefined || v === null || v === '') return ''; return '<div class="k">' + escapeHtml(k) + '</div><div class="v">' + escapeHtml(String(v)) + '</div>'; }
  function memberKVs(m) {
    var fields = [
      ['中文姓名','chineseName'],['英文姓名','englishName'],['性別','gender'],['生日','birthday'],
      ['身分證','idNumber'],['護照','passport'],['國籍','nationality'],
      ['學校','school'],['系所','department'],['年級','grade'],['職稱','jobTitle'],['服務單位','organization'],
      ['Email','email'],['電話','phone'],['郵遞區號','postalCode'],['地址','address'],
      ['飲食','dietary'],['飲食限制','dietaryRestriction'],['T-shirt','tshirt'],['住宿','accommodation']
    ];
    var rows = fields.map(function (f) { return kvHtml(f[0], m[f[1]]); }).join('');
    if (m.customAnswers && typeof m.customAnswers === 'object') {
      Object.keys(m.customAnswers).forEach(function (k) { rows += kvHtml(k, m.customAnswers[k]); });
    }
    return rows;
  }
  function openTeamDetail(tid) {
    var modal = openModal('報名詳情 · ' + tid, '<p style="color:var(--muted)">載入中⋯</p>');
    google.script.run
      .withSuccessHandler(function (t) {
        if (!t) { modal.ov.querySelector('.modal-body').innerHTML = '<p style="color:var(--err-700)">查無此筆報名</p>'; return; }
        var html = '';
        html += '<div class="group"><h5>隊伍資訊</h5><div class="kv">' +
          kvHtml('編號', t.teamId) + kvHtml('中文隊名', t.teamNameCN) + kvHtml('英文隊名', t.teamNameEN) +
          kvHtml('組別', t.group) + kvHtml('狀態', t.status) +
          kvHtml('付款狀態', t.paymentStatus) + kvHtml('付款方式', t.paymentMethod) +
          kvHtml('匯款銀行', t.remitterBank) + kvHtml('匯款帳號末 5 碼', t.remitterAccount) +
          kvHtml('報名時間', t.registrationTime) +
          (t.fileUrl ? '<div class="k">檔案</div><div class="v"><a class="file-link" href="' + escapeHtml(t.fileUrl) + '" target="_blank" rel="noopener">檢視 / 下載</a></div>' : '') +
        '</div></div>';
        (t.students || []).forEach(function (s, i) { html += '<div class="group"><h5>學員 ' + (i + 1) + '</h5><div class="kv">' + memberKVs(s) + '</div></div>'; });
        (t.teachers || []).forEach(function (s, i) { html += '<div class="group"><h5>指導者 ' + (i + 1) + '</h5><div class="kv">' + memberKVs(s) + '</div></div>'; });
        modal.ov.querySelector('.modal-body').innerHTML = html;
      })
      .withFailureHandler(function (e) {
        modal.ov.querySelector('.modal-body').innerHTML = '<p style="color:var(--err-700)">載入失敗：' + escapeHtml((e && e.message) || '') + '</p>';
      })
      .getTeamDetail(tid);
  }
  function confirmDelete(tid) {
    var t = TEAMS.filter(function (x) { return x.teamId === tid; })[0] || {};
    var teamLbl = t.teamNameCN || t.teamNameEN || tid;
    uiConfirm('確定刪除隊伍「' + teamLbl + '」（' + tid + '）？此操作無法復原，隊伍的所有成員資料與上傳檔案也會一併刪除。', { title: '刪除報名', okText: '永久刪除', danger: true }).then(function (ok) {
      if (!ok) return;
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.success) {
            uiAlert('已刪除「' + teamLbl + '」').then(function () { load(); });
          } else { uiAlert((res && res.message) || '刪除失敗'); }
        })
        .withFailureHandler(function (e) { uiAlert('刪除失敗：' + (e && e.message)); })
        .deleteTeam(tid);
    });
  }

  document.getElementById('reconcileBtn').addEventListener('click', function () {
    var suffix = document.getElementById('reconcileSuffix').value.trim();
    if (!/^\d{4}$/.test(suffix)) return alert('請輸入 4 位數字');
    var btn = this; btn.disabled = true; btn.textContent = '對帳中⋯';
    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false; btn.textContent = '執行對帳';
        alert('對帳完成：標記 ' + ((res && res.matched) || 0) + ' 筆為已確認');
        load();
      })
      .withFailureHandler(function (err) { btn.disabled = false; btn.textContent = '執行對帳'; alert('失敗：' + (err && err.message)); })
      .reconcilePayments(compId, suffix);
  });
  document.getElementById('exportBtn').addEventListener('click', function () {
    google.script.run
      .withSuccessHandler(function (csv) {
        var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
        var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'payments-' + compId + '-' + new Date().toISOString().slice(0,10) + '.csv'; a.click();
      })
      .exportTeamsCSV(compId);
  });

  // ===== FF3: organiser-side billing summary + export =====
  var BILL = null; // last loaded billing row for this organiser (single-comp filtered)
  function _todayISO() {
    var d = new Date(); var pad = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function _isoFromDelta(days) {
    var d = new Date(); d.setDate(d.getDate() - days + 1); var pad = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function _firstOfMonth(monthsBack) {
    var d = new Date(); d.setMonth(d.getMonth() - monthsBack); var pad = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-01';
  }
  function _lastOfMonth(monthsBack) {
    var d = new Date(); d.setMonth(d.getMonth() - monthsBack + 1); d.setDate(0);
    var pad = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function _resolveRange(preset) {
    if (preset === 'thisMonth')  return { from: _firstOfMonth(0), to: _todayISO() };
    if (preset === 'lastMonth')  return { from: _firstOfMonth(1), to: _lastOfMonth(1) };
    if (preset === 'last7')      return { from: _isoFromDelta(7),  to: _todayISO() };
    if (preset === 'last30')     return { from: _isoFromDelta(30), to: _todayISO() };
    if (preset === 'last90')     return { from: _isoFromDelta(90), to: _todayISO() };
    if (preset === 'thisYear')   return { from: new Date().getFullYear() + '-01-01', to: _todayISO() };
    if (preset === 'all')        return { from: '1970-01-01', to: '9999-12-31' };
    if (preset === 'custom')     return { from: document.getElementById('billFrom').value || '1970-01-01', to: document.getElementById('billTo').value || _todayISO() };
    return { from: '1970-01-01', to: _todayISO() };
  }
  function loadBilling() {
    var preset = document.getElementById('billPreset').value;
    document.getElementById('billFrom').style.display = preset === 'custom' ? '' : 'none';
    document.getElementById('billTo').style.display = preset === 'custom' ? '' : 'none';
    var r = _resolveRange(preset);
    document.getElementById('billSummary').innerHTML = '<div class="b-c"><div class="l">載入中⋯</div></div>';
    google.script.run
      .withSuccessHandler(function (rows) {
        var row = (rows || [])[0];
        if (!row) { BILL = null; document.getElementById('billingCard').style.display = 'none'; return; }
        // Filter orders down to JUST this competition
        row.orders = (row.orders || []).filter(function (o) { return o.compId === compId; });
        // Re-aggregate for this comp only
        var s = { payuniGross: 0, feeTotal: 0, payuniNet: 0, atmNet: 0, payuniCount: 0, atmCount: 0 };
        row.orders.forEach(function (o) {
          if (o.type === 'payuni') { s.payuniGross += o.amount; s.feeTotal += o.fee; s.payuniNet += o.net; s.payuniCount++; }
          else { s.atmNet += o.net; s.atmCount++; }
        });
        s.subtotal = s.payuniNet + s.atmNet;
        s.wireFee  = 15;
        s.actualWire = Math.max(0, s.subtotal - s.wireFee);
        s.orderCount = row.orders.length;
        row.summary = s;
        BILL = row;
        if (s.orderCount === 0) {
          // Hide the whole card when there's nothing payable
          document.getElementById('billingCard').style.display = 'none';
          return;
        }
        document.getElementById('billingCard').style.display = '';
        renderBilling(row);
      })
      .withFailureHandler(function () { document.getElementById('billSummary').innerHTML = '<div class="b-c"><div class="l">載入失敗</div></div>'; })
      .getOrganizerBilling(r.from, r.to, '');
  }
  function renderBilling(row) {
    var s = row.summary;
    var tierLabel = { free: 'Free', starter: 'Starter', pro: 'Pro', team: 'Team' }[row.tier] || row.tier;
    var sum = document.getElementById('billSummary');
    sum.innerHTML =
      '<div class="b-c"><div class="l">主辦方方案</div><div class="v">' + escapeHtml(tierLabel) + '</div><div class="sub">PayUNI 手續費 ' + Number(row.feePct || 0).toFixed(1) + '%</div></div>' +
      '<div class="b-c"><div class="l">PayUNI 收款</div><div class="v">NT$ ' + s.payuniGross.toLocaleString() + '</div><div class="sub">' + s.payuniCount + ' 筆訂單</div></div>' +
      '<div class="b-c"><div class="l">扣除手續費</div><div class="v" style="color:var(--err-700)">− NT$ ' + s.feeTotal.toLocaleString() + '</div><div class="sub">PayUNI 實領 NT$ ' + s.payuniNet.toLocaleString() + '</div></div>' +
      '<div class="b-c"><div class="l">銀行轉帳收款</div><div class="v" style="color:var(--ok-700)">NT$ ' + s.atmNet.toLocaleString() + '</div><div class="sub">' + s.atmCount + ' 筆訂單</div></div>' +
      '<div class="b-c featured"><div class="l">匯款前實領總額</div><div class="v">NT$ ' + s.subtotal.toLocaleString() + '</div><div class="sub">含 PayUNI + 銀行轉帳</div></div>' +
      '<div class="b-c"><div class="l">實際匯款 (扣匯費 NT$15)</div><div class="v">NT$ ' + s.actualWire.toLocaleString() + '</div><div class="sub">' + (row.remitted ? '<span class="bill-remitted-tag">✓ 已匯款 ' + (row.remittance && row.remittance.remittedAt ? row.remittance.remittedAt.slice(0, 10) : '') + '</span>' : '<span style="color:var(--warn-700)">待匯款</span>') + '</div></div>';
    var det = document.getElementById('billDetail');
    if (!row.orders.length) { det.innerHTML = '<p style="color:var(--muted); text-align:center; padding:20px">此期間沒有可入帳的訂單</p>'; return; }
    det.innerHTML =
      '<div class="b-tbl-wrap"><table class="b-tbl">' +
        '<thead><tr><th>類型</th><th>訂單 / 隊伍</th><th>付款資訊</th><th class="right">金額</th><th class="right">手續費</th><th class="right">實領</th></tr></thead>' +
        '<tbody>' +
          row.orders.map(function (o) {
            return '<tr>' +
              '<td><span class="type-pill ' + o.type + '">' + (o.type === 'payuni' ? 'PayUNI' : 'ATM') + '</span></td>' +
              '<td><b>' + escapeHtml(o.orderId) + '</b><br><span style="font:400 11px/1.4 var(--f-tc); color:var(--muted)">' + escapeHtml(o.teamId) + ' · ' + escapeHtml(o.teamNameCN || o.teamNameEN || '—') + '</span></td>' +
              '<td>' + (o.payuniTradeNo ? ('<span style="font:500 11px/1.3 var(--f-mono); color:var(--ink-2)">' + escapeHtml(o.payuniTradeNo) + '</span><br>') : '') + '<span style="font:400 11px/1.4 var(--f-tc); color:var(--muted)">' + escapeHtml(String(o.paidAt).replace('T', ' ').slice(0, 16)) + '</span></td>' +
              '<td class="right">NT$ ' + o.amount.toLocaleString() + '</td>' +
              '<td class="right" style="color:var(--err-700)">' + (o.fee > 0 ? ('− NT$ ' + o.fee.toLocaleString() + ' <span style="color:var(--muted); font-size:10.5px">(' + Number(o.feePct).toFixed(1) + '%)</span>') : '—') + '</td>' +
              '<td class="right" style="font-weight:700; color:var(--ok-700)">NT$ ' + o.net.toLocaleString() + '</td>' +
            '</tr>';
          }).join('') +
        '</tbody></table></div>';
  }
  function exportBilling() {
    if (!BILL || !BILL.orders.length) { alert('沒有資料可匯出'); return; }
    var s = BILL.summary;
    var headers = ['類型', '活動', '訂單編號', '隊伍編號', '中文隊名', '英文隊名', 'PayUNI 交易序號', '付款時間', '報名費', '手續費%', '手續費', '實領金額'];
    var rows = BILL.orders.map(function (o) {
      return [o.type, o.compName, o.orderId, o.teamId, o.teamNameCN, o.teamNameEN, o.payuniTradeNo, o.paidAt, o.amount, Number(o.feePct).toFixed(1) + '%', o.fee, o.net];
    });
    // Aggregate footer
    rows.push([]);
    rows.push(['', '', '', '', '', '', '', 'PayUNI 收款小計', s.payuniGross, '', '', '']);
    rows.push(['', '', '', '', '', '', '', '手續費小計',     '', '', s.feeTotal, '']);
    rows.push(['', '', '', '', '', '', '', 'PayUNI 實領小計', '', '', '', s.payuniNet]);
    rows.push(['', '', '', '', '', '', '', '銀行轉帳實領小計', '', '', '', s.atmNet]);
    rows.push(['', '', '', '', '', '', '', '匯款前實領總額', '', '', '', s.subtotal]);
    rows.push(['', '', '', '', '', '', '', '匯費',           '', '', '', '− ' + s.wireFee]);
    rows.push(['', '', '', '', '', '', '', '實際匯款金額',   '', '', '', s.actualWire]);
    var esc = function (v) {
      v = (v == null ? '' : String(v));
      if (v.indexOf(',') !== -1 || v.indexOf('"') !== -1 || v.indexOf('\n') !== -1) v = '"' + v.replace(/"/g, '""') + '"';
      return v;
    };
    var csv = [headers].concat(rows).map(function (r) { return r.map(esc).join(','); }).join('\n');
    var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    var stamp = BILL.period.fromDate.replace(/-/g, '') + '_' + BILL.period.toDate.replace(/-/g, '');
    var fname = '帳單_' + (compId || '').slice(0, 16) + '_' + stamp + '.csv';
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname; a.click();
  }
  document.getElementById('billPreset').addEventListener('change', loadBilling);
  document.getElementById('billFrom').addEventListener('change', loadBilling);
  document.getElementById('billTo').addEventListener('change', loadBilling);
  document.getElementById('billReload').addEventListener('click', loadBilling);
  document.getElementById('billExport').addEventListener('click', exportBilling);

  load();
  loadBilling();
})();
</script>
