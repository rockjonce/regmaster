<style>
/* Page head */
.page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:24px; flex-wrap:wrap; }
.page-head .l h1 { font:700 28px/1.2 var(--f-display); letter-spacing:-.014em; margin-bottom:4px; }
.page-head .l h1 .ct-h { display:inline-flex; align-items:center; padding:3px 10px; background:var(--surface-2); border:1px solid var(--line); border-radius:7px; font:600 13px/1.4 var(--f-mono); color:var(--ink-2); margin-left:8px; vertical-align:3px; }
.page-head .l p { font:400 13.5px/1.5 var(--f-tc); color:var(--ink-3); }
.page-head .r { display:flex; gap:8px; align-items:center; }

/* Stat strip */
.stat-strip { display:grid; grid-template-columns:repeat(5,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-bottom:24px; }
.stat-strip > div { background:var(--surface); padding:14px 18px; cursor:pointer; transition:.12s; position:relative; user-select:none; }
.stat-strip > div:hover { background:var(--surface-2); }
/* 稽核修正：頁籤視覺語彙 — hover 浮現淡色「預覽底線」（與 .on 選中底線同位置），
   一掃即知可點；不用位移/陰影（strip 為 overflow:hidden 格線，會被裁切出破綻）。 */
.stat-strip > div::before { content:''; position:absolute; left:18px; right:18px; bottom:0; height:2px; background:transparent; transition:.12s; }
.stat-strip > div:hover::before { background:var(--ink-3); }
.stat-strip > div:hover .l-s { color:var(--ink-2); }
.stat-strip > div.on { background:var(--surface-2); }
.stat-strip > div.on::after { content:''; position:absolute; left:18px; right:18px; bottom:0; height:2px; background:var(--ink); }
.stat-strip .l-s { font:500 11px/1 var(--f-mono); letter-spacing:.04em; color:var(--muted); display:flex; align-items:center; gap:6px; margin-bottom:6px; }
.stat-strip .l-s .dot-c { width:6px; height:6px; border-radius:50%; }
.stat-strip .v-s { font:700 22px/1 var(--f-display); letter-spacing:-.014em; }
.stat-strip .v-s em { font-style:normal; font-size:11px; color:var(--muted); margin-left:4px; font-weight:500; }

/* Toolbar */
.toolbar { display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.search-w { flex:1; max-width:340px; position:relative; }
.search-w svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--muted); }
.search-w input { width:100%; padding:9px 12px 9px 34px; background:var(--surface); border:1px solid var(--line); border-radius:9px; font:400 13px/1.4 var(--f-tc); color:var(--ink); }

/* Grid */
.events-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px,1fr)); gap:18px; }
@media (max-width:768px){ .stat-strip { grid-template-columns:repeat(3,1fr); } .events-grid { grid-template-columns:1fr; } }
@media (max-width:460px){ .stat-strip { grid-template-columns:repeat(2,1fr); } }
.evt-card { background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; cursor:pointer; transition:.18s; display:flex; flex-direction:column; text-decoration:none; color:inherit; }
.evt-card:hover { border-color:var(--ink-3); transform:translateY(-2px); box-shadow:var(--sh); }
.evt-card .cover { aspect-ratio:16/8; position:relative; overflow:hidden; }
.evt-card .cover .ph-bg { position:absolute; inset:0; }
.evt-card .cover .ph-bg::before { content:''; position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px); background-size:30px 30px; }
.evt-card .cover.c1 .ph-bg { background:linear-gradient(135deg, #DC2626, #7F1D1D); }
.evt-card .cover.c2 .ph-bg { background:linear-gradient(135deg, #3D6BFF, #1F3FB8); }
.evt-card .cover.c3 .ph-bg { background:linear-gradient(135deg, #16A34A, #14532D); }
.evt-card .cover.c4 .ph-bg { background:linear-gradient(135deg, #F59E0B, #92400E); }
.evt-card .cover.c5 .ph-bg { background:linear-gradient(135deg, #8B5CF6, #4C1D95); }
.evt-card .cover.c6 .ph-bg { background:linear-gradient(135deg, #06B6D4, #155E75); }
.evt-card .cover.c7 .ph-bg { background:linear-gradient(135deg, #475569, #1e293b); }
.evt-card .cover.c8 .ph-bg { background:linear-gradient(135deg, #EC4899, #9D174D); }
.evt-card .cover img.poster-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .3s; }
.evt-card .cover img.poster-img.loaded { opacity:1; }
.evt-card .cover .status-c { position:absolute; top:12px; left:12px; display:inline-flex; align-items:center; gap:5px; padding:4px 10px; background:rgba(0,0,0,.5); backdrop-filter:blur(8px); color:white; border-radius:5px; font:600 10.5px/1.4 var(--f-mono); letter-spacing:.06em; }
.evt-card .cover .status-c .dot-c { width:6px; height:6px; border-radius:50%; }
.evt-card .cover .status-c.live .dot-c { background:#34d77a; box-shadow:0 0 0 3px rgba(52,215,122,.3); animation:pulse-c 2s infinite; }
@keyframes pulse-c { 50% { opacity:.5; } }
.evt-card .cover .status-c.draft { background:rgba(255,255,255,.85); color:var(--ink); }
.evt-card .cover .status-c.draft .dot-c { background:var(--muted); }
.evt-card .cover .status-c.ended { background:rgba(0,0,0,.6); }
.evt-card .cover .status-c.ended .dot-c { background:#94a3b8; }
.evt-card .cover .date-block { position:absolute; bottom:12px; left:12px; padding:8px 12px; background:rgba(0,0,0,.5); backdrop-filter:blur(8px); border-radius:8px; color:white; }
.evt-card .cover .date-block .d { font:800 22px/1 var(--f-display); letter-spacing:-.014em; }
.evt-card .cover .date-block .m { font:500 10px/1 var(--f-mono); letter-spacing:.08em; opacity:.85; margin-top:3px; }
.evt-card .cover .countdown-c { position:absolute; bottom:12px; right:12px; padding:6px 10px; background:rgba(0,0,0,.5); backdrop-filter:blur(8px); border-radius:6px; color:white; font:600 11px/1 var(--f-mono); }

.evt-card .body { padding:16px; display:flex; flex-direction:column; gap:10px; flex:1; }
.evt-card .body h3 { font:700 15px/1.3 var(--f-display); letter-spacing:-.005em; }
.evt-card .body .meta-evt { display:flex; flex-direction:column; gap:5px; font:400 11.5px/1.4 var(--f-tc); color:var(--ink-3); }
.evt-card .body .meta-evt div { display:flex; align-items:center; gap:6px; }
.evt-card .body .meta-evt svg { width:11px; height:11px; opacity:.7; }
.evt-card .body .meta-evt b { color:var(--ink-2); font-weight:500; }

.evt-card .progress { padding-top:10px; margin-top:auto; border-top:1px solid var(--line-2); }
.evt-card .progress .label-p { display:flex; justify-content:space-between; font:500 11px/1.4 var(--f-mono); margin-bottom:6px; }
.evt-card .progress .label-p .l-p { color:var(--muted); }
.evt-card .progress .label-p .v-p { color:var(--ink); font-weight:600; }
.evt-card .progress .v-p .pct { color:var(--ok-700); margin-left:4px; font-size:10.5px; }
.evt-card .progress .v-p.warn .pct { color:var(--warn-700); }
.evt-card .progress .v-p.danger .pct { color:var(--err-700); }
.evt-card .progress .bar-p { height:5px; background:var(--surface-2); border-radius:3px; overflow:hidden; }
.evt-card .progress .bar-p > div { height:100%; border-radius:3px; background:var(--ok-500); }
.evt-card .progress .bar-p.warn > div { background:var(--amber-500); }
.evt-card .progress .bar-p.danger > div { background:var(--err-500); }

.evt-card .quick-row { display:flex; gap:6px; padding:10px 16px; border-top:1px solid var(--line-2); background:var(--surface-2); }
.evt-card .quick-row a { flex:1; text-align:center; padding:7px; font:500 11px/1 var(--f-tc); color:var(--ink-2); border-radius:6px; transition:.15s; cursor:pointer; text-decoration:none; }
.evt-card .quick-row a:hover { background:var(--surface); color:var(--ink); }

/* New-card variant */
.evt-card.new-card { background:var(--surface-2); border:1.5px dashed var(--line); display:grid; place-items:center; min-height:260px; transition:.18s; }
.evt-card.new-card:hover { border-color:var(--acc); background:color-mix(in srgb, var(--acc) 5%, var(--surface-2)); }
.evt-card.new-card .inner { text-align:center; padding:24px; }
.evt-card.new-card .inner .ic-n { width:44px; height:44px; margin:0 auto 12px; border-radius:11px; background:var(--ink); color:var(--surface); display:grid; place-items:center; }
.evt-card.new-card .inner .ic-n svg { width:18px; height:18px; }
.evt-card.new-card .inner h3 { font:700 16px/1.3 var(--f-display); margin-bottom:4px; }
.evt-card.new-card .inner p { font:400 12px/1.5 var(--f-tc); color:var(--muted); margin-bottom:12px; max-width:240px; }
.evt-card.new-card .inner .btn-n { padding:7px 14px; background:var(--ink); color:var(--surface); border-radius:7px; font:600 12px/1 var(--f-tc); display:inline-block; text-decoration:none; }

/* Create modal */
.modal-bg { position:fixed; inset:0; background:rgba(11,28,61,.5); backdrop-filter:blur(4px); display:none; place-items:center; z-index:200; }
.modal-bg.on { display:grid; }
.modal { background:var(--surface); border-radius:18px; padding:32px; max-width:480px; width:90%; box-shadow:var(--sh-xl); }
.modal h3 { font:700 22px/1.2 var(--f-display); margin-bottom:8px; }
.modal p.sub { font:400 14px/1.55 var(--f-tc); color:var(--ink-3); margin-bottom:24px; }
.modal .fld { margin-bottom:14px; }
.modal .lbl { display:block; font:500 12.5px/1.4 var(--f-tc); color:var(--ink-2); margin-bottom:6px; }
.modal input, .modal select { width:100%; padding:10px 14px; background:var(--surface); border:1px solid var(--line); border-radius:9px; font:400 14px/1.5 var(--f-tc); color:var(--ink); }
.modal input:focus, .modal select:focus { outline:0; border-color:var(--acc); box-shadow:0 0 0 3px rgba(61,107,255,.16); }
.modal .actions { display:flex; gap:10px; justify-content:flex-end; margin-top:24px; padding-top:18px; border-top:1px solid var(--line-2); }
</style>
</head>

<script>
(function () {
  AppState.init();
  var me = AppState.getMe();
  if (!me || !me.sessionToken) {
    location.href = '/login.html?next=' + encodeURIComponent(location.pathname);
    return;
  }

  function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]; }); }
  function parseDate(s) { if (!s) return null; var d = new Date(s); if (!isNaN(d.getTime())) return d; var m = String(s).match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/); if (m) return new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3])); return null; }
  function showErr(msg) { var b = document.getElementById('errorBanner'); b.innerHTML = msg; b.style.display = 'block'; }

  var _ini = (me.displayName || me.username || '?').charAt(0).toUpperCase();
  setTxt('meAv', _ini); setTxt('meName', me.displayName || me.username);
  setTxt('orgAv', _ini); setTxt('orgName', me.displayName || me.username);
  setTxt('orgPlan', me.role === 'system' ? '系統管理員' : '主辦方');

  var ALL = [];
  // 第5項(A案)：filter 延後至資料載入後決定（URL → 上次選擇 → 有進行中預設live、否則all）
  var STATE = { filter: null, q: '' };

  function classifyComp(c) {
    var now = Date.now();
    var dl = parseDate(c.deadline);
    var od = parseDate(c.openDate);
    if (c.isOpen) return 'live';
    if (od && now < od.getTime()) return 'upcoming';
    if (dl && now > dl.getTime()) return 'ended';
    return 'draft';
  }

  // Null-safe DOM setters — never throw if an element is absent (e.g. a sidebar
  // node owned by the shared shell), so a missing node can't hang the page.
  function setTxt(id, v) { var el = document.getElementById(id); if (el) el.textContent = v; }
  function setHtml(id, v) { var el = document.getElementById(id); if (el) el.innerHTML = v; }

  function render() {
    var grid = document.getElementById('contentArea');
    if (!grid) return;
    var counts = { all: ALL.length, live: 0, upcoming: 0, draft: 0, ended: 0 };
    ALL.forEach(function (c) { counts[classifyComp(c)]++; });
    setHtml('ssAll', counts.all + '<em>' + window.L('aeIdxUnitEvents') + '</em>');
    setTxt('ssLive', counts.live);
    setTxt('ssUp', counts.upcoming);
    setTxt('ssDr', counts.draft);
    setTxt('ssEd', counts.ended);
    setTxt('navCompCount', counts.all);
    setTxt('totalCount', window.L('aeIdxTotalCount').replace('{n}', counts.all));
    setTxt('subline', window.L('aeIdxSublinePrefix') + ' · ' + window.L('aeIdxSublineLive') + ' ' + counts.live + ' / ' + window.L('aeIdxSublineDraft') + ' ' + counts.draft + ' / ' + window.L('aeIdxSublineEnded') + ' ' + counts.ended);

    var q = (STATE.q || '').toLowerCase();
    var f = STATE.filter || 'all';   // 第5項：null 防護 — 未解析前以「全部」語意渲染，對任何呼叫時序穩健
    var filtered = ALL.filter(function (c) {
      if (f !== 'all' && classifyComp(c) !== f) return false;
      if (!q) return true;
      // Z2: system admin can also search by 主辦方帳號 (c.creator).
      var haystack = c.name + ' ' + (c.category || '');
      if (me.role === 'system' && c.creator) haystack += ' ' + c.creator;
      return haystack.toLowerCase().indexOf(q) !== -1;
    });

    // Sort: live first, then upcoming, then by created
    filtered.sort(function (a, b) {
      var oa = ['live', 'upcoming', 'draft', 'ended'].indexOf(classifyComp(a));
      var ob = ['live', 'upcoming', 'draft', 'ended'].indexOf(classifyComp(b));
      if (oa !== ob) return oa - ob;
      return (b.createdAt || '').localeCompare(a.createdAt || '');
    });

    var newCard = '<div class="evt-card new-card" id="newCardBtn"><div class="inner">' +
      '<div class="ic-n"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>' +
      '<h3>' + window.L('aeIdxNewCardTitle') + '</h3>' +
      '<p>' + window.L('aeIdxNewCardDesc') + '</p>' +
      '<span class="btn-n">' + window.L('aeIdxNewCardStart') + '</span>' +
      '</div></div>';
    var html = newCard + filtered.map(renderCard).join('');
    grid.innerHTML = '<div class="events-grid">' + html + '</div>';
    hydratePosters(grid);
    if (window.applyI18n) window.applyI18n(grid);

    document.getElementById('newCardBtn').addEventListener('click', openCreateModal);
    document.querySelectorAll('.evt-card[data-id]').forEach(function (card) {
      card.addEventListener('click', function (e) {
        if (e.target.closest('.quick-row a')) return;
        location.href = '/admin/events/' + encodeURIComponent(card.dataset.id);
      });
    });
  }

  // 海報以 base64 存在 Firestore、須經 getPosterData 解析（無 CDN、無瀏覽器快取，平均約 300KB），
  // 因此一律「捲動到可視範圍才載入」，並以 compId 快取——本頁在搜尋/篩選時會整批重繪，
  // 沒有快取會重複抓取。載入完全在關鍵路徑之外：卡片先出現，海報之後淡入。
  var POSTER_CACHE = {};
  var _posterIO = null;
  function fillPoster(img) {
    var id = img.getAttribute('data-poster');
    if (!id) return;
    img.removeAttribute('data-poster');   // 先認領，避免同一張被重複請求
    if (POSTER_CACHE[id] !== undefined) { if (POSTER_CACHE[id]) img.src = POSTER_CACHE[id]; return; }
    google.script.run
      .withSuccessHandler(function (res) {
        var src = (res && res.success && res.dataUri) ? res.dataUri : '';
        POSTER_CACHE[id] = src;          // 空字串也快取：沒有海報的活動不再重試
        if (src) img.src = src;
      })
      .withFailureHandler(function () { POSTER_CACHE[id] = ''; })
      .getPosterData(id);
  }
  function hydratePosters(scope) {
    var imgs = Array.prototype.slice.call(scope.querySelectorAll('img.poster-img[data-poster]'));
    if (!imgs.length) return;
    // 已快取的直接補上（零網路成本），其餘才交給 observer 等捲動
    var pending = imgs.filter(function (el) {
      var id = el.getAttribute('data-poster');
      if (POSTER_CACHE[id] === undefined) return true;
      el.removeAttribute('data-poster');
      if (POSTER_CACHE[id]) el.src = POSTER_CACHE[id];
      return false;
    });
    if (!pending.length) return;
    if (!('IntersectionObserver' in window)) { pending.forEach(fillPoster); return; }
    // 首屏（含 200px 預載邊界）同步直接載入，不等 observer 首次回呼 —— 首屏海報早一個來回出現，
    // 也避免在不合成畫面的環境（背景分頁/嵌入式檢視）中 observer 遲遲不觸發而完全沒圖。
    var vh = window.innerHeight || document.documentElement.clientHeight || 0;
    var rest = [];
    pending.forEach(function (el) {
      var r = el.getBoundingClientRect();
      if (r.bottom >= -200 && r.top <= vh + 200) fillPoster(el); else rest.push(el);
    });
    pending = rest;
    if (!pending.length) return;
    if (!_posterIO) {
      _posterIO = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (!e.isIntersecting) return;
          _posterIO.unobserve(e.target);
          fillPoster(e.target);
        });
      }, { rootMargin: '200px' });
    }
    pending.forEach(function (el) { _posterIO.observe(el); });
  }

  function renderCard(c, idx) {
    var cls = classifyComp(c);
    var statusHtml;
    if (cls === 'live') statusHtml = '<div class="status-c live"><span class="dot-c"></span>' + window.L('aeIdxStatusLive') + '</div>';
    else if (cls === 'upcoming') statusHtml = '<div class="status-c draft"><span class="dot-c"></span>' + window.L('aeIdxStatusUpcoming') + '</div>';
    else if (cls === 'ended') statusHtml = '<div class="status-c ended"><span class="dot-c"></span>' + window.L('aeIdxStatusEnded') + '</div>';
    else statusHtml = '<div class="status-c draft"><span class="dot-c"></span>' + window.L('aeIdxStatusDraft') + '</div>';

    var max = c.maxTeams || c.maxCapacityLimit || 0;
    // R6-10(殘留): 計數含備取會顯示 4/3・100% 超額 — 正取封頂、超出標示候補（與探索/儀表板一致）
    var _cnt = c.teamCount || 0;
    var _over = (max > 0 && _cnt > max) ? (_cnt - max) : 0;
    var _shown = max > 0 ? Math.min(_cnt, max) : _cnt;
    var pct = max > 0 ? Math.min(100, _shown / max * 100) : 0;
    var pctClass = pct > 90 ? 'danger' : pct > 70 ? 'warn' : '';
    var dl = parseDate(c.deadline);
    var daysLeft = dl ? Math.ceil((dl.getTime() - Date.now()) / 86400000) : null;
    var countdown = '';
    if (cls === 'live' && daysLeft !== null && daysLeft >= 0) countdown = '<div class="countdown-c">' + window.L('aeIdxCountdown').replace('{n}', daysLeft) + '</div>';

    var dateBlock = '';
    if (dl) {
      var m = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][dl.getMonth()];
      var wd = ['SUN','MON','TUE','WED','THU','FRI','SAT'][dl.getDay()];
      dateBlock = '<div class="date-block"><div class="d">' + (dl.getMonth()+1).toString().padStart(2,'0') + '.' + String(dl.getDate()).padStart(2,'0') + '</div><div class="m">' + wd + ' · ' + m + '</div></div>';
    }

    var coverClass = 'c' + ((idx % 8) + 1);
    // listCompetitions 不回傳海報欄位，但 getPosterData 只需要 compId（後端自己查 posterDocId），
    // 所以掛上 data-poster 即可，毋須改動後端。實際取圖由 hydratePosters() 在捲動到時才觸發，
    // 沒有海報的活動會快取空值、不再重試；抓不到就維持底下的漸層。
    var coverInner = '<div class="ph-bg"></div>'
      + '<img class="poster-img" data-poster="' + escapeHtml(c.compId) + '" alt="" onload="this.classList.add(\'loaded\')" onerror="this.style.display=\'none\'">';

    // Z1: 主辦方帳號 tag — only the system role sees this; protects organiser privacy in shared screenshots.
    var creatorTag = '';
    if (me.role === 'system' && c.creator) {
      creatorTag = '<div style="margin-bottom:10px"><span style="display:inline-flex; align-items:center; gap:4px; padding:3px 9px; font:600 10.5px/1.4 var(--f-mono); background:color-mix(in srgb, var(--acc) 14%, var(--surface-2)); color:var(--acc); border-radius:5px">👤 ' + escapeHtml(c.creator) + '</span></div>';
    }
    return '<a class="evt-card" data-id="' + escapeHtml(c.compId) + '">' +
      '<div class="cover ' + coverClass + '">' + coverInner + statusHtml + dateBlock + countdown + '</div>' +
      '<div class="body">' +
        '<h3>' + escapeHtml(c.name) + '</h3>' +
        creatorTag +
        '<div class="meta-evt">' +
          '<div><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3M3 11h18"/></svg>' + escapeHtml((c.deadline || '').replace('T', ' ') || window.L('aeIdxNoDeadline')) + '</div>' +
          '<div><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0"/></svg><b>' + _shown + '</b> ' + window.L('aeIdxRegSuffix') + (max > 0 ? ' / ' + max : '') + (_over ? ' <span style="color:var(--muted)">' + window.L('aeIdxWlSuffix').replace('{n}', _over) + '</span>' : '') + '</div>' +
        '</div>' +
        '<div class="progress">' +
          '<div class="label-p"><span class="l-p">' + window.L('aeIdxProgressLabel') + '</span><span class="v-p ' + pctClass + '">' + _shown + (max > 0 ? ' / ' + max : '') + ' <span class="pct">' + (max > 0 ? Math.round(pct) + '%' : window.L('aeIdxNoLimit')) + '</span></span></div>' +
          '<div class="bar-p ' + pctClass + '"><div style="width:' + pct + '%"></div></div>' +
        '</div>' +
      '</div>' +
      // Y1: removed the inline 公開頁 / 開放 / 複製 footer — these actions live inside the event hub.
    '</a>';
  }

  // ---- Quick actions ----
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    e.preventDefault(); e.stopPropagation();
    var action = btn.dataset.action;
    var id = btn.dataset.id;
    if (action === 'toggle-open') {
      var isOpen = btn.dataset.current === '1';
      uiConfirm(window.L('aeIdxConfirmToggle').replace('{action}', isOpen ? window.L('aeIdxToggleClose') : window.L('aeIdxToggleOpen')), { title: window.L('aeIdxRegStatusTitle') }).then(function (ok) {
        if (!ok) return;
        withLoadingUI(btn, function () { return runFn('setRegistrationOpen', id, !isOpen); }, {
          busyText: window.L('uiBusyToggleReg'), toast: false, errorTitle: window.L('aeIdxRegStatusTitle')
        }).then(function () { load(); }).catch(function () {});
      });
    } else if (action === 'duplicate') {
      uiPrompt(window.L('aeIdxDupPrompt'), btn.dataset.name + window.L('aeIdxDupSuffix'), { title: window.L('aeIdxDupTitle') }).then(function (nm) {
        if (!nm) return;
        withLoadingUI(btn, function () { return runFn('duplicateCompetition', id, nm, me.username); }, {
          busyText: window.L('uiBusyDuplicating'), toastMsg: window.L('uiBusyDuplicating'), toastId: 'dupComp-' + id,
          blockUnload: true, errorTitle: window.L('aeIdxDupTitle')
        }).then(function () { uiToast(window.L('aeIdxDupDone')); load(); }).catch(function () {});
      });
    }
  });

  // ---- Create modal ----
  function openCreateModal() { document.getElementById('createModal').classList.add('on'); document.getElementById('newName').focus(); }
  function closeCreateModal() { document.getElementById('createModal').classList.remove('on'); document.getElementById('newName').value = ''; document.getElementById('createErr').style.display = 'none'; }
  document.getElementById('newCompBtn').addEventListener('click', openCreateModal);
  document.getElementById('cancelCreate').addEventListener('click', closeCreateModal);
  // R8-6 防護：活動名稱欄 Enter 直接送出（偶發「第一次點建立無反應」的替代路徑）
  document.getElementById('newName').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('confirmCreate').click(); } });
  document.getElementById('createModal').addEventListener('click', function (e) { if (e.target === this) closeCreateModal(); });
  document.getElementById('confirmCreate').addEventListener('click', function () {
    var name = document.getElementById('newName').value.trim();
    if (!name) { document.getElementById('createErr').textContent = window.L('aeIdxNeedName'); document.getElementById('createErr').style.display = 'block'; return; }
    var category = document.getElementById('newCategory').value;
    var eventType = document.getElementById('newEventType').value;
    var btn = this; btn.disabled = true; btn.textContent = window.L('aeIdxCreating');
    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false; btn.textContent = window.L('aeIdxConfirmCreate');
        if (res && res.success) {
          closeCreateModal();
          // Go straight to the event hub
          location.href = '/admin/events/' + encodeURIComponent(res.compId);
        } else {
          document.getElementById('createErr').textContent = (res && res.message) || window.L('aeIdxCreateFail');
          document.getElementById('createErr').style.display = 'block';
        }
      })
      .withFailureHandler(function (err) {
        btn.disabled = false; btn.textContent = window.L('aeIdxConfirmCreate');
        document.getElementById('createErr').textContent = (err && err.message) || window.L('aeIdxNetworkErr');
        document.getElementById('createErr').style.display = 'block';
      })
      .createCompetition(name, category, eventType);
  });

  // ---- Filter handlers ----
  document.querySelectorAll('#statStrip > div').forEach(function (d) {
    d.addEventListener('click', function () {
      document.querySelectorAll('#statStrip > div').forEach(function (x) { x.classList.remove('on'); });
      d.classList.add('on');
      STATE.filter = d.dataset.filter;
      try { localStorage.setItem('rm_evtFilter', STATE.filter); } catch (e) {}   // 第5項：記憶選擇
      render();
    });
  });
  document.getElementById('filterInput').addEventListener('input', function (e) { STATE.q = e.target.value; render(); });
  document.getElementById('searchInput').addEventListener('input', function (e) {
    STATE.q = e.target.value;
    document.getElementById('filterInput').value = e.target.value;
    render();
  });

  // ---- Auto-open create modal on ?new=1 ----
  if (new URLSearchParams(location.search).get('new') === '1') {
    setTimeout(openCreateModal, 200);
  }
  // ---- Pre-fill search from ?q= ----
  var qsq = new URLSearchParams(location.search).get('q');
  if (qsq) { STATE.q = qsq; document.getElementById('searchInput').value = qsq; document.getElementById('filterInput').value = qsq; }

  // ---- Logout ----
  document.getElementById('logoutBtn').addEventListener('click', function (e) { e.preventDefault(); AppState.setMe(null); location.href = '/login.html'; });

  // ---- Load ----
  function load() {
    google.script.run
      .withSuccessHandler(function (list) {
        ALL = list || [];
        // 第5項(A案)：首次載入後解析預設篩選 — URL ?filter= → localStorage 上次選擇 →
        // 有進行中活動預設「進行中」、否則退回「全部」（避免新帳號/全結束時一進來空清單）
        if (STATE.filter === null) {
          var VALID = ['all', 'live', 'upcoming', 'draft', 'ended'];
          var qf = new URLSearchParams(location.search).get('filter');
          var saved = null; try { saved = localStorage.getItem('rm_evtFilter'); } catch (e) {}
          var hasLive = ALL.some(function (c) { return classifyComp(c) === 'live'; });
          STATE.filter = (VALID.indexOf(qf) >= 0 && qf) || (VALID.indexOf(saved) >= 0 && saved) || (hasLive ? 'live' : 'all');
          document.querySelectorAll('#statStrip > div').forEach(function (x) {
            x.classList.toggle('on', x.dataset.filter === STATE.filter);
          });
        }
        render();
      })
      .withFailureHandler(function (err) {
        showErr(window.L('aeIdxLoadFail') + escapeHtml((err && err.message) || ''));
        document.getElementById('contentArea').innerHTML = '<div class="events-grid">' +
          '<div class="evt-card new-card" id="newCardBtn"><div class="inner">' +
          '<div class="ic-n"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>' +
          '<h3>' + window.L('aeIdxNewCardTitle') + '</h3><p>' + window.L('aeIdxNewCardFirstDesc') + '</p><span class="btn-n">' + window.L('aeIdxNewCardStart') + '</span></div></div>' +
        '</div>';
        document.getElementById('newCardBtn').addEventListener('click', openCreateModal);
      })
      .listCompetitions();
  }
  load();
})();
</script>
</body>
