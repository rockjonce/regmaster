<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 助理 · 主辦後台 · RegMaster</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/shared/styles.css">
<link rel="stylesheet" href="/shared/admin-layout.css">

<script src="/__/firebase/10.7.1/firebase-functions-compat.js"></script>

</head>
<body>
<div class="admin">
  <aside class="side">
    <a class="brand" href="/admin/"><div class="logo"><img src="/favicon.png" alt="RegMaster" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block"></div><div class="nm">RegMaster<small>主辦後台</small></div></a>
    <div class="org-switcher"><div class="av" id="orgAv">—</div><div class="body"><h6 id="orgName">—</h6><p>主辦方</p></div></div>
    <div class="nav-grp">
      <div class="l-grp">概覽</div>
      <a class="nav-it" href="/admin/"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/></svg>儀表板</a>
      <a class="nav-it" href="/admin/events/"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3M3 11h18"/></svg>所有活動</a>
      <a class="nav-it on" href="/admin/ai.html"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M12 2l2 7h7l-5.5 4 2 7L12 16l-5.5 4 2-7L3 9h7z"/></svg>AI 助理</a>
    </div>
    <div class="nav-grp">
      <div class="l-grp">資源</div>
      <a class="nav-it" href="/admin/license.html">方案與授權</a>
      <a class="nav-it" href="/admin/settings.html">設定</a>
    </div>
  </aside>
  <main>
    <header class="head">
      <div class="crumbs"><a href="/admin/">主辦後台</a><span class="sep">/</span><b>AI 助理</b></div>
      <div class="actions"><div class="me-h"><div class="av-c" id="meAv">—</div><span id="meName">—</span></div></div>
    </header>
    <div class="body-3" id="content">
      <aside class="left-c">
        <div class="lh">
          <h3 data-i18n="adAiHistory">對話歷史</h3>
          <button class="new-conv-btn" id="newConvBtn" data-i18n="adAiNewConv">＋ 新對話</button>
        </div>
        <div class="conv-list" id="convList"></div>
      </aside>
      <section class="center-c">
        <header class="chat-h">
          <div class="av-h"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2l2 7h7l-5.5 4 2 7L12 16l-5.5 4 2-7L3 9h7z"/></svg></div>
          <div><h4 data-i18n="adAiChatTitle">RegMaster AI 助理</h4><p data-i18n="adAiChatSub">由 Gemini 驅動 · 可協助活動規劃 / 報名問題 / 數據分析</p></div>
        </header>
        <div class="messages" id="messages">
          <div class="empty-chat">
            <div class="ic"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2l2 7h7l-5.5 4 2 7L12 16l-5.5 4 2-7L3 9h7z"/></svg></div>
            <h3 data-i18n="adAiEmptyTitle">有什麼可以幫你的？</h3>
            <p data-i18n="adAiEmptyDesc">新建對話或從左側選擇歷史對話開始。</p>
            <div class="suggestions">
              <div class="sg" data-sg="如何提升報名轉換率？" data-i18n="adAiSg1">如何提升報名轉換率？</div>
              <div class="sg" data-sg="幫我擬一封報名提醒信" data-i18n="adAiSg2">幫我擬一封報名提醒信</div>
              <div class="sg" data-sg="哪些功能可以提升活動體驗？" data-i18n="adAiSg3">哪些功能可以提升活動體驗？</div>
              <div class="sg" data-sg="分析我目前的活動表現" data-i18n="adAiSg4">分析我目前的活動表現</div>
            </div>
          </div>
        </div>
        <div class="input-area">
          <div class="input-wrap">
            <textarea id="msgInput" placeholder="輸入問題⋯ (Enter 送出，Shift+Enter 換行)" data-i18n-placeholder="adAiInputPlaceholder" rows="1"></textarea>
            <button class="send-btn" id="sendBtn" disabled><svg fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg></button>
          </div>
        </div>
      </section>
      <aside class="right-c">
        <h4 data-i18n="adAiScopeTitle">查詢範圍</h4>
        <div class="scope-picker" id="scopePicker">
          <button class="on" data-scope="admin" data-i18n="adAiScopeAdmin">主辦後台</button>
          <button data-scope="comp" data-i18n="adAiScopeComp">特定活動</button>
        </div>
        <select id="compSelect" style="width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px; margin-bottom:14px; display:none">
          <option value="" data-i18n="adAiSelectComp">選擇活動⋯</option>
        </select>
        <h4 id="kbTitle" data-i18n="adAiKbTitle">知識庫</h4>
        <div id="kbPanel"></div>
      </aside>
    </div>
  </main>
</div>
<script src="/shared/app-state.js"></script>
<script src="/shared/i18n.js"></script>
<script src="/shared/i18n-admin-ai.js"></script>
<script src="/shared/admin-nav.js"></script>
<script>
(function(){
  AppState.init();
  var me = AppState.getMe();
  if (!me || !me.sessionToken) { location.href = '/login.html?next=' + encodeURIComponent(location.pathname); return; }
  function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]; }); }

  // Minimal, XSS-safe Markdown renderer (escape first, then add formatting tags).
  function mdInline(t) {
    t = t.replace(/`([^`\n]+)`/g, '<code class="md-code">$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return t;
  }
  function mdToHtml(src) {
    var s = escapeHtml(src || '');
    var fences = [];
    s = s.replace(/```([\s\S]*?)```/g, function (_, c) { fences.push(c.replace(/^\n/, '').replace(/\n$/, '')); return 'RMFENCE' + (fences.length - 1) + 'END'; });
    var lines = s.split('\n'), html = '', i = 0, para = [];
    function flushPara() { if (para.length) { html += '<p>' + para.map(mdInline).join('<br>') + '</p>'; para = []; } }
    while (i < lines.length) {
      var ln = lines[i];
      var f = ln.match(/^RMFENCE(\d+)END$/);
      if (f) { flushPara(); html += '<pre class="md-pre"><code>' + fences[+f[1]] + '</code></pre>'; i++; continue; }
      var h = ln.match(/^\s{0,3}#{1,6}\s+(.+)$/);
      if (h) { flushPara(); html += '<div class="md-h">' + mdInline(h[1]) + '</div>'; i++; continue; }
      var mu = ln.match(/^\s*[-*•]\s+(.+)$/);
      if (mu) { flushPara(); html += '<ul class="md-ul">'; while (i < lines.length && (mu = lines[i].match(/^\s*[-*•]\s+(.+)$/))) { html += '<li>' + mdInline(mu[1]) + '</li>'; i++; } html += '</ul>'; continue; }
      var mo = ln.match(/^\s*\d+[.、)]\s+(.+)$/);
      if (mo) { flushPara(); html += '<ol class="md-ol">'; while (i < lines.length && (mo = lines[i].match(/^\s*\d+[.、)]\s+(.+)$/))) { html += '<li>' + mdInline(mo[1]) + '</li>'; i++; } html += '</ol>'; continue; }
      if (ln.trim() === '') { flushPara(); i++; continue; }
      para.push(ln); i++;
    }
    flushPara();
    return html;
  }
  document.getElementById('orgAv').textContent = (me.displayName || me.username).charAt(0).toUpperCase();
  document.getElementById('orgName').textContent = me.displayName || me.username;
  document.getElementById('meAv').textContent = (me.displayName || me.username).charAt(0).toUpperCase();
  document.getElementById('meName').textContent = me.displayName || me.username;

  var CONVS = [];
  var SELECTED = null;
  var MESSAGES = [];
  var SCOPE = 'admin';
  var SELECTED_COMP = '';

  // Load competitions for the comp scope
  google.script.run.withSuccessHandler(function (list) {
    var sel = document.getElementById('compSelect');
    (list || []).forEach(function (c) {
      var opt = document.createElement('option');
      opt.value = c.compId; opt.textContent = c.name;
      sel.appendChild(opt);
    });
  }).withFailureHandler(function () {}).listCompetitions();

  function loadConvs() {
    google.script.run
      .withSuccessHandler(function (res) {
        CONVS = (res && res.conversations) || [];
        renderConvs();
      })
      .withFailureHandler(function () {})
      .listConversations(SCOPE === 'comp' ? SELECTED_COMP : '');
  }

  function renderConvs() {
    var list = document.getElementById('convList');
    if (CONVS.length === 0) {
      list.innerHTML = '<p style="text-align:center; color:var(--muted); padding:24px 16px; font:500 12px/1.5 var(--f-tc)">' + L('adAiNoConv') + '</p>';
      return;
    }
    list.innerHTML = CONVS.map(function (c) {
      return '<div class="conv" data-id="' + c.id + '">' +
        '<div class="del-btn" data-del="' + c.id + '" title="' + escapeHtml(L('adAiDelTitle')) + '">×</div>' +
        '<div class="nm">' + escapeHtml(c.title || L('adAiConvDefaultTitle')) + (c.compId ? ' <span class="pill-c">' + escapeHtml(L('adAiConvActivity')) + '</span>' : '') + '</div>' +
        '<div class="preview">' + escapeHtml(c.lastSnippet || L('adAiConvNoSnippet')) + '</div>' +
        '<div class="time">' + escapeHtml(c.updatedAt || '') + ' · ' + (c.messageCount || 0) + ' ' + escapeHtml(L('adAiConvUnit')) + '</div>' +
      '</div>';
    }).join('');
    list.querySelectorAll('.conv').forEach(function (el) {
      el.addEventListener('click', function (e) {
        if (e.target.closest('[data-del]')) return;
        selectConv(el.dataset.id);
      });
    });
    list.querySelectorAll('[data-del]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        uiConfirm(L('adAiConfirmDel'), { title: L('adAiConfirmDelTitle'), okText: L('adAiConfirmDelOk'), danger: true }).then(function (ok) {
          if (!ok) return;
          var row = b.closest('.conv');
          if (row) { row.style.opacity = '.45'; row.style.pointerEvents = 'none'; }
          b.innerHTML = '⋯';
          google.script.run
            .withSuccessHandler(function () { if (SELECTED && SELECTED.id === b.dataset.del) { SELECTED = null; renderMessages(); } loadConvs(); })
            .withFailureHandler(function () { if (row) { row.style.opacity = ''; row.style.pointerEvents = ''; } b.innerHTML = '×'; uiAlert(L('adAiDelFail')); })
            .deleteConversation(b.dataset.del);
        });
      });
    });
  }

  function selectConv(id) {
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.success) {
          SELECTED = res.conversation;
          MESSAGES = res.messages || [];
          renderMessages();
          document.querySelectorAll('.conv').forEach(function (x) { x.classList.toggle('on', x.dataset.id === id); });
        }
      })
      .getConversation(id);
  }

  function renderMessages() {
    var box = document.getElementById('messages');
    if (!SELECTED || MESSAGES.length === 0) {
      box.innerHTML = '<div class="empty-chat">' +
        '<div class="ic"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2l2 7h7l-5.5 4 2 7L12 16l-5.5 4 2-7L3 9h7z"/></svg></div>' +
        '<h3>' + escapeHtml(SELECTED ? L('adAiEmptyTitleStarted') : L('adAiEmptyTitle')) + '</h3>' +
        '<p>' + escapeHtml(SELECTED ? L('adAiEmptyDescStarted') : L('adAiEmptyDescPlain')) + '</p>' +
        (!SELECTED ? '<div class="suggestions">' +
          [L('adAiSg1'),L('adAiSg2'),L('adAiSg3'),L('adAiSg4')]
            .map(function (s) { return '<div class="sg" data-sg="' + escapeHtml(s) + '">' + escapeHtml(s) + '</div>'; }).join('') +
        '</div>' : '') +
      '</div>';
      // .sg clicks handled via delegation on #messages (fills + sends) — see submitSuggestion below.
      return;
    }
    box.innerHTML = MESSAGES.map(function (m) {
      var avLabel = m.role === 'user' ? (me.displayName || me.username).charAt(0).toUpperCase() : L('adAiAvAi');
      var inner;
      if (m._typing) {
        inner = '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
      } else {
        var body = m.role === 'ai' ? mdToHtml(m.content) : escapeHtml(m.content);
        inner = '<div class="bubble">' + body + '</div><div class="ts">' + escapeHtml((m.createdAt || '').slice(11, 19)) + '</div>';
      }
      return '<div class="msg ' + escapeHtml(m.role) + '">' +
        '<div class="av-m ' + escapeHtml(m.role) + '">' + escapeHtml(avLabel) + '</div>' +
        '<div>' + inner + '</div>' +
      '</div>';
    }).join('');
    box.scrollTop = box.scrollHeight;
  }

  // ---- Knowledge-base panel: reflect the ACTUAL sources the AI reads per scope ----
  var OPEN_IC = '<svg class="open-ic" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M14 3h7v7M21 3l-9 9M5 5h6M5 5v14h14v-6"/></svg>';
  function hintBox(t) { return '<p style="font:400 11.5px/1.55 var(--f-tc); color:var(--muted); padding:14px; background:var(--acc-soft); border-radius:9px; margin-top:14px">💡 ' + t + '</p>'; }
  var KB_CACHE = {};
  function currentCompName() {
    var sel = document.getElementById('compSelect');
    return (sel && sel.selectedIndex >= 0) ? sel.options[sel.selectedIndex].textContent : '';
  }
  function paintCompKb(st, compName) {
    var panel = document.getElementById('kbPanel');
    if (SCOPE !== 'comp') return;
    var items = '';
    if (st.hasRules) items += '<div class="kb-item"><h6>' + escapeHtml(L('adAiKbRulesH')) + '</h6><p>' + escapeHtml(L('adAiKbRulesP')) + '</p></div>';
    if (st.hasDescription) items += '<div class="kb-item"><h6>' + escapeHtml(L('adAiKbDescH')) + '</h6><p>' + escapeHtml(L('adAiKbDescP')) + '</p></div>';
    if (st.hasRegData) items += '<div class="kb-item"><h6>' + escapeHtml(L('adAiKbRegDataH')) + '</h6><p>' + escapeHtml(L('adAiKbRegDataP1')) + (st.regCount || 0) + escapeHtml(L('adAiKbRegDataP2')) + '</p></div>';
    if (st.hasOrgInfo) items += '<a class="kb-item" href="/admin/settings.html"><h6>' + escapeHtml(L('adAiKbOrgH')) + OPEN_IC + '</h6><p>' + escapeHtml(L('adAiKbOrgP')) + '</p></a>';
    if (!items) {
      panel.innerHTML = '<p style="font:400 11.5px/1.55 var(--f-tc); color:var(--muted); padding:14px; background:var(--surface-2); border:1px solid var(--line-2); border-radius:9px">' + escapeHtml(L('adAiKbEmptyComp')) + '</p>';
      return;
    }
    panel.innerHTML = items + hintBox(escapeHtml(L('adAiHintCompA')) + (st.hasRegData ? escapeHtml(L('adAiHintCompRegData')) : '') + escapeHtml(L('adAiHintCompB')));
  }
  function renderKbPanel() {
    var panel = document.getElementById('kbPanel');
    var title = document.getElementById('kbTitle');
    if (SCOPE === 'comp') {
      title.textContent = L('adAiKbTitleComp');
      if (!SELECTED_COMP) {
        panel.innerHTML = '<p style="font:400 11.5px/1.55 var(--f-tc); color:var(--muted); padding:14px; background:var(--surface-2); border:1px solid var(--line-2); border-radius:9px">' + escapeHtml(L('adAiKbPickComp')) + '</p>';
        return;
      }
      if (KB_CACHE[SELECTED_COMP]) { paintCompKb(KB_CACHE[SELECTED_COMP], currentCompName()); return; }
      panel.innerHTML = '<p style="font:400 11.5px/1.55 var(--f-tc); color:var(--muted); padding:14px">' + escapeHtml(L('adAiKbLoadingComp')) + '</p>';
      var reqComp = SELECTED_COMP;
      google.script.run
        .withSuccessHandler(function (st) { KB_CACHE[reqComp] = st || {}; if (SCOPE === 'comp' && SELECTED_COMP === reqComp) paintCompKb(KB_CACHE[reqComp], currentCompName()); })
        .withFailureHandler(function () { if (SCOPE === 'comp' && SELECTED_COMP === reqComp) paintCompKb({ hasRules: true, hasDescription: true, hasOrgInfo: true, hasRegData: false }, currentCompName()); })
        .getCompKbStatus(reqComp);
    } else {
      title.textContent = L('adAiKbTitle');
      panel.innerHTML =
        '<a class="kb-item" href="/Manual.html" target="_blank" rel="noopener"><h6>' + escapeHtml(L('adAiKbManualH')) + OPEN_IC + '</h6><p>' + escapeHtml(L('adAiKbManualP')) + '</p></a>' +
        '<div class="kb-item"><h6>' + escapeHtml(L('adAiKbAllRegH')) + '</h6><p>' + escapeHtml(L('adAiKbAllRegP')) + '</p></div>' +
        hintBox(escapeHtml(L('adAiHintAdmin')));
    }
  }

  // Scope picker
  document.querySelectorAll('#scopePicker button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('#scopePicker button').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      SCOPE = b.dataset.scope;
      document.getElementById('compSelect').style.display = SCOPE === 'comp' ? '' : 'none';
      renderKbPanel();
      loadConvs();
    });
  });
  document.getElementById('compSelect').addEventListener('change', function (e) {
    SELECTED_COMP = e.target.value;
    renderKbPanel();
    loadConvs();
  });

  document.getElementById('newConvBtn').addEventListener('click', function () {
    var btn = this;
    if (btn.disabled) return;
    var orig = btn.textContent;
    btn.disabled = true; btn.textContent = L('adAiCreating');
    function done() { btn.disabled = false; btn.textContent = orig; }
    google.script.run
      .withSuccessHandler(function (res) {
        done();
        if (res && res.success) { loadConvs(); setTimeout(function () { selectConv(res.id); }, 200); }
      })
      .withFailureHandler(function () { done(); uiAlert(L('adAiCreateFail')); })
      .createConversation(SCOPE === 'comp' ? SELECTED_COMP : '', L('adAiConvDefaultTitle') + ' ' + new Date().toLocaleString());
  });

  // Send message
  var inp = document.getElementById('msgInput');
  inp.addEventListener('input', function () {
    document.getElementById('sendBtn').disabled = !inp.value.trim();
    inp.style.height = 'auto';
    inp.style.height = Math.min(160, inp.scrollHeight) + 'px';
  });
  inp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!document.getElementById('sendBtn').disabled) document.getElementById('sendBtn').click();
    }
  });
  document.getElementById('sendBtn').addEventListener('click', function () {
    // E-5: if a brand-new conversation is mid-creation, ignore re-entrant sends so a fast
    // second message can't spawn a 2nd empty conversation and lose the first message.
    if (SELECTED && SELECTED._creating) return;
    var text = inp.value.trim();
    if (!text) return;
    inp.value = ''; inp.style.height = 'auto';
    this.disabled = true;
    // OPTIMISTIC: show the user's message + typing indicator IMMEDIATELY (works for both an
    // existing conversation and a brand-new one) so the send always feels instant.
    MESSAGES.push({ role: 'user', content: text, createdAt: new Date().toISOString() });
    MESSAGES.push({ role: 'ai', content: L('adAiThinking'), createdAt: new Date().toISOString(), _typing: true });
    renderMessages();
    if (!SELECTED) {
      // New conversation — create it, then run AI (UI already shows the message + dots).
      // Claim creation synchronously so a re-entrant send is gated by the guard above.
      SELECTED = { id: null, _creating: true };
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.success) { SELECTED = { id: res.id }; loadConvs(); runAI(res.id, text); }
          else { SELECTED = null; stopTyping(L('adAiCreateFail')); }
        })
        .withFailureHandler(function () { SELECTED = null; stopTyping(L('adAiCreateFail')); })
        .createConversation(SCOPE === 'comp' ? SELECTED_COMP : '', text.slice(0, 50));
    } else {
      runAI(SELECTED.id, text);
    }
  });
  // Remove the typing indicator and optionally show an error bubble.
  function stopTyping(errMsg) {
    MESSAGES = MESSAGES.filter(function (m) { return !m._typing; });
    if (errMsg) MESSAGES.push({ role: 'ai', content: errMsg, createdAt: new Date().toISOString() });
    renderMessages();
  }
  // Persist the user message (background) + call the AI, then swap the dots for the reply.
  function runAI(convId, text) {
    google.script.run.withSuccessHandler(function () {}).withFailureHandler(function () {}).appendMessage(convId, 'user', text);
    var aiCall = SCOPE === 'comp' && SELECTED_COMP
      ? function (cb) { google.script.run.withSuccessHandler(cb).withFailureHandler(function (e) { cb({ error: e.message }); }).askAdminAI(text, SELECTED_COMP); }
      : function (cb) { google.script.run.withSuccessHandler(cb).withFailureHandler(function (e) { cb({ error: e.message }); }).askAdminAI(text, ''); };
    aiCall(function (aiRes) {
      MESSAGES = MESSAGES.filter(function (m) { return !m._typing; });
      var reply = (aiRes && (aiRes.answer || aiRes.reply)) || (aiRes && aiRes.error) || L('adAiNoReply');
      MESSAGES.push({ role: 'ai', content: reply, createdAt: new Date().toISOString() });
      renderMessages();
      google.script.run.withSuccessHandler(function () { loadConvs(); }).appendMessage(convId, 'ai', reply);
    });
  }

  // Suggestion cards → fill the input and send (auto-creates a conversation if none).
  // Delegated on #messages so it works for the static empty-state cards AND re-rendered ones.
  function submitSuggestion(text) {
    if (!text) return;
    inp.value = text;
    inp.dispatchEvent(new Event('input'));            // enable send button + autosize
    document.getElementById('sendBtn').click();        // sendBtn handler auto-creates a conv when none
  }
  document.getElementById('messages').addEventListener('click', function (e) {
    var sg = e.target.closest ? e.target.closest('.sg') : null;
    if (sg) submitSuggestion(sg.getAttribute('data-sg') || sg.textContent.trim());
  });

  renderKbPanel();
  loadConvs();

  // Re-render JS-injected content (conversation list, messages, KB panel) when the
  // language changes; static [data-i18n*] nodes are handled by the shared engine.
  if (window.AppState && typeof window.AppState.on === 'function') {
    window.AppState.on('lang-changed', function () {
      renderConvs();
      renderMessages();
      renderKbPanel();
      if (typeof window.applyI18n === 'function') window.applyI18n();
    });
  }
})();
</script>
</body>
</html>
