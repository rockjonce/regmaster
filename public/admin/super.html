<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>系統管理員 · RegMaster</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/shared/styles.css">
<link rel="stylesheet" href="/shared/admin-layout.css">
<script src="/__/firebase/10.7.1/firebase-app-compat.js"></script>
<script src="/__/firebase/10.7.1/firebase-functions-compat.js"></script>
<script src="/__/firebase/init.js"></script>
<script src="/shared/firebase-bridge.js"></script>
<style>
body { background:var(--bg); }
.head .danger-tag { padding:5px 11px; background:linear-gradient(135deg, var(--err-500), #7F1D1D); color:white; border-radius:6px; font:700 10.5px/1 var(--f-mono); letter-spacing:.08em; display:flex; gap:6px; align-items:center; }
.head .danger-tag::before { content:''; width:6px; height:6px; border-radius:50%; background:white; animation:pls 1.5s infinite; }
@keyframes pls { 50%{opacity:.3;} }

.health-strip { display:grid; grid-template-columns:repeat(5,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:11px; overflow:hidden; margin-bottom:18px; }
.health-strip > div { padding:16px 18px; background:var(--surface); }
.health-strip .lbl-h { font:500 10.5px/1 var(--f-mono); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:6px; margin-bottom:8px; }
.health-strip .lbl-h .dot-h { width:8px; height:8px; border-radius:50%; }
.health-strip .lbl-h .dot-h.ok { background:var(--ok-500); box-shadow:0 0 0 3px color-mix(in srgb, var(--ok-500) 30%, transparent); }
.health-strip .lbl-h .dot-h.warn { background:var(--amber-500); }
.health-strip .lbl-h .dot-h.danger { background:var(--err-500); animation:pls 1.5s infinite; }
.health-strip .v-h { font:700 22px/1 var(--f-display); }
.health-strip .v-h em { font-style:normal; font-size:11px; color:var(--muted); font-weight:500; margin-left:3px; }
.health-strip .sub-h { font:500 11px/1.4 var(--f-mono); color:var(--muted); margin-top:5px; }

.kpi-strip { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
.kpi { padding:18px 20px; background:var(--surface); border:1px solid var(--line); border-radius:12px; }
.kpi .l { font:500 11px/1 var(--f-mono); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
.kpi .v { font:700 28px/1 var(--f-display); letter-spacing:-.018em; }

.orgs-table { background:var(--surface); border:1px solid var(--line); border-radius:11px; overflow:hidden; }
.orgs-table table { width:100%; border-collapse:collapse; font:400 13px/1.5 var(--f-tc); }
.orgs-table th { text-align:left; padding:11px 16px; background:var(--surface-2); border-bottom:1px solid var(--line); font:600 10.5px/1 var(--f-mono); letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
.orgs-table td { padding:13px 16px; border-bottom:1px solid var(--line-2); vertical-align:middle; }
.orgs-table tr:hover td { background:var(--surface-2); }
.org-cell { display:flex; gap:10px; align-items:center; }
.org-cell .av-o { width:32px; height:32px; border-radius:7px; background:linear-gradient(135deg, var(--ink), #1a2e52); color:white; display:grid; place-items:center; font:700 12px/1 var(--f-display); flex-shrink:0; }
.org-cell .body h6 { font:600 13px/1.3 var(--f-display); }
.org-cell .body p { font:500 11px/1.4 var(--f-mono); color:var(--muted); margin:1px 0 0; }
.plan-tag { padding:3px 8px; border-radius:5px; font:600 10.5px/1.4 var(--f-mono); display:inline-block; }
.plan-tag.free { background:var(--surface-2); color:var(--muted); }
.plan-tag.trial, .plan-tag.starter { background:color-mix(in srgb, var(--acc) 14%, transparent); color:var(--acc); }
.plan-tag.pro { background:linear-gradient(135deg,#fbcd5b,var(--acc)); color:#3D2410; }
.plan-tag.team { background:linear-gradient(135deg,var(--ink),#1a2e52); color:white; }
.status-pill { padding:3px 7px; border-radius:5px; font:600 10.5px/1.4 var(--f-mono); display:inline-flex; align-items:center; gap:5px; }
.status-pill::before { content:''; width:5px; height:5px; border-radius:50%; }
.status-pill.active { background:color-mix(in srgb, var(--ok-500) 14%, transparent); color:var(--ok-700); }
.status-pill.active::before { background:var(--ok-500); }
.status-pill.locked { background:color-mix(in srgb, var(--err-500) 14%, transparent); color:var(--err-700); }
.status-pill.locked::before { background:var(--err-500); }
.status-pill.unverified { background:color-mix(in srgb, var(--amber-500) 14%, transparent); color:var(--warn-700); }

.no-access { max-width:560px; margin:80px auto; padding:48px; background:var(--surface); border:1px solid var(--line); border-radius:18px; text-align:center; }
.no-access .ic { font:800 48px/1 var(--f-display); margin-bottom:16px; }
.no-access h2 { font:700 22px/1.2 var(--f-display); margin-bottom:8px; }
.no-access p { font:400 14px/1.6 var(--f-tc); color:var(--ink-3); margin-bottom:24px; }
</style>
</head>
<body>
<div class="admin">
  <aside class="side">
    <a class="brand" href="/admin/"><div class="logo"><img src="/favicon.png" alt="RegMaster" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block"></div><div class="nm">RegMaster<small>SUPER ADMIN</small></div></a>
    <div class="org-switcher"><div class="av" id="orgAv">—</div><div class="body"><h6 id="orgName">—</h6><p style="color:var(--err-500); font-weight:600">SYSTEM 角色</p></div></div>
    <div class="nav-grp">
      <div class="l-grp">系統</div>
      <a class="nav-it" href="/admin/"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/></svg>儀表板</a>
      <a class="nav-it" href="/admin/events/"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3M3 11h18"/></svg>所有活動</a>
      <a class="nav-it on"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M12 2l4 4-4 4M16 6H4M12 22l4-4-4-4M16 18H4"/></svg>Super Admin</a>
      <a class="nav-it" href="/admin/audit.html"><svg fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M21 12c0 5-4 9-9 9s-9-4-9-9 4-9 9-9 9 4 9 9z"/></svg>操作日誌</a>
    </div>
  </aside>
  <main>
    <header class="head">
      <div class="crumbs"><a href="/admin/">主辦後台</a><span class="sep">/</span><b>Super Admin</b></div>
      <div class="actions"><span class="danger-tag">⚠ 平台級權限</span><div class="me-h"><div class="av-c" id="meAv">—</div><span id="meName">—</span></div></div>
    </header>

    <div id="noAccess" class="no-access" style="display:none">
      <div class="ic">🛡</div>
      <h2>需要 SYSTEM 權限</h2>
      <p>Super Admin 面板僅供平台管理員使用。<br>您目前的角色：<b id="curRole">—</b></p>
      <a href="/admin/" class="btn btn-primary">回到主辦後台</a>
    </div>

    <div class="main-c" id="content" style="display:none">
      <div style="margin-bottom:18px">
        <h1 style="font:700 24px/1.2 var(--f-display); margin-bottom:4px">平台總覽</h1>
        <p style="font:400 13.5px/1.5 var(--f-tc); color:var(--ink-3)">系統健康、所有組織、平台警示</p>
      </div>

      <h3 style="font:600 13px/1.2 var(--f-display); margin-bottom:12px; color:var(--ink-3)">服務狀態</h3>
      <div class="health-strip" id="healthStrip"><div style="grid-column:1/-1; text-align:center; color:var(--muted); padding:20px">載入中⋯</div></div>

      <h3 style="font:600 13px/1.2 var(--f-display); margin:24px 0 12px; color:var(--ink-3)">關鍵指標</h3>
      <div class="kpi-strip" id="kpiStrip">
        <div class="kpi"><div class="l">活動總數</div><div class="v" id="kComps">—</div></div>
        <div class="kpi"><div class="l">隊伍總數</div><div class="v" id="kTeams">—</div></div>
        <div class="kpi"><div class="l">帳號總數</div><div class="v" id="kAccts">—</div></div>
        <div class="kpi"><div class="l">有效授權</div><div class="v" id="kLics">—</div></div>
      </div>

      <h3 style="font:600 13px/1.2 var(--f-display); margin:24px 0 12px; color:var(--ink-3)">所有組織</h3>
      <div class="orgs-table">
        <table>
          <thead><tr><th>組織</th><th>角色</th><th>方案</th><th>活動 / 報名</th><th>狀態</th><th>建立日期</th></tr></thead>
          <tbody id="orgsBody"><tr><td colspan="6" style="text-align:center; padding:40px; color:var(--muted)">載入中⋯</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="/shared/app-state.js"></script>
<script src="/shared/admin-nav.js"></script>
<script>
(function(){
  AppState.init();
  var me = AppState.getMe();
  if (!me || !me.sessionToken) { location.href = '/login.html?next=' + encodeURIComponent(location.pathname); return; }
  if (me.role !== 'system') {
    document.getElementById('noAccess').style.display = 'block';
    document.getElementById('curRole').textContent = me.role || '(unknown)';
    return;
  }
  function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]; }); }
  document.getElementById('orgAv').textContent = (me.displayName || me.username).charAt(0).toUpperCase();
  document.getElementById('orgName').textContent = me.displayName || me.username;
  document.getElementById('meAv').textContent = (me.displayName || me.username).charAt(0).toUpperCase();
  document.getElementById('meName').textContent = me.displayName || me.username;
  document.getElementById('content').style.display = 'block';

  function load() {
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res) return;
        var health = res.health || {};
        document.getElementById('healthStrip').innerHTML = Object.keys(health).map(function (k) {
          var h = health[k];
          return '<div>' +
            '<div class="lbl-h"><span class="dot-h ' + escapeHtml(h.status || 'ok') + '"></span>' + escapeHtml(h.label || k) + '</div>' +
            '<div class="v-h">' + (h.latencyMs ? h.latencyMs + '<em>ms</em>' : (h.queueDepth !== undefined ? h.queueDepth + '<em>queued</em>' : '正常')) + '</div>' +
            '<div class="sub-h">' + escapeHtml(h.status === 'ok' ? '運作正常' : h.status === 'warn' ? '需注意' : '異常') + '</div>' +
          '</div>';
        }).join('');
        var m = res.metrics || {};
        document.getElementById('kComps').textContent = (m.totalCompetitions || 0).toLocaleString();
        document.getElementById('kTeams').textContent = (m.totalTeams || 0).toLocaleString();
        document.getElementById('kAccts').textContent = (m.totalAccounts || 0).toLocaleString();
        document.getElementById('kLics').textContent = (m.activeLicenses || 0).toLocaleString();
      })
      .getPlatformHealth();

    google.script.run
      .withSuccessHandler(function (res) {
        var orgs = (res && res.orgs) || [];
        if (orgs.length === 0) {
          document.getElementById('orgsBody').innerHTML = '<tr><td colspan="6" style="text-align:center; padding:40px; color:var(--muted)">尚無組織</td></tr>';
          return;
        }
        document.getElementById('orgsBody').innerHTML = orgs.map(function (o) {
          var stat = o.locked ? 'locked' : o.emailVerified ? 'active' : 'unverified';
          var statLabel = o.locked ? '已鎖定' : o.emailVerified ? '正常' : '未驗證';
          return '<tr>' +
            '<td><div class="org-cell"><div class="av-o">' + escapeHtml((o.displayName || o.username).charAt(0).toUpperCase()) + '</div><div class="body"><h6>' + escapeHtml(o.displayName || o.username) + '</h6><p>' + escapeHtml(o.email || '') + '</p></div></div></td>' +
            '<td>' + escapeHtml(o.role) + '</td>' +
            '<td><span class="plan-tag ' + escapeHtml(o.intendedPlan || 'free') + '">' + escapeHtml((o.intendedPlan || 'FREE').toUpperCase()) + '</span></td>' +
            '<td>' + o.compCount + ' / ' + o.totalTeams + '</td>' +
            '<td><span class="status-pill ' + stat + '">' + statLabel + '</span></td>' +
            '<td style="font:500 11px/1.4 var(--f-mono); color:var(--muted)">' + escapeHtml(o.createdAt || '') + '</td>' +
          '</tr>';
        }).join('');
      })
      .listAllOrgs();
  }
  load();
})();
</script>
</body>
</html>
