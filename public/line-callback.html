<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LINE 登入處理中 · RegMaster</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/shared/styles.css">
<script src="/__/firebase/10.7.1/firebase-app-compat.js"></script>
<script src="/__/firebase/10.7.1/firebase-functions-compat.js"></script>
<script src="/__/firebase/init.js"></script>
<script src="/shared/firebase-bridge.js"></script>
<style>
body { min-height:100vh; display:grid; place-items:center; background:var(--bg); }
.box { text-align:center; max-width:380px; padding:32px; }
.spin { width:44px; height:44px; border:3px solid var(--line); border-top-color:#06C755; border-radius:50%; margin:0 auto 20px; animation:sp 0.9s linear infinite; }
@keyframes sp { to { transform:rotate(360deg); } }
h1 { font:700 19px/1.3 var(--f-display); margin-bottom:8px; }
p { font:400 14px/1.6 var(--f-tc); color:var(--ink-3); }
.err-ic { width:44px; height:44px; margin:0 auto 16px; border-radius:50%; background:rgba(239,68,68,.1); color:var(--err-700); display:grid; place-items:center; font:700 24px/1 var(--f-display); }
a.btn-back { display:inline-block; margin-top:18px; padding:10px 18px; background:var(--ink); color:#fff; border-radius:9px; text-decoration:none; font:600 13px/1 var(--f-tc); }
</style>
</head>
<body>
<div class="box" id="box">
  <div class="spin"></div>
  <h1>LINE 登入處理中⋯</h1>
  <p>正在驗證您的 LINE 帳號，請稍候。</p>
</div>
<script src="/shared/app-state.js"></script>
<script>
(function () {
  AppState.init();   // sets window.ME so authCallable (link flow) gets _auth
  var LINE_REDIRECT = location.origin + '/line-callback.html';
  var box = document.getElementById('box');
  function fail(msg, backHref, backText) {
    box.innerHTML = '<div class="err-ic">!</div><h1>登入失敗</h1><p>' +
      String(msg || '').replace(/[&<>]/g, function (c) { return ({ '&':'&amp;','<':'&lt;','>':'&gt;' })[c]; }) +
      '</p><a class="btn-back" href="' + (backHref || '/login.html') + '">' + (backText || '返回登入') + '</a>';
  }

  var qs = new URLSearchParams(location.search);
  var code = qs.get('code');
  var state = qs.get('state');
  var oauthErr = qs.get('error');
  if (oauthErr) { fail(qs.get('error_description') || ('LINE 授權被取消（' + oauthErr + '）')); return; }
  if (!code) { fail('缺少授權碼，請重新登入。'); return; }

  // CSRF: state must match what we stored before redirecting out.
  var savedState = '', mode = 'login', next = '/admin/';
  try {
    savedState = sessionStorage.getItem('line_oauth_state') || '';
    mode = sessionStorage.getItem('line_oauth_mode') || 'login';
    next = sessionStorage.getItem('line_oauth_next') || '/admin/';
    if (!/^\/(?!\/)/.test(next) || /[\r\n\t]/.test(next)) next = '/admin/';  // P0-3: same-origin only
    sessionStorage.removeItem('line_oauth_state');
    sessionStorage.removeItem('line_oauth_mode');
    sessionStorage.removeItem('line_oauth_next');
  } catch (e) {}
  if (!savedState || savedState !== state) { fail('登入狀態驗證失敗（可能逾時或重複開啟），請重新登入。'); return; }

  if (mode === 'bindReg') {
    // 報名者綁定 LINE 到某筆報名（憑報名編號+密碼）
    var bc = '', bt = '', bp = '';
    try { bc = sessionStorage.getItem('rm_bind_comp') || ''; bt = sessionStorage.getItem('rm_bind_team') || ''; bp = sessionStorage.getItem('rm_bind_pwd') || ''; sessionStorage.removeItem('rm_bind_comp'); sessionStorage.removeItem('rm_bind_team'); sessionStorage.removeItem('rm_bind_pwd'); } catch (e) {}
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.success) location.href = '/events/detail.html?id=' + encodeURIComponent(bc) + '&bound=line';
        else fail((res && res.message) || 'LINE 綁定失敗', '/events/detail.html?id=' + encodeURIComponent(bc), '返回活動');
      })
      .withFailureHandler(function (e) { fail((e && e.message) || 'LINE 綁定失敗', '/events/detail.html?id=' + encodeURIComponent(bc), '返回活動'); })
      .bindRegistrantSocial(bc, bt, bp, 'line', code);
    return;
  }

  if (mode === 'lookupReg') {
    // 報名者用 LINE 查詢所有報名 → 結果暫存 sessionStorage，回 my.html 呈現
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.success) {
          try {
            sessionStorage.setItem('rm_social_regs', JSON.stringify(res.registrations || []));
            // LINE-verified email — needed by /my.html to enable the check-in QR button
            if (res.email) sessionStorage.setItem('rm_social_email', String(res.email).toLowerCase());
            sessionStorage.setItem('rm_social_provider', 'line');
            if (res.invoiceToken) sessionStorage.setItem('rm_social_invtok', res.invoiceToken);   // Phase 3：發票查詢權杖
          } catch (e) {}
          location.href = '/my.html?social=line';
        }
        else fail((res && res.message) || 'LINE 查詢失敗', '/my.html', '返回我的報名');
      })
      .withFailureHandler(function (e) { fail((e && e.message) || 'LINE 查詢失敗', '/my.html', '返回我的報名'); })
      .listMyRegistrationsBySocial('line', code);
    return;
  }

  if (mode === 'link') {
    // Bind LINE to the currently logged-in account, then back to settings.
    var me = AppState.getMe();
    if (!me || !me.sessionToken) { fail('登入已逾期，請先登入後再綁定。', '/login.html', '前往登入'); return; }
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.success) { location.href = '/admin/settings.html?linked=line'; }
        else fail((res && res.message) || 'LINE 綁定失敗', '/admin/settings.html', '返回設定');
      })
      .withFailureHandler(function (e) { fail((e && e.message) || 'LINE 綁定失敗', '/admin/settings.html', '返回設定'); })
      .linkLineAccount(code, LINE_REDIRECT);
    return;
  }

  // Login / sign-up flow
  google.script.run
    .withSuccessHandler(function (res) {
      if (res && res.success) {
        AppState.setMe({ username: res.username, role: res.role, displayName: res.displayName, sessionToken: res.sessionToken });
        location.href = next || '/admin/';
      } else {
        fail((res && res.message) || 'LINE 登入失敗');
      }
    })
    .withFailureHandler(function (e) { fail((e && e.message) || 'LINE 登入失敗，請稍後再試'); })
    .lineLoginCallback(code, LINE_REDIRECT);
})();
</script>
</body>
</html>
