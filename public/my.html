<style>
.nav { position:sticky; top:0; z-index:50; height:60px; display:flex; align-items:center; padding:0 32px; border-bottom:1px solid var(--hairline); background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:saturate(1.4) blur(12px); }
.nav .brand { display:flex; align-items:center; gap:10px; font:700 16px/1 var(--f-display); text-decoration:none; color:inherit; }
.nav .brand .logo { width:28px; height:28px; border-radius:7px; background:var(--ink); color:var(--surface); display:grid; place-items:center; font:800 13px/1 var(--f-display); }
.nav .links { display:flex; gap:4px; margin-left:48px; flex:1; }
.nav .links a { padding:8px 14px; font:500 13.5px/1 var(--f-tc); color:var(--ink-3); border-radius:6px; text-decoration:none; }
.nav .links a.on { color:var(--ink); background:var(--surface-2); }
.nav .actions { display:flex; gap:10px; align-items:center; }
.theme-toggle { padding:6px 10px; border-radius:8px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-2); font:500 12px/1 var(--f-tc); cursor:pointer; }

.hero { padding:48px 32px 32px; background:linear-gradient(180deg, var(--bg) 0%, var(--surface-2) 100%); border-bottom:1px solid var(--line); position:relative; overflow:hidden; }
.hero::before { content:''; position:absolute; inset:0; background-image:linear-gradient(var(--hairline) 1px,transparent 1px),linear-gradient(90deg,var(--hairline) 1px,transparent 1px); background-size:60px 60px; mask:radial-gradient(ellipse 50% 50% at 90% 50%, black, transparent 70%); -webkit-mask:radial-gradient(ellipse 50% 50% at 90% 50%, black, transparent 70%); }
.hero-inner { max-width:1280px; margin:0 auto; position:relative; }
.hero-eyebrow { font:500 11px/1 var(--f-mono); letter-spacing:.16em; text-transform:uppercase; color:var(--acc); margin-bottom:14px; }
.hero h1 { font:800 40px/1.06 var(--f-display); letter-spacing:-.022em; margin-bottom:8px; }
.hero h1 em { font-style:normal; background:linear-gradient(120deg,var(--acc),var(--amber-500)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.hero p.lead { font:400 15px/1.55 var(--f-tc); color:var(--ink-3); max-width:560px; margin-bottom:24px; }

.lookup-card { max-width:560px; padding:24px; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--sh); }
.lookup-card h3 { font:600 14px/1.3 var(--f-display); margin-bottom:14px; }
.lookup-card .field-stack > * { margin-bottom:12px; }
.lookup-card .tabs { display:inline-flex; padding:3px; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; margin-bottom:14px; }
.lookup-card .tabs button { padding:7px 14px; border-radius:6px; font:500 12.5px/1 var(--f-tc); color:var(--muted); cursor:pointer; }
.lookup-card .tabs button.on { background:var(--ink); color:var(--surface); font-weight:600; }
.lookup-card .input { width:100%; padding:10px 14px; background:var(--surface); border:1px solid var(--line); border-radius:9px; font:400 14px/1.5 var(--f-tc); color:var(--ink); }
.lookup-card .input:focus { outline:0; border-color:var(--acc); box-shadow:0 0 0 3px rgba(61,107,255,.16); }

.kpi-row { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:14px; overflow:hidden; max-width:1280px; margin:32px auto 0; }
.kpi-row > div { background:var(--surface); padding:18px 20px; }
.kpi-row .lbl { font:500 11px/1 var(--f-mono); color:var(--muted); letter-spacing:.06em; text-transform:uppercase; margin-bottom:8px; }
.kpi-row .v { font:700 24px/1 var(--f-display); letter-spacing:-.018em; }
.kpi-row .v em { font-style:normal; font-size:13px; color:var(--muted); margin-left:5px; font-weight:500; }

.shell { max-width:1280px; margin:0 auto; padding:32px; }
.tab-row { display:flex; align-items:center; padding-bottom:18px; border-bottom:1px solid var(--line); margin-bottom:24px; gap:24px; flex-wrap:wrap; }
.tab-pills { display:flex; gap:4px; padding:3px; background:var(--surface); border:1px solid var(--line); border-radius:10px; }
.tab-pills button { padding:8px 14px; border-radius:7px; font:500 13px/1 var(--f-tc); color:var(--muted); cursor:pointer; display:flex; gap:8px; align-items:center; }
.tab-pills button .badge-c { padding:2px 6px; background:var(--surface-2); border-radius:4px; font:600 10px/1.4 var(--f-mono); color:var(--ink-2); }
.tab-pills button.on { background:var(--ink); color:var(--surface); font-weight:600; }
.tab-pills button.on .badge-c { background:rgba(255,255,255,.14); color:white; }

.reg-list { display:flex; flex-direction:column; gap:14px; }
.reg-card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px 24px; display:grid; grid-template-columns:90px 1fr auto; gap:20px; align-items:center; transition:.15s; }
.reg-card:hover { border-color:var(--ink-3); box-shadow:var(--sh-sm); }
.reg-card .date-block { text-align:center; padding:10px 0; background:var(--surface-2); border:1px solid var(--line-2); border-radius:10px; }
.reg-card .date-block .m { font:600 10px/1 var(--f-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); margin-bottom:6px; }
.reg-card .date-block .d { font:800 28px/1 var(--f-display); letter-spacing:-.02em; }
.reg-card .date-block .wd { font:500 10px/1 var(--f-mono); color:var(--muted); margin-top:4px; }
.reg-card .body h4 { font:700 16px/1.3 var(--f-display); margin-bottom:4px; }
.reg-card .body .meta { display:flex; gap:14px; flex-wrap:wrap; font:400 12.5px/1.4 var(--f-tc); color:var(--ink-3); margin-top:6px; }
.reg-card .body .meta .pill { padding:2px 7px; background:var(--surface-2); border:1px solid var(--line-2); border-radius:4px; font:500 11px/1.4 var(--f-mono); color:var(--ink-2); }
.reg-card .body .meta .pill.ok { background:rgba(16,185,129,.1); color:var(--ok-700); border-color:rgba(16,185,129,.2); }
.reg-card .body .meta .pill.warn { background:rgba(245,158,11,.1); color:var(--warn-700); border-color:rgba(245,158,11,.2); }
.reg-card .body .meta .pill.err { background:rgba(239,68,68,.08); color:var(--err-700); border-color:rgba(239,68,68,.2); }
.reg-card .actions { display:flex; gap:8px; flex-direction:column; align-items:flex-end; }
.reg-card .actions .btn { padding:8px 14px; font:500 12.5px/1 var(--f-tc); border-radius:7px; }
.reg-card .actions .btn-primary { background:var(--ink); color:var(--surface); }
.reg-card .actions .teamid { font:500 11px/1 var(--f-mono); color:var(--muted); }

.empty-state { padding:80px 32px; text-align:center; background:var(--surface); border:1px dashed var(--line); border-radius:18px; }
.empty-state .ic { width:64px; height:64px; margin:0 auto 18px; border-radius:50%; background:var(--surface-2); display:grid; place-items:center; font:600 28px/1 var(--f-display); color:var(--muted); }
.empty-state h3 { font:700 22px/1.3 var(--f-display); margin-bottom:8px; }
.empty-state p { font:400 14px/1.6 var(--f-tc); color:var(--ink-3); margin-bottom:18px; }

.alert-box { padding:12px 14px; border-radius:10px; font:400 13px/1.5 var(--f-tc); margin-bottom:14px; }
.alert-box.err { background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.2); color:var(--err-700); }

.skeleton { text-align:center; padding:60px 32px; color:var(--muted); font:500 14px/1.5 var(--f-mono); }
.skeleton::before { content:''; display:inline-block; width:18px; height:18px; border:2px solid var(--line); border-top-color:var(--acc); border-radius:50%; vertical-align:-4px; margin-right:10px; animation:sp 1s linear infinite; }
@keyframes sp { to { transform:rotate(360deg); } }

@media (max-width:760px) {
  .nav .links { display:none; }
  .reg-card { grid-template-columns:60px 1fr; }
  .reg-card .actions { grid-column:1 / -1; flex-direction:row; justify-content:flex-end; }
  .kpi-row { grid-template-columns:1fr 1fr; }
}

<section class="hero">

        <button class="on" data-mode="email" data-i18n="myTabEmail">📧 用 Email</button>

  <div><div class="lbl" data-i18n="myKpiTotal">總報名數</div><div class="v" id="kTotal">—</div></div>
  <div><div class="lbl" data-i18n="myKpiUpcoming">即將舉辦</div><div class="v" id="kUpcoming">—</div></div>
  <div><div class="lbl" data-i18n="myKpiUnpaid">待付款</div><div class="v" id="kUnpaid">—</div></div>
  <div><div class="lbl" data-i18n="myKpiPaid">已完成</div><div class="v" id="kPaid">—</div></div>
</div>

<div class="shell" id="resultsArea" style="display:none">
  <div class="tab-row">
    <div class="tab-pills" id="filterTabs">
      <button class="on" data-f="all"><span data-i18n="myFilterAll">全部</span> <span class="badge-c" id="cAll">0</span></button>
      <button data-f="upcoming"><span data-i18n="myFilterUpcoming">即將舉辦</span> <span class="badge-c" id="cUp">0</span></button>

    </div>
    <div style="flex:1"></div>
    <button class="btn btn-ghost btn-sm" id="changeEmail" data-i18n="myChangeEmail">↩ 改用其他 Email</button>

  <div class="reg-list" id="regList"></div>
</div>

<script src="/shared/app-state.js"></script>
<script src="/shared/i18n.js"></script>
<script src="/shared/i18n-my.js"></script>
<script>
(function () {
  AppState.init();
  document.getElementById('themeToggle').addEventListener('click', function () { AppState.setTheme(AppState.getTheme() === 'dark' ? 'light' : 'dark'); });

  function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]; }); }
  function parseDate(s) {
    if (!s) return null;
    var d = new Date(s);
    if (!isNaN(d.getTime())) return d;
    var m = String(s).match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
    if (m) return new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
    return null;
  }

  var ALL = [];
  var STATE_FILTER = 'all';
  var lookupMode = 'email';
  var PWD_BY_TEAM = {};   // 社群登入查得的報名 → 其團隊密碼（憑此免再輸密碼即可改/退）

  document.querySelectorAll('#lookupTabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('#lookupTabs button').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      lookupMode = b.dataset.mode;
      var input = document.getElementById('lookupValue');
      input.placeholder = lookupMode === 'email' ? window.L('myInputEmailPh') : window.L('myInputPhonePh');
      input.type = lookupMode === 'email' ? 'email' : 'tel';
      input.autocomplete = lookupMode === 'email' ? 'email' : 'tel';
    });
  });

  document.getElementById('lookupValue').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('lookupBtn').click();
  });

  document.getElementById('lookupBtn').addEventListener('click', function () {
    var box = document.getElementById('lookupErr');
    box.style.display = 'none';
    var v = document.getElementById('lookupValue').value.trim();
    if (!v) { box.textContent = lookupMode === 'email' ? window.L('myErrNeedEmail') : window.L('myErrNeedPhone'); box.style.display = 'block'; return; }
    if (lookupMode === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { box.textContent = window.L('myErrBadEmail'); box.style.display = 'block'; return; }

    var btn = this;
    btn.disabled = true; var oldText = btn.textContent;
    btn.textContent = window.L('myLookingUp');

    var payload = lookupMode === 'email' ? { email: v, phone: '' } : { email: '', phone: v };
    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false; btn.textContent = oldText;
        if (res && res.success) {
          PWD_BY_TEAM = {};   // Email/電話查詢屬弱驗證 → 唯讀（只有活動詳情可點）
          ALL = res.registrations || [];
          render();
        } else {
          box.textContent = (res && res.message) || window.L('myErrLookupFail');
          box.style.display = 'block';
        }
      })
      .withFailureHandler(function (err) {
        btn.disabled = false; btn.textContent = oldText;
        box.textContent = (err && err.message) || window.L('myErrNetwork');
        box.style.display = 'block';
      })
      .listMyRegistrationsByEmail(payload.email, payload.phone);
  });

  document.getElementById('changeEmail').addEventListener('click', function () {
    document.getElementById('kpiRow').style.display = 'none';
    document.getElementById('resultsArea').style.display = 'none';
    document.getElementById('lookupValue').value = '';
    document.getElementById('lookupValue').focus();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  function classifyReg(r) {
    var now = Date.now();
    var dl = parseDate(r.deadline);
    var d = parseDate(r.competitionDate);
    var paid = String(r.paymentStatus || '').indexOf('已確認') !== -1 || String(r.paymentStatus || '').indexOf('paid') !== -1;
    if (d && d.getTime() < now - 86400000) return 'past';
    if (!paid && r.requiresPayment) return 'unpaid';
    if (paid) return 'paid';
    return 'upcoming';
  }

  function statusPill(r, cls) {
    if (cls === 'past') return '<span class="pill">' + window.L('myPillPast') + '</span>';
    if (cls === 'paid') return '<span class="pill ok">' + window.L('myPillPaid') + '</span>';
    if (cls === 'unpaid') return '<span class="pill warn">' + window.L('myPillUnpaid') + '</span>';
    return '<span class="pill ok">' + window.L('myPillUpcoming') + '</span>';
  }

  function render() {
    document.getElementById('kpiRow').style.display = 'grid';
    document.getElementById('resultsArea').style.display = 'block';
    var counts = { all: ALL.length, upcoming: 0, unpaid: 0, paid: 0, past: 0 };
    ALL.forEach(function (r) { var c = classifyReg(r); counts[c]++; });
    document.getElementById('kTotal').innerHTML = counts.all + ' <em>' + window.L('myUnitRecords') + '</em>';
    document.getElementById('kUpcoming').innerHTML = counts.upcoming + ' <em>' + window.L('myUnitEvents') + '</em>';
    document.getElementById('kUnpaid').innerHTML = counts.unpaid + ' <em>' + window.L('myUnitRecords') + '</em>';
    document.getElementById('kPaid').innerHTML = counts.paid + ' <em>' + window.L('myUnitRecords') + '</em>';
    document.getElementById('cAll').textContent = counts.all;
    document.getElementById('cUp').textContent = counts.upcoming;
    document.getElementById('cUnp').textContent = counts.unpaid;
    document.getElementById('cPd').textContent = counts.paid;
    document.getElementById('cPast').textContent = counts.past;
    document.querySelectorAll('#filterTabs button').forEach(function (b) {
      b.addEventListener('click', function () {
        document.querySelectorAll('#filterTabs button').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        STATE_FILTER = b.dataset.f;
        renderList();
      });
    });
    renderList();
  }

  function renderList() {
    var list = document.getElementById('regList');
    var months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    var monthsEN = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    var weekdays = window.L('myWeekdays').split(',');
    var filtered = ALL.filter(function (r) {
      if (STATE_FILTER === 'all') return true;
      return classifyReg(r) === STATE_FILTER;
    });
    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty-state"><div class="ic">📭</div><h3>' + window.L('myEmptyTitle') + '</h3><p>' + window.L('myEmptyDesc') + '</p></div>';
      window.applyI18n(list);
      return;
    }
    list.innerHTML = filtered.map(function (r) {
      var cls = classifyReg(r);
      var d = parseDate(r.competitionDate) || parseDate(r.deadline);
      var date = d
        ? '<div class="date-block"><div class="m">' + monthsEN[d.getMonth()] + '</div><div class="d">' + String(d.getDate()).padStart(2,'0') + '</div><div class="wd">' + weekdays[d.getDay()] + '</div></div>'
        : '<div class="date-block"><div class="m">DATE</div><div class="d">—</div><div class="wd">' + window.L('myDateTBA') + '</div></div>';
      var meta = '';
      if (r.group) meta += '<span class="pill">' + window.L('myMetaGroupPrefix') + escapeHtml(r.group) + '</span>';
      if (r.teamNameCN) meta += '<span class="pill">' + escapeHtml(r.teamNameCN) + '</span>';
      if (r.category) meta += '<span class="pill">' + escapeHtml(r.category) + '</span>';
      meta += statusPill(r, cls);

      // 完整權限僅限「社群登入（已驗證 Email）」查得的報名；Email/電話查詢為唯讀。
      var full = !!PWD_BY_TEAM[r.teamId];
      var dis = ' disabled title="' + escapeHtml(window.L('myLockedTitle')) + '" style="opacity:.45;cursor:not-allowed"';
      var actions = '<a class="btn btn-ghost" href="/events/detail.html?id=' + encodeURIComponent(r.compId) + '">' + window.L('myActDetail') + '</a>';
      if (cls === 'unpaid') {
        actions += full
          ? '<a class="btn btn-primary" href="/events/payment.html?id=' + encodeURIComponent(r.compId) + '&team=' + encodeURIComponent(r.teamId) + '">' + window.L('myActPay') + '</a>'

        actions += full
          ? '<button class="btn btn-ghost" data-edit="' + encodeURIComponent(r.compId) + '|' + encodeURIComponent(r.teamId) + '">' + window.L('myActEdit') + '</button>'
          : '<button class="btn btn-ghost"' + dis + '>' + window.L('myActEdit') + '</button>';
        actions += full
          ? '<button class="btn btn-ghost" data-refund="' + encodeURIComponent(r.compId) + '|' + encodeURIComponent(r.teamId) + '|' + escapeHtml(r.competitionName || '') + '">' + window.L('myActRefund') + '</button>'
          : '<button class="btn btn-ghost"' + dis + '>' + window.L('myActRefund') + '</button>';
      }
      return '<div class="reg-card" data-comp="' + escapeHtml(r.compId) + '" data-team="' + escapeHtml(r.teamId) + '">' +
        date +
        '<div class="body"><h4>' + escapeHtml(r.competitionName) + '</h4>' +
          '<div class="meta">' + meta + '</div>' +
        '</div>' +
        '<div class="actions">' + actions + '<span class="cert-slot"></span><span class="teamid">' + escapeHtml(r.teamId) + '</span></div>' +

  // ===========================================================================
  // Self-serve certificate download (client-side render → PDF)
  // ===========================================================================
  var CERT_TPL_CACHE = {};   // compId -> Promise<[templates]>
  var CERT_ASSET_CACHE = {}; // assetId -> Promise<Image|null>

  function fetchCertTemplates(compId) {
    if (CERT_TPL_CACHE[compId]) return CERT_TPL_CACHE[compId];
    CERT_TPL_CACHE[compId] = new Promise(function (res) {
      try {
        google.script.run
          .withSuccessHandler(function (r) { res((r && r.templates) || []); })
          .withFailureHandler(function () { res([]); })
          .getPublicCertTemplates(compId);
      } catch (e) { res([]); }
    });
    return CERT_TPL_CACHE[compId];
  }

  // Best-effort check-in detection from whatever the registration object carries.
  function regCheckedIn(r) {
    return !!(r && (r.checkedIn || r.checkin || r.checkedInAt || r.checkInTime));
  }
  // Whether we even know the check-in status (so we can choose to "allow if unknown").
  function regCheckinKnown(r) {
    return !!(r && ('checkedIn' in r || 'checkin' in r || 'checkedInAt' in r || 'checkInTime' in r));
  }

  function maybeAddCertButton(r) {
    if (!r || !r.compId) return;
    var card = document.querySelector('.reg-card[data-comp="' + (window.CSS && CSS.escape ? CSS.escape(r.compId) : r.compId) + '"][data-team="' + (window.CSS && CSS.escape ? CSS.escape(r.teamId) : r.teamId) + '"]');
    if (!card) return;
    var slot = card.querySelector('.cert-slot');
    if (!slot || slot.dataset.done) return;
    fetchCertTemplates(r.compId).then(function (tpls) {
      if (!slot || !tpls || !tpls.length) return;
      slot.dataset.done = '1';
      var btn = document.createElement('button');
      btn.className = 'btn btn-ghost';
      btn.textContent = window.L('myCertDownload');
      // Gate by check-in only when a chosen template requires it AND we can tell the user is not checked in.
      var anyReq = tpls.some(function (t) { return t.requireCheckin; });
      if (anyReq && regCheckinKnown(r) && !regCheckedIn(r)) {
        btn.disabled = true;
        btn.title = window.L('myCertNeedCheckin');
        btn.style.opacity = '.45';
        btn.style.cursor = 'not-allowed';
      } else {
        btn.addEventListener('click', function () { onCertClick(btn, r, tpls); });
      }
      slot.appendChild(btn);
    });
  }

  function onCertClick(btn, r, tpls) {
    // pick template: if multiple, let the user choose; else use the only one
    pickTemplate(tpls).then(function (tpl) {
      if (!tpl) return;
      if (!window.jspdf || !window.jspdf.jsPDF) { alert(window.L('myCertLibFail')); return; }
      var old = btn.textContent;
      btn.disabled = true; btn.textContent = window.L('myCertGenerating');
      generateCert(tpl, r).then(function () {
        btn.disabled = false; btn.textContent = old;
      }).catch(function () {
        btn.disabled = false; btn.textContent = old;
        alert(window.L('myCertFail'));
      });
    });
  }

  // Simple chooser overlay when more than one self-serve template exists.
  function pickTemplate(tpls) {
    if (tpls.length === 1) return Promise.resolve(tpls[0]);
    return new Promise(function (res) {
      var ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.5);display:grid;place-items:center;padding:16px';
      var box = '<div style="background:var(--surface);border-radius:14px;max-width:380px;width:100%;padding:22px">' +
        '<h3 style="font:700 16px/1.3 var(--f-display);margin-bottom:14px">' + escapeHtml(window.L('myCertPickTitle')) + '</h3>' +
        '<div style="display:flex;flex-direction:column;gap:8px">';
      tpls.forEach(function (t, i) {
        box += '<button class="btn btn-ghost" data-i="' + i + '" style="text-align:left">' + escapeHtml(t.name || ('#' + (i + 1))) + '</button>';
      });
      box += '</div></div>';
      ov.innerHTML = box;
      document.body.appendChild(ov);
      function close(v) { if (ov.parentNode) document.body.removeChild(ov); res(v); }
      ov.addEventListener('click', function (e) {

  // ---- fonts ----
  var CERT_FONTS_READY = false;
  function ensureCertFonts() {
    if (CERT_FONTS_READY) return Promise.resolve();
    var faces = ['700 24px "Noto Sans TC"', '700 24px "Noto Serif TC"', '700 24px "Playfair Display"', '700 24px "Montserrat"', '700 24px "Dancing Script"', '700 24px "LXGW WenKai TC"', '700 24px "Cinzel"', '700 24px "Cormorant Garamond"', '400 24px "Great Vibes"'];
    var loads = [];
    faces.forEach(function (f) {
      try { loads.push(document.fonts.load(f)); loads.push(document.fonts.load(f.replace('700', '400'))); } catch (e) {}
    });
    return Promise.all(loads).then(function () { return document.fonts.ready; })
      .then(function () { CERT_FONTS_READY = true; }).catch(function () { CERT_FONTS_READY = true; });
  }

  // ---- canvas geometry (mirror of certificates.html) ----
  function certDims(tpl) {
    if (tpl.type === 'badge') {
      return tpl.orientation === 'portrait' ? { w: 600, h: 900 } : { w: 900, h: 560 };
    }
    return tpl.orientation === 'portrait' ? { w: 700, h: 990 } : { w: 990, h: 700 };
  }

  // ---- preset background painter (mirror of certificates.html) ----
  function paintPresetBg(ctx, preset, W, H, baseColor) {
    ctx.save();
    if (preset === 'classic') {
      ctx.fillStyle = baseColor || '#fffdf6'; ctx.fillRect(0, 0, W, H);
      var pad = W * 0.04;
      ctx.strokeStyle = '#b99a4a'; ctx.lineWidth = Math.max(2, W * 0.006);
      ctx.strokeRect(pad, pad, W - pad * 2, H - pad * 2);
      ctx.strokeStyle = '#d9c488'; ctx.lineWidth = Math.max(1, W * 0.0025);
      ctx.strokeRect(pad * 1.7, pad * 1.7, W - pad * 3.4, H - pad * 3.4);
    } else if (preset === 'accent') {
      ctx.fillStyle = baseColor || '#ffffff'; ctx.fillRect(0, 0, W, H);
      var g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#3D6BFF'); g.addColorStop(1, '#1F3FB8');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W * 0.06, H);
      ctx.fillStyle = '#eef2ff'; ctx.fillRect(W * 0.06, 0, W * 0.012, H);
    } else if (preset === 'minimal') {
      ctx.fillStyle = baseColor || '#ffffff'; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = '#222'; ctx.lineWidth = Math.max(1, W * 0.002);
      ctx.beginPath(); ctx.moveTo(W * 0.5 - W * 0.08, H * 0.74); ctx.lineTo(W * 0.5 + W * 0.08, H * 0.74); ctx.stroke();
    } else if (preset === 'elegant') {
      var ge = ctx.createLinearGradient(0, 0, W, H);
      ge.addColorStop(0, '#0e1430'); ge.addColorStop(1, '#1b2452');
      ctx.fillStyle = ge; ctx.fillRect(0, 0, W, H);
      var pad2 = W * 0.05;
      ctx.strokeStyle = '#c9a85f'; ctx.lineWidth = Math.max(1.5, W * 0.004);
      ctx.strokeRect(pad2, pad2, W - pad2 * 2, H - pad2 * 2);
      ctx.fillStyle = '#c9a85f';
      [[pad2, pad2], [W - pad2, pad2], [pad2, H - pad2], [W - pad2, H - pad2]].forEach(function (p) {
        ctx.beginPath(); ctx.arc(p[0], p[1], W * 0.008, 0, Math.PI * 2); ctx.fill();
      });
    } else if (preset === 'badge') {
      ctx.fillStyle = baseColor || '#ffffff'; ctx.fillRect(0, 0, W, H);
      var gb = ctx.createLinearGradient(0, 0, W, 0);
      gb.addColorStop(0, '#3D6BFF'); gb.addColorStop(1, '#7c5cff');
      ctx.fillStyle = gb; ctx.fillRect(0, 0, W, H * 0.16);
      ctx.fillStyle = gb; ctx.fillRect(0, H * 0.9, W, H * 0.1);
    } else if (preset === 'goldborder') {
      ctx.fillStyle = baseColor || '#fbf6e9'; ctx.fillRect(0, 0, W, H);
      var gp = W * 0.035;
      ctx.strokeStyle = '#c9a227'; ctx.lineWidth = Math.max(3, W * 0.009);
      ctx.strokeRect(gp, gp, W - gp * 2, H - gp * 2);
      ctx.strokeStyle = '#e3c766'; ctx.lineWidth = Math.max(1, W * 0.003);
      ctx.strokeRect(gp * 1.8, gp * 1.8, W - gp * 3.6, H - gp * 3.6);
      ctx.strokeStyle = '#c9a227'; ctx.lineWidth = Math.max(1.5, W * 0.004);
      var co = W * 0.05;
      [[gp, gp, 1, 1], [W - gp, gp, -1, 1], [gp, H - gp, 1, -1], [W - gp, H - gp, -1, -1]].forEach(function (c) {
        ctx.beginPath();
        ctx.moveTo(c[0] + c[2] * co, c[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(c[0], c[1] + c[3] * co);
        ctx.stroke();
        ctx.beginPath(); ctx.arc(c[0] + c[2] * co * 0.5, c[1] + c[3] * co * 0.5, W * 0.006, 0, Math.PI * 2); ctx.fillStyle = '#c9a227'; ctx.fill();
      });
    } else if (preset === 'thanks') {
      ctx.fillStyle = baseColor || '#fffaf0'; ctx.fillRect(0, 0, W, H);
      var tp = W * 0.05;
      ctx.strokeStyle = '#d8b48a'; ctx.lineWidth = Math.max(1.5, W * 0.0035);
      ctx.strokeRect(tp, tp, W - tp * 2, H - tp * 2);
      var tg = ctx.createLinearGradient(0, 0, 0, H * 0.4);
      tg.addColorStop(0, 'rgba(216,180,138,0.18)'); tg.addColorStop(1, 'rgba(216,180,138,0)');
      ctx.fillStyle = tg; ctx.fillRect(tp, tp, W - tp * 2, H * 0.4);
    } else if (preset === 'diploma_en') {
      ctx.fillStyle = baseColor || '#ffffff'; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = '#222'; ctx.lineWidth = Math.max(1, W * 0.0018);
      ctx.beginPath(); ctx.moveTo(W * 0.32, H * 0.42); ctx.lineTo(W * 0.68, H * 0.42); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(W * 0.28, H * 0.74); ctx.lineTo(W * 0.72, H * 0.74); ctx.stroke();
      ctx.strokeStyle = '#b8860b'; ctx.lineWidth = Math.max(1.5, W * 0.003);
      ctx.beginPath(); ctx.arc(W * 0.82, H * 0.82, W * 0.06, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(W * 0.82, H * 0.82, W * 0.045, 0, Math.PI * 2); ctx.stroke();
    } else if (preset === 'ribbon') {
      ctx.fillStyle = baseColor || '#ffffff'; ctx.fillRect(0, 0, W, H);
      var rg = ctx.createLinearGradient(0, 0, W, 0);
      rg.addColorStop(0, '#b8860b'); rg.addColorStop(1, '#e0b84a');
      ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H * 0.14);
      ctx.save();
      ctx.translate(W * 0.82, H * 0.78);
      ctx.fillStyle = '#b8860b';
      ctx.beginPath();
      for (var si = 0; si < 24; si++) {
        var a = si / 24 * Math.PI * 2, rr = (si % 2 === 0) ? W * 0.075 : W * 0.06;
        ctx[si === 0 ? 'moveTo' : 'lineTo'](Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e0b84a'; ctx.beginPath(); ctx.arc(0, 0, W * 0.045, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else if (preset === 'navy') {
      ctx.fillStyle = baseColor || '#ffffff'; ctx.fillRect(0, 0, W, H);
      var ng = ctx.createLinearGradient(0, 0, W, 0);
      ng.addColorStop(0, '#0f1b3d'); ng.addColorStop(1, '#1c2f63');
      ctx.fillStyle = ng; ctx.fillRect(0, 0, W, H * 0.18);
      ctx.fillStyle = ng; ctx.fillRect(0, H * 0.85, W, H * 0.15);
      ctx.fillStyle = '#caa84f'; ctx.fillRect(0, H * 0.18, W, H * 0.006);
      ctx.fillStyle = '#caa84f'; ctx.fillRect(0, H * 0.844, W, H * 0.006);
    } else if (preset === 'badge_portrait') {
      ctx.fillStyle = baseColor || '#ffffff'; ctx.fillRect(0, 0, W, H);
      var bg2 = ctx.createLinearGradient(0, 0, W, 0);
      bg2.addColorStop(0, '#3D6BFF'); bg2.addColorStop(1, '#7c5cff');
      ctx.fillStyle = bg2; ctx.fillRect(0, 0, W, H * 0.14);
      ctx.fillStyle = bg2; ctx.fillRect(0, H * 0.93, W, H * 0.07);
    } else {
      ctx.fillStyle = baseColor || '#ffffff'; ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
  }

  // ---- asset / url image loaders ----
  function loadCertAsset(assetId) {
    if (!assetId) return Promise.resolve(null);
    if (CERT_ASSET_CACHE[assetId]) return CERT_ASSET_CACHE[assetId];
    CERT_ASSET_CACHE[assetId] = new Promise(function (res) {
      try {
        google.script.run
          .withSuccessHandler(function (r) {
            if (!r || !r.dataUri) { res(null); return; }
            var img = new Image();
            img.onload = function () { res(img); };
            img.onerror = function () { res(null); };
            img.src = r.dataUri;
          })
          .withFailureHandler(function () { res(null); })
          .getCertAssetData(assetId);
      } catch (e) { res(null); }
    });
    return CERT_ASSET_CACHE[assetId];
  }
  function loadUrlImage(url) {
    return new Promise(function (res) {
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function () { res(img); };
      img.onerror = function () { res(null); };
      img.src = url;
    });
  }

  // ---- token resolution (TEAM granularity, using the registrant's own data) ----
  function certQrUrl(r, field) {
    // Mirror of certificates.html qrUrl(). Default 'checkin' encodes the bare teamId so the
    // existing check-in scanner reads a printed badge exactly like the email QR.
    var origin = location.origin, cid = r.compId || '', txt;
    switch ((field && field.qrMode) || 'checkin') {
      case 'event':    txt = origin + '/events/detail.html?id=' + encodeURIComponent(cid); break;
      case 'teamdata': txt = origin + '/events/detail.html?id=' + encodeURIComponent(cid) + '&team=' + encodeURIComponent(r.teamId || ''); break;
      case 'register': txt = origin + '/events/register.html?id=' + encodeURIComponent(cid) + '&edit=' + encodeURIComponent(r.teamId || ''); break;
      default:         txt = r.teamId || '';
    }
    return 'https://quickchart.io/qr?size=300&margin=1&text=' + encodeURIComponent(txt);
  }
  function resolveCertToken(tok, r) {
    switch (tok) {
      case '{{中文姓名}}': return r.teamNameCN || '';
      case '{{英文姓名}}': return r.teamNameEN || '';
      case '{{活動名稱}}': return r.competitionName || '';
      case '{{組別}}': return r.group || '';
      case '{{報名編號}}': return r.teamId || '';
      case '{{名次}}': return '';
      case '{{獎項}}': return '';
      case '{{日期}}': return new Date().toISOString().slice(0, 10);
      case '{{隊名}}': return r.teamNameCN || '';
      case '{{英文隊名}}': return r.teamNameEN || '';
      case '{{稱謂}}': return (r.role === '教練' || r.role === 'teacher') ? '指導者' : '學員';
      case '{{QR}}': return '';
      default: return '';
    }
  }
  function resolveCertText(value, r) {
    if (!value) return '';
    return String(value).replace(/\{\{[^}]+\}\}/g, function (mm) { return resolveCertToken(mm, r); });
  }
  function certWrapText(ctx, text, maxW) {
    text = String(text == null ? '' : text);
    if (!text) return [''];
    if (ctx.measureText(text).width <= maxW) return [text];
    var lines = [], cur = '', chars = text.split('');
    for (var i = 0; i < chars.length; i++) {
      var test = cur + chars[i];
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = chars[i]; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    return lines.length ? lines : [text];
  }

  function drawCertField(ctx, f, r, W, H) {
    var fx = (f.x / 100) * W, fy = (f.y / 100) * H, fw = ((f.w || 80) / 100) * W;
    if (f.kind === 'text') {
      var size = Math.max(6, (f.fontSizePct / 100) * H);
      var weight = f.weight === 'bold' ? '700' : '400';
      ctx.font = weight + ' ' + size + 'px ' + (f.fontFamily || "'Noto Sans TC', sans-serif");
      ctx.fillStyle = f.color || '#000';
      ctx.textBaseline = 'top';
      ctx.textAlign = f.align || 'center';
      var tx = f.align === 'center' ? fx + fw / 2 : f.align === 'right' ? fx + fw : fx;
      var text = f.bind === 'token' ? resolveCertText(f.value, r) : (f.value || '');
      var lines = certWrapText(ctx, text, fw);
      lines.forEach(function (ln, i) { ctx.fillText(ln, tx, fy + i * size * 1.2); });
      return Promise.resolve();
    }
    if (f.kind === 'image') {
      if (!f.assetId) return Promise.resolve();
      return loadCertAsset(f.assetId).then(function (img) {
        if (!img) return;
        var fh = f.h ? (f.h / 100) * H : fw * (img.height / img.width);
        ctx.drawImage(img, fx, fy, fw, fh);
      });
    }
    if (f.kind === 'qr') {
      return loadUrlImage(certQrUrl(r, f)).then(function (img) {
        if (img) ctx.drawImage(img, fx, fy, fw, fw);
        else { ctx.strokeStyle = '#ccc'; ctx.strokeRect(fx, fy, fw, fw); }
      });
    }
    return Promise.resolve();
  }

  function renderCertToCanvas(canvas, tpl, r, scale) {
    scale = scale || 1;
    var dims = certDims(tpl);
    var W = dims.w * scale, H = dims.h * scale;
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, W, H);
    var bgP;
    if (tpl.bgAssetId) {
      bgP = loadCertAsset(tpl.bgAssetId).then(function (img) {
        if (img) ctx.drawImage(img, 0, 0, W, H);
        else { ctx.fillStyle = tpl.bgColor || '#fff'; ctx.fillRect(0, 0, W, H); }
      });
    } else if (tpl.bgPreset) {
      paintPresetBg(ctx, tpl.bgPreset, W, H, tpl.bgColor); bgP = Promise.resolve();
    } else {
      ctx.fillStyle = tpl.bgColor || '#ffffff'; ctx.fillRect(0, 0, W, H); bgP = Promise.resolve();
    }
    return bgP.then(function () {
      var seq = Promise.resolve();
      (tpl.fields || []).forEach(function (f) { seq = seq.then(function () { return drawCertField(ctx, f, r, W, H); }); });
      return seq;
    });
  }

  function certSafeName(s) { return String(s || 'certificate').replace(/[\\/:*?"<>|]+/g, '_').slice(0, 60); }

  function generateCert(tpl, r) {
    return ensureCertFonts().then(function () {
      var dims = certDims(tpl);
      var scale = 2.5;
      var canvas = document.createElement('canvas');
      return renderCertToCanvas(canvas, tpl, r, scale).then(function () {
        var imgData = canvas.toDataURL('image/jpeg', 0.92);
        var orient = tpl.orientation === 'portrait' ? 'p' : 'l';
        var pdf = new window.jspdf.jsPDF({ orientation: orient, unit: 'px', format: [dims.w, dims.h] });
        pdf.addImage(imgData, 'JPEG', 0, 0, dims.w, dims.h);
        pdf.save(certSafeName(r.competitionName) + '_certificate.pdf');
      });
    });
  }

  // ===== 申請退費 (registrant) =====
  document.getElementById('regList').addEventListener('click', function (e) {
    var eb = e.target.closest('[data-edit]');
    if (eb) {
      var ep = eb.getAttribute('data-edit').split('|');
      var ecomp = decodeURIComponent(ep[0]), eteam = decodeURIComponent(ep[1]);
      // 社群登入已驗證身分 → 帶入密碼讓編輯頁免再輸入
      if (PWD_BY_TEAM[eteam]) { try { sessionStorage.setItem('rm_edit_' + eteam, PWD_BY_TEAM[eteam]); } catch (x) {} }
      location.href = '/events/register.html?id=' + encodeURIComponent(ecomp) + '&edit=' + encodeURIComponent(eteam);
      return;
    }
    var btn = e.target.closest('[data-refund]');
    if (!btn) return;
    var parts = btn.getAttribute('data-refund').split('|');
    var tid = decodeURIComponent(parts[1]);
    openRefundModal(decodeURIComponent(parts[0]), tid, parts.slice(2).join('|'), PWD_BY_TEAM[tid] || '');
  });
  function openRefundModal(compId, teamId, name, knownPwd) {
    var ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.5);display:grid;place-items:center;padding:16px';
    ov.innerHTML =
      '<div style="background:var(--surface);border-radius:14px;max-width:440px;width:100%;padding:24px;max-height:90vh;overflow:auto">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h3 style="font:700 17px/1.3 var(--f-display)">' + window.L('myRfTitle') + '</h3><button id="rfX" style="background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted)">×</button></div>' +
        '<p style="font:400 12.5px/1.6 var(--f-tc);color:var(--ink-3);margin-bottom:14px">' + escapeHtml(name) + '<br>' + window.L('myRfIntro') + '</p>' +
        '<div style="display:flex;flex-direction:column;gap:10px">' +
          '<input id="rfPwd" type="password" placeholder="' + escapeHtml(window.L('myRfPwdPh')) + '" style="padding:10px 12px;border:1px solid var(--hairline);border-radius:9px;font:400 14px/1.4 var(--f-tc)">' +
          '<button id="rfCheck" class="btn btn-ghost">' + window.L('myRfCheckBtn') + '</button>' +
          '<div id="rfPreview" style="font:400 13px/1.7 var(--f-tc)"></div>' +
          '<div id="rfForm" style="display:none;flex-direction:column;gap:10px">' +
            '<input id="rfAcct" placeholder="' + escapeHtml(window.L('myRfAcctPh')) + '" style="padding:10px 12px;border:1px solid var(--hairline);border-radius:9px;font:400 14px/1.4 var(--f-tc)">' +
            '<textarea id="rfReason" rows="2" placeholder="' + escapeHtml(window.L('myRfReasonPh')) + '" style="padding:10px 12px;border:1px solid var(--hairline);border-radius:9px;font:400 14px/1.4 var(--f-tc)"></textarea>' +
            '<button id="rfSubmit" class="btn btn-primary btn-block">' + window.L('myRfSubmitBtn') + '</button>' +
          '</div>' +
          '<div id="rfMsg" style="font:500 12.5px/1.6 var(--f-tc)"></div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(ov);
    function close() { if (ov.parentNode) document.body.removeChild(ov); }
    ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
    ov.querySelector('#rfX').addEventListener('click', close);
    var msg = ov.querySelector('#rfMsg');
    function setMsg(t, ok) { msg.textContent = t || ''; msg.style.color = ok ? 'var(--ok-700, #047857)' : 'var(--err-700, #b91c1c)'; }

    // 社群登入已帶出密碼 → 自動填入並查詢，免再輸入
    if (knownPwd) {
      ov.querySelector('#rfPwd').value = knownPwd;
      ov.querySelector('#rfPwd').closest('div').querySelector('#rfPwd').style.display = 'none';
      var hint = ov.querySelector('p'); if (hint) hint.innerHTML = escapeHtml(name) + '<br>' + window.L('myRfIntroSocial');
      setTimeout(function () { ov.querySelector('#rfCheck').click(); }, 0);
    }

    ov.querySelector('#rfCheck').addEventListener('click', function () {
      var pwd = ov.querySelector('#rfPwd').value;
      if (!pwd) { setMsg(window.L('myRfErrNeedPwd')); return; }
      setMsg(window.L('myRfChecking'), true);
      google.script.run.withSuccessHandler(function (res) {
        if (!res || !res.success) { setMsg((res && res.message) || window.L('myRfErrCheckFail')); return; }
        if (res.refundStatus === 'requested' || res.refundStatus === 'approved') { ov.querySelector('#rfPreview').innerHTML = window.L('myRfExistingPrefix') + escapeHtml(res.request && res.request.status || '') + window.L('myRfExistingSuffix'); setMsg(''); return; }
        var c = res.calc || {};
        if (c.eventDateMissing) { ov.querySelector('#rfPreview').innerHTML = window.L('myRfNoEventDate'); return; }
        if (c.pastStart) { ov.querySelector('#rfPreview').innerHTML = window.L('myRfPastStart'); return; }
        if (!c.hasPolicy) { ov.querySelector('#rfPreview').innerHTML = window.L('myRfNoPolicy'); return; }
        ov.querySelector('#rfPreview').innerHTML = window.L('myRfPreviewA') + c.daysBefore + window.L('myRfPreviewB') + c.pct + window.L('myRfPreviewC') + c.paidAmount + window.L('myRfPreviewD') + c.pct + window.L('myRfPreviewE') + c.calcRefund + window.L('myRfPreviewF');
        ov.querySelector('#rfForm').style.display = 'flex';
        setMsg('');
      }).withFailureHandler(function (e) { setMsg(e && e.message || window.L('myRfErrCheckFail')); }).getRefundPreview(compId, teamId, pwd);
    });

    ov.querySelector('#rfSubmit').addEventListener('click', function () {
      var pwd = ov.querySelector('#rfPwd').value;
      var acct = ov.querySelector('#rfAcct').value.trim();
      var reason = ov.querySelector('#rfReason').value.trim();
      if (!acct) { setMsg(window.L('myRfErrNeedAcct')); return; }
      var b = this; b.disabled = true; setMsg(window.L('myRfSubmitting'), true);
      google.script.run.withSuccessHandler(function (res) {
        b.disabled = false;
        if (res && res.success) {
          ov.querySelector('#rfForm').style.display = 'none';
          ov.querySelector('#rfPreview').innerHTML = window.L('myRfDoneA') + res.pct + window.L('myRfDoneB') + res.calcRefund + window.L('myRfDoneC');
          setMsg('');
        } else setMsg((res && res.message) || window.L('myRfErrSubmitFail'));
      }).withFailureHandler(function (e) { b.disabled = false; setMsg(e && e.message || window.L('myRfErrSubmitFail')); }).requestRefund(compId, teamId, pwd, acct, reason);
    });
  }

  // ===== 社群登入查詢 =====
  function showSocialRegs(regs) {
    regs = regs || [];
    PWD_BY_TEAM = {};
    regs.forEach(function (r) { if (r.password) PWD_BY_TEAM[r.teamId] = r.password; });
    ALL = regs; render();   // render() 會顯示 kpiRow + resultsArea（renderList 只畫卡片）
    if (!regs.length) {
      var box = document.getElementById('lookupErr');
      box.textContent = window.L('myErrSocialNoRegs');
      box.style.display = 'block';
    }
    document.getElementById('resultsArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  document.getElementById('socialG').addEventListener('click', function () {
    var el = document.getElementById('lookupErr');
    if (typeof firebase === 'undefined' || !firebase.auth) { el.textContent = window.L('myErrGoogleNotLoaded'); el.style.display = 'block'; return; }
    el.style.display = 'none';
    var prov = new firebase.auth.GoogleAuthProvider(); prov.setCustomParameters({ prompt: 'select_account' });
    firebase.auth().signInWithPopup(prov).then(function (r) { return r.user.getIdToken(); }).then(function (idToken) {
      google.script.run.withSuccessHandler(function (res) {
        try { firebase.auth().signOut(); } catch (e) {}
        if (res && res.success) showSocialRegs(res.registrations);
        else { el.textContent = (res && res.message) || window.L('myErrLookupFail'); el.style.display = 'block'; }
      }).withFailureHandler(function (e) { el.textContent = (e && e.message) || window.L('myErrLookupFail'); el.style.display = 'block'; }).listMyRegistrationsBySocial('google', idToken);
    }).catch(function (e) { var c = (e && e.code) || ''; if (c.indexOf('popup-closed') < 0 && c.indexOf('cancelled') < 0) { el.textContent = (e && e.message) || window.L('myErrGoogleFail'); el.style.display = 'block'; } });
  });
  document.getElementById('socialL').addEventListener('click', function () {
    var state = Math.random().toString(36).slice(2) + Date.now().toString(36);
    try { sessionStorage.setItem('line_oauth_state', state); sessionStorage.setItem('line_oauth_mode', 'lookupReg'); } catch (e) {}
    location.href = 'https://access.line.me/oauth2/v2.1/authorize?response_type=code&client_id=2010261408&redirect_uri=' +
      encodeURIComponent('https://regmaster-v3.web.app/line-callback.html') + '&state=' + encodeURIComponent(state) + '&scope=' + encodeURIComponent('openid profile email');
  });

  // Re-render JS-built list (weekday labels, status pills, action buttons) on language switch
  if (window.AppState && typeof window.AppState.on === 'function') {
    window.AppState.on('lang-changed', function () {
      if (document.getElementById('resultsArea').style.display !== 'none') render();
    });
  }

  // Auto-trigger if ?email= in URL (e.g. from email link)
  var qs = new URLSearchParams(location.search);
  // Return from social lookup (Google popup-then-redirect, or LINE redirect) → render stashed results
  if (qs.get('social')) {
    try { var stashed = JSON.parse(sessionStorage.getItem('rm_social_regs') || '[]'); sessionStorage.removeItem('rm_social_regs'); if (stashed.length) showSocialRegs(stashed); } catch (e) {}
  }
  if (qs.get('email')) {
    document.getElementById('lookupValue').value = qs.get('email');
    document.getElementById('lookupBtn').click();
  } else if (qs.get('phone')) {
    document.querySelector('#lookupTabs button[data-mode="phone"]').click();
    document.getElementById('lookupValue').value = qs.get('phone');
    document.getElementById('lookupBtn').click();
  }
})();
</script>
<script src="/shared/public-nav.js" defer></script>
</body>
</html>
