<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>重設帳號密碼 · RegMaster</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="/shared/styles.css">

<script src="/__/firebase/10.7.1/firebase-app-compat.js"></script>
<script src="/__/firebase/10.7.1/firebase-functions-compat.js"></script>
<script src="/__/firebase/init.js"></script>
<script src="/shared/firebase-bridge.js"></script>

<style>
body { min-height:100vh; display:grid; place-items:center; background:var(--surface-2); padding:32px; position:relative; }
body::before { content:''; position:absolute; inset:0; background-image:linear-gradient(var(--hairline) 1px, transparent 1px),linear-gradient(90deg,var(--hairline) 1px, transparent 1px); background-size:60px 60px; mask:radial-gradient(ellipse 60% 50% at 50% 50%, black, transparent 70%); -webkit-mask:radial-gradient(ellipse 60% 50% at 50% 50%, black, transparent 70%); pointer-events:none; }
.shell { width:100%; max-width:520px; position:relative; }
.brand { display:flex; align-items:center; justify-content:center; gap:10px; font:700 16px/1 var(--f-display); margin-bottom:32px; text-decoration:none; color:inherit; }
.brand .logo { width:32px; height:32px; border-radius:8px; background:var(--ink); color:var(--surface); display:grid; place-items:center; font:800 15px/1 var(--f-display); overflow:hidden; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:48px; box-shadow:var(--sh-md); }
.step-header { text-align:center; margin-bottom:28px; }
.step-header .ic-circle { width:64px; height:64px; margin:0 auto 20px; border-radius:50%; background:linear-gradient(135deg, var(--blue-500,#3d6bff), var(--blue-700,#1e40af)); display:grid; place-items:center; box-shadow:0 8px 24px rgba(61,107,255,.25); }
.step-header .ic-circle svg { width:28px; height:28px; color:white; }
.step-header h1 { font:700 28px/1.15 var(--f-display); letter-spacing:-.018em; margin-bottom:8px; }
.step-header p { font:400 15px/1.55 var(--f-tc); color:var(--ink-3); }
.state-pane { display:none; }
.state-pane.on { display:block; }
.field { margin-bottom:14px; }
.field label { display:block; font:500 13px/1 var(--f-tc); color:var(--ink-2); margin-bottom:7px; }
.field input { width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:10px; font:400 15px/1.4 var(--f-tc); background:var(--surface); color:var(--ink); }
.field input:focus { outline:none; border-color:var(--acc); }
.hint { font:400 12px/1.5 var(--f-tc); color:var(--muted); margin-top:6px; }
.alert-box { padding:12px 14px; border-radius:10px; font:400 13px/1.5 var(--f-tc); margin-bottom:14px; display:none; }
.alert-box.err { background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.2); color:var(--err-700); }
.success-icon { width:80px; height:80px; margin:0 auto 24px; border-radius:50%; background:color-mix(in srgb, var(--ok,#10b981) 15%, var(--surface)); display:grid; place-items:center; }
.success-icon svg { width:36px; height:36px; color:var(--ok,#10b981); }
.foot-link { text-align:center; margin-top:24px; font:400 13px/1 var(--f-tc); color:var(--muted); }
.foot-link a { color:var(--acc); font-weight:500; }
@media (max-width:600px) { .card { padding:32px 24px; } }
</style>
</head>
<body>
<div class="shell">
  <a class="brand" href="/"><span class="logo"><img src="/favicon.png" alt="RegMaster" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block"></span>RegMaster</a>
  <div class="card">

    <!-- STATE: verifying -->
    <div class="state-pane on" data-s="loading">
      <div class="step-header" style="margin-bottom:0">
        <div class="ic-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg></div>
        <h1>驗證連結中⋯</h1>
        <p>請稍候。</p>
      </div>
    </div>

    <!-- STATE: form -->
    <div class="state-pane" data-s="form">
      <div class="step-header">
        <div class="ic-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg></div>
        <h1>設定新密碼</h1>
        <p>請為您的 RegMaster 帳號設定新密碼。</p>
      </div>
      <div class="alert-box err" id="errBox"></div>
      <form id="resetForm" autocomplete="off" novalidate>
        <div class="field">
          <label for="pw1">新密碼</label>
          <input id="pw1" type="password" autocomplete="new-password" placeholder="6–30 字元，不含空白">
        </div>
        <div class="field">
          <label for="pw2">再次輸入新密碼</label>
          <input id="pw2" type="password" autocomplete="new-password" placeholder="再輸入一次">
        </div>
        <div class="hint">設定後，請以您的帳號 / Email 與新密碼登入。</div>
        <button class="btn btn-primary btn-lg btn-block" id="submitBtn" type="submit" style="margin-top:18px">更新密碼 →</button>
      </form>
    </div>

    <!-- STATE: success -->
    <div class="state-pane" data-s="done">
      <div class="success-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 13l4 4L19 7"/></svg></div>
      <div class="step-header" style="margin-bottom:24px">
        <h1>密碼已更新</h1>
        <p>請使用新密碼登入您的帳號。</p>
      </div>
      <a href="/login.html?just=reset" class="btn btn-primary btn-lg btn-block">前往登入 →</a>
      <div class="foot-link">需要協助？<a href="/contact.html?topic=support">聯絡客服</a></div>
    </div>

    <!-- STATE: invalid -->
    <div class="state-pane" data-s="invalid">
      <div class="step-header" style="margin-bottom:8px">
        <div class="ic-circle" style="background:linear-gradient(135deg,#ef4444,#b91c1c)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L14.7 3.9a2 2 0 00-3.4 0z"/></svg></div>
        <h1>連結無法使用</h1>
        <p id="invalidMsg">此連結無效或已過期。</p>
      </div>
      <div class="foot-link" style="margin-top:8px">請回到「忘記密碼」頁面重新申請重設連結。</div>
      <a href="/forgot.html" class="btn btn-ghost btn-block" style="margin-top:16px">重新申請</a>
    </div>

  </div>
</div>

<script src="/shared/app-state.js"></script>
<script>
(function () {
  try { AppState.init(); } catch (e) {}
  var token = new URLSearchParams(location.search).get('token') || '';
  var errBox = document.getElementById('errBox');
  function showErr(m) { errBox.textContent = m; errBox.style.display = 'block'; }
  function hideErr() { errBox.style.display = 'none'; }
  function showState(n) {
    document.querySelectorAll('.state-pane').forEach(function (p) { p.classList.remove('on'); });
    var el = document.querySelector('.state-pane[data-s="' + n + '"]'); if (el) el.classList.add('on');
  }
  function invalid(msg) { document.getElementById('invalidMsg').textContent = msg || '此連結無效或已過期。'; showState('invalid'); }

  if (!token) { invalid('連結缺少必要參數，請重新申請。'); return; }

  google.script.run
    .withSuccessHandler(function (res) {
      if (res && res.valid) { showState('form'); }
      else { invalid((res && res.message) || '此連結無效或已過期。'); }
    })
    .withFailureHandler(function (e) { invalid((e && e.message) || '驗證失敗，請稍後再試。'); })
    .verifyAccountResetToken(token);

  document.getElementById('resetForm').addEventListener('submit', function (e) {
    e.preventDefault();
    hideErr();
    var p1 = document.getElementById('pw1').value, p2 = document.getElementById('pw2').value;
    if (p1.length < 6 || p1.length > 30) { showErr('密碼長度須為 6–30 字元'); return; }
    if (/\s/.test(p1)) { showErr('密碼不可包含空白字元'); return; }
    if (p1 !== p2) { showErr('兩次輸入的密碼不一致'); return; }
    var btn = document.getElementById('submitBtn');
    btn.disabled = true; var old = btn.textContent; btn.textContent = '更新中⋯';
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.success) { showState('done'); }
        else {
          btn.disabled = false; btn.textContent = old;
          if (res && /過期|使用過|無效|不存在/.test(res.message || '')) { invalid(res.message); }
          else { showErr((res && res.message) || '更新失敗，請稍後再試'); }
        }
      })
      .withFailureHandler(function (err) { btn.disabled = false; btn.textContent = old; showErr((err && err.message) || '網路錯誤'); })
      .resetAccountPassword(token, p1);
  });
})();
</script>
</body>
</html>
