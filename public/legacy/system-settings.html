<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RegMaster — 系統設定</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<!-- Firebase SDK -->
<script src="/__/firebase/10.7.1/firebase-app-compat.js"></script>
<script src="/__/firebase/10.7.1/firebase-functions-compat.js"></script>
<script src="/__/firebase/init.js"></script>
<script>
var _fn = firebase.functions();
var _argMap = {
  getSalesConfig:[],
  saveSalesConfig:["config"],
  createCoupon:["code","type","value","maxUses","expiresAt"],
  listCoupons:[],
  deleteCoupon:["id"],
  listAccounts:[],
  createAccount:["username","password","role","displayName"],
  deleteAccount:["username"],
  sendSystemEmail:["targetEmail","subject","content","user"],
  getGeminiKeys:[],
  saveGeminiKeys:["keys"],
  getAuditLogs:["limit"],
  clearAuditLogs:[],
  createLicense:["type","count","years"],
  deleteLicense:["code"],
  listLicenses:[],
  clearExpiredLicenses:[],
  productionReset:["confirmCode"],
  listOrders:[],
  getVisitorStats:[],
  listFeedback:[],
  updateFeedbackStatus:["feedbackId","status"],
  getFeedbackFile:["fileId"]
};
var ME = null;
function _callFn(name, args) {
  var map = _argMap[name]; var payload = {};
  if (map && map.length > 0) { for (var i = 0; i < map.length; i++) payload[map[i]] = args[i]; }
  else if (args.length === 1 && typeof args[0] === "object") payload = args[0];
  else if (args.length > 0) { for (var j = 0; j < args.length; j++) payload["arg" + j] = args[j]; }
  if (ME && ME.sessionToken) payload._auth = { username: ME.username, token: ME.sessionToken };
  return _fn.httpsCallable(name)(payload).then(function(r) { return r.data; });
}
var google = {script:{run:null}};
(function(){
  function makeRunner(){
    var _ok=null,_fail=null;
    var handler={get:function(t,p){
      if(p==="withSuccessHandler") return function(cb){_ok=cb;return new Proxy({},handler)};
      if(p==="withFailureHandler") return function(cb){_fail=cb;return new Proxy({},handler)};
      return function(){
        var a=[];for(var i=0;i<arguments.length;i++)a.push(arguments[i]);
        var ok=_ok,fail=_fail;
        _callFn(p,a).then(function(r){if(ok)ok(r)}).catch(function(e){
          var msg=(e&&e.message)||'';
          if(msg.indexOf('登入已失效')!==-1||msg.indexOf('Session expired')!==-1||msg.indexOf('Authentication required')!==-1){
            try{loading(false)}catch(x){}
            toast('登入已過期，請重新登入','error');
            setTimeout(function(){window.location.href='/'},1500);
            return;
          }
          if(fail)fail(e);else{console.error("CF error:",p,e);try{loading(false)}catch(x){}try{toast(msg||"Error: "+p,"error")}catch(x){}}
        });
      };
    }};
    return new Proxy({},handler);
  }
  google.script.run=new Proxy({},{get:function(t,p){
    if(p==="withSuccessHandler"){var r=makeRunner();return function(cb){return r.withSuccessHandler(cb)};}
    if(p==="withFailureHandler"){var r2=makeRunner();return function(cb){return r2.withFailureHandler(cb)};}
    return function(){var a=[];for(var i=0;i<arguments.length;i++)a.push(arguments[i]);_callFn(p,a).catch(function(e){console.error(p,e)})};
  }});
})();
</script>

<style>
:root{--pri:#0A437A;--pri2:#0D5BA8;--pri-bg:#E8F0F8;--bg:#f1f5f9;--surface:#fff;--surface2:#f8fafc;--txt:#0f172a;--txt2:#475569;--txt3:#94a3b8;--border:#e2e8f0;--ok:#10b981;--ok-bg:#ecfdf5;--err:#ef4444;--err-bg:#fef2f2;--warn:#F49121;--warn-bg:#FFF7ED;--accent:#F49121;--radius:16px;--shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit','Noto Sans TC',sans-serif;background:var(--bg);color:var(--txt);line-height:1.75;font-size:17px;min-height:100vh}
::selection{background:var(--pri);color:#fff}
.topbar{background:linear-gradient(135deg,#062845,#0A437A,#0D5BA8);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 4px 20px rgba(30,27,75,.25)}
.topbar .logo{color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;text-decoration:none}
.topbar .logo .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.logo-tagline{font-size:9px;color:rgba(255,255,255,.4);font-weight:400;display:block;line-height:1;margin-top:-2px}
.logo-ver{font-size:8px;padding:1px 5px;background:rgba(244,145,33,.8);color:#fff;border-radius:4px;font-weight:700;margin-left:4px;vertical-align:middle}
.topbar .right{display:flex;align-items:center;gap:6px}
.topbar .right button{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.15);padding:7px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s}
.topbar .right button:hover{background:rgba(255,255,255,.2)}
.container{max-width:100%;margin:0 auto;padding:20px 28px 80px;width:100%}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 28px;margin-bottom:18px;border:1px solid var(--border);animation:fadeIn .3s ease both}
.card h2{font-size:20px;font-weight:700;margin-bottom:16px;padding-bottom:10px;border-bottom:2.5px solid var(--pri-bg);color:var(--pri)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-weight:600;font-size:14px;color:var(--txt2);margin-bottom:5px}
.form-group label .req{color:var(--err)}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:11px;font-size:15px;font-family:inherit;transition:.2s;background:var(--surface2)}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(10,67,122,.08);background:#fff}
.form-group textarea{resize:vertical;min-height:90px}
.form-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.btn{padding:10px 20px;border:none;border-radius:11px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--pri);color:#fff;box-shadow:0 2px 8px rgba(10,67,122,.2)}.btn-primary:hover{background:var(--pri2)}
.btn-success{background:var(--ok);color:#fff}.btn-danger{background:var(--err);color:#fff}
.btn-outline{background:transparent;border:1.5px solid var(--pri);color:var(--pri)}.btn-outline:hover{background:var(--pri-bg)}
.btn-ghost{background:transparent;color:var(--txt2);padding:8px 12px}.btn-ghost:hover{background:var(--surface2)}
.btn-full{width:100%;justify-content:center;padding:13px;font-size:16px}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:8px}
.badge{display:inline-block;padding:3px 12px;border-radius:12px;font-size:13px;font-weight:700}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:#b45309}.b-err{background:var(--err-bg);color:var(--err)}.b-info{background:var(--pri-bg);color:var(--pri)}
.dtable{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.dtable th{background:var(--surface2);padding:10px 12px;text-align:left;font-weight:600;color:var(--txt3);font-size:12px;border-bottom:2px solid var(--border);white-space:nowrap}
.dtable td{padding:10px 12px;border-bottom:1px solid var(--surface2);vertical-align:middle}
.dtable tr:hover td{background:var(--surface2)}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px}
.empty{text-align:center;padding:36px;color:var(--txt3)}
/* Tabs */
.sys-tabs{display:flex;gap:2px;background:var(--surface);border-radius:14px 14px 0 0;padding:4px;border:1px solid var(--border);border-bottom:none;overflow-x:auto;-webkit-overflow-scrolling:touch}
.sys-tabs::-webkit-scrollbar{display:none}
.sys-tab{padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;border-radius:10px;white-space:nowrap;color:var(--txt3);transition:.2s;display:flex;align-items:center;gap:5px}
.sys-tab:hover{background:var(--surface2)}
.sys-tab.on{background:var(--pri);color:#fff}
.sys-body{background:var(--surface);border-radius:0 0 var(--radius) var(--radius);box-shadow:var(--shadow);padding:24px;border:1px solid var(--border);border-top:none;min-height:260px}
.sys-panel{display:none}.sys-panel.on{display:block;animation:fadeIn .25s ease}
/* Loader */
.loader-bg{display:none;position:fixed;inset:0;background:rgba(255,255,255,.7);z-index:999;justify-content:center;align-items:center;backdrop-filter:blur(2px)}
.loader-box{text-align:center}
.loader-bar-track{width:200px;height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:8px auto 0}
.loader-bar-fill{height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:3px;width:0%;transition:width .2s}
.loader-pct{font-size:12px;color:var(--txt3);margin-top:4px;font-weight:600}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);padding:12px 22px;border-radius:12px;font-size:15px;font-weight:600;z-index:9999;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.toast.success{background:#065f46;color:#d1fae5}.toast.error{background:#991b1b;color:#fee2e2}.toast.info{background:var(--pri);color:#fff}.toast.warn{background:#92400e;color:#fef3c7}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:600;display:none;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(2px)}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border-radius:var(--radius);padding:0;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 25px 50px rgba(0,0,0,.15);animation:fadeIn .2s ease}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.mh h3{font-size:17px;font-weight:700}
.mb{padding:20px}
@media(max-width:640px){
  .container{padding:12px 10px 60px}
  .card{padding:16px 14px}
  .sys-tab{padding:8px 10px;font-size:11px;gap:3px}
  .sys-body{padding:14px 10px}
  .dtable{font-size:11px}
  .dtable th,.dtable td{padding:6px 5px}
  .form-row{grid-template-columns:1fr}
  .topbar{padding:0 12px;height:48px}
  .topbar .logo{font-size:15px;gap:6px}
  .topbar .logo img{width:26px;height:26px}
  .logo-tagline{font-size:8px}
  .topbar .right button{padding:5px 10px;font-size:11px;border-radius:8px}
  .fin-summary{grid-template-columns:1fr}
  .fin-card{padding:14px 16px}
  h1{font-size:20px!important}
  .btn{padding:8px 14px;font-size:13px}
  .btn-sm{padding:4px 10px;font-size:11px}
  .modal{max-width:95vw;margin:8px}
  .mh{padding:12px 14px}
  .mb{padding:14px}
  .mh h3{font-size:15px}
}
@media(max-width:400px){
  .sys-tab{padding:6px 8px;font-size:10px}
  .container{padding:8px 6px 60px}
}
/* Finance tab */
.fin-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.fin-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:18px 20px;text-align:center}
.fin-label{font-size:12px;color:var(--txt3);font-weight:600;margin-bottom:4px}
.fin-value{font-size:24px;font-weight:900}
/* Visitor tab */
.vis-tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.vis-tab{padding:8px 16px;font-size:13px;font-weight:600;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;color:var(--txt2);transition:.15s}
.vis-tab:hover{background:var(--surface2)}
.vis-tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.vis-sub{display:none}.vis-sub.on{display:block;animation:fadeIn .25s ease}
.country-list{max-width:500px}
.country-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--surface2)}
.country-name{min-width:100px;font-weight:600;font-size:14px}
.country-bar-bg{flex:1;height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.country-bar{height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:5px;transition:width .3s}
.country-count{min-width:40px;text-align:right;font-weight:700;font-size:13px;color:var(--txt2)}
/* Date filter bar */
.date-filter-bar{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:16px}
.df-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.df-row:last-child{margin-bottom:0}
.df-preset{font-size:11px!important;padding:4px 10px!important}
/* Feedback list */
.fb-list{display:flex;flex-direction:column;gap:10px}
.fb-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;transition:.15s}
.fb-item:hover{box-shadow:0 2px 12px rgba(0,0,0,.06)}
.fb-head{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fb-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:11px;color:var(--txt3)}
</style>
</head>

<body>

<div class="topbar">
  <a class="logo" href="/" title="返回首頁">
    <img src="favicon.png" alt="RegMaster" width="32" height="32" style="border-radius:6px">
    <div>

<!-- Loader -->

      <button class="btn btn-primary btn-full" id="btnSysEmail" onclick="doSendSystemEmail()">送出信件</button>
    </div>

<script>
// ==========================================
// Core Helpers
// ==========================================
var LANG = 'zh';

function $(id) { return document.getElementById(id); }

function escHtml(s) {
  if (!s && s !== 0) return '';
  var d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

function openM(id) { $(id).classList.add('show'); }
function closeM(id) { $(id).classList.remove('show'); }

function showConfirm(msg, onOk, title, okText) {
  $('mcTitle').textContent = title || '確認';
  $('mcMsg').textContent = msg;
  $('mcOk').style.display = '';
  $('mcOk').style.background = '';
  $('mcOk').textContent = okText || '確定';
  $('mcCancel').textContent = '取消';
  $('mcOk').onclick = function() { closeM('mConfirm'); if (onOk) onOk(); };
  openM('mConfirm');
}

var toastTimeout = null;
function toast(m, t) {
  var e = $('toast');
  e.innerHTML = escHtml(m) + ' <span onclick="this.parentElement.classList.remove(\'show\')" style="margin-left:8px;cursor:pointer;opacity:.7;font-size:15px">✕</span>';
  e.className = 'toast ' + (t || 'info') + ' show';
  if (toastTimeout) clearTimeout(toastTimeout);
  var dur = (t === 'error' || t === 'warn') ? 6000 : 3500;
  toastTimeout = setTimeout(function() { e.classList.remove('show'); }, dur);
}

var _loadTimer = null;
function loading(s) {
  var el = $('loader'), bar = $('loaderBar'), pct = $('loaderPct');
  if (s) {
    if (bar) bar.style.width = '0%'; if (pct) pct.textContent = '0%';
    el.style.display = 'flex';
    var progress = 0; clearInterval(_loadTimer);
    _loadTimer = setInterval(function() {
      if (progress < 90) { progress += Math.random() * 15 + 5; if (progress > 90) progress = 90; }
      if (bar) bar.style.width = Math.round(progress) + '%';
      if (pct) pct.textContent = Math.round(progress) + '%';
    }, 200);
  } else {
    clearInterval(_loadTimer);
    if (bar) bar.style.width = '100%'; if (pct) pct.textContent = '100%';
    setTimeout(function() { el.style.display = 'none'; }, 300);
  }
}

// ==========================================
// Cookie / Session
// ==========================================
function getCookie(name) {
  var c = document.cookie.split(';');
  for (var i = 0; i < c.length; i++) { var p = c[i].trim().split('='); if (p[0] === name) return decodeURIComponent(p[1]); }
  return '';
}

// ==========================================
// Tab Switching
// ==========================================
var _loadedTabs = {};

function switchTab(id) {
  document.querySelectorAll('.sys-tab').forEach(function(t) { t.classList.toggle('on', t.getAttribute('data-tab') === id); });
  document.querySelectorAll('.sys-panel').forEach(function(p) { p.classList.toggle('on', p.id === 'panel-' + id); });
  // Lazy-load content on first switch
  if (!_loadedTabs[id]) {
    _loadedTabs[id] = true;
    if (id === 'sales') loadSalesTab();
    else if (id === 'accounts') loadAccountsTab();
    else if (id === 'licenses') loadLicensesTab();
    else if (id === 'finance') loadFinanceTab();

function _dateFilterBar(prefix, onApply) {
  var h = '<div class="date-filter-bar">';
  h += '<div class="df-row">';
  h += '<select id="' + prefix + 'Preset" onchange="applyDatePreset(\'' + prefix + '\');' + onApply + '" style="padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-weight:600">';
  h += '<option value="">自訂期間</option>';
  h += '<option value="1">今天</option>';
  h += '<option value="3">近 3 日</option>';
  h += '<option value="7">近 7 日</option>';
  h += '<option value="30">近 30 日</option>';
  h += '<option value="90">近 90 日</option>';
  h += '<option value="365">近一年</option>';
  h += '<option value="all">全部期間</option>';
  h += '</select>';
  h += '<input type="date" id="' + prefix + 'From" style="padding:6px 8px;border:1.5px solid var(--border);border-radius:8px;font-size:12px">';
  h += '<span style="font-size:12px;color:var(--txt3)">~</span>';
  h += '<input type="date" id="' + prefix + 'To" style="padding:6px 8px;border:1.5px solid var(--border);border-radius:8px;font-size:12px">';
  h += '<button class="btn btn-primary btn-sm" onclick="' + onApply + '">🔍 查詢</button>';
  h += '<button class="btn btn-ghost btn-sm" onclick="$(\'' + prefix + 'From\').value=\'\';$(\'' + prefix + 'To\').value=\'\';$(\'' + prefix + 'Preset\').value=\'\';' + onApply + '">✕</button>';
  h += '</div></div>';
  return h;
}

function applyDatePreset(prefix) {
  var val = $(prefix + 'Preset').value;
  if (val === 'all') { $(prefix + 'From').value = ''; $(prefix + 'To').value = ''; return; }
  var days = parseInt(val);
  if (!days) { $(prefix + 'From').value = ''; $(prefix + 'To').value = ''; return; }
  var to = new Date();
  var from = new Date(to.getTime() - (days - 1) * 86400000);
  $(prefix + 'From').value = from.toISOString().substring(0, 10);
  $(prefix + 'To').value = to.toISOString().substring(0, 10);
}

/** Render daily traffic line chart on canvas */
function _renderDailyLineChart(dates, byDate, dailyUnique) {
  var canvas = $('visChartCanvas');
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var rect = canvas.parentElement.getBoundingClientRect();
  var W = Math.max(Math.max(rect.width - 32, 300), dates.length * 50);
  var H = 260;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);

  var visits = dates.map(function(d) { return byDate[d] || 0; });
  var uniques = dates.map(function(d) { return dailyUnique[d] || 0; });
  var allVals = visits.concat(uniques);
  var maxVal = Math.max.apply(null, allVals);
  if (maxVal === 0) maxVal = 1;

  var padL = 52, padR = 20, padT = 36, padB = 56;
  var chartW = W - padL - padR;
  var chartH = H - padT - padB;

  /* Computed style for theme-aware colors */
  var cs = getComputedStyle(document.documentElement);
  var txtColor = cs.getPropertyValue('--txt3').trim() || '#94a3b8';
  var borderColor = cs.getPropertyValue('--border').trim() || '#e2e8f0';
  var priColor = cs.getPropertyValue('--pri').trim() || '#0A437A';
  var secColor = '#f59e0b';

  /* Y-axis grid lines */
  var ySteps = 5;
  ctx.font = '11px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (var i = 0; i <= ySteps; i++) {
    var yVal = Math.round(maxVal / ySteps * i);
    var y = padT + chartH - (chartH * i / ySteps);
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
    ctx.fillStyle = txtColor;
    ctx.fillText(yVal, padL - 8, y);
  }

  /* Helper: x position for data point */
  function xPos(idx) { return padL + (dates.length === 1 ? chartW / 2 : chartW * idx / (dates.length - 1)); }
  function yPos(val) { return padT + chartH - (chartH * val / maxVal); }

  /* Draw area fill + line for visits */
  function drawSeries(data, lineColor, fillColor) {
    if (data.length === 0) return;
    /* Area fill */
    ctx.beginPath();
    ctx.moveTo(xPos(0), yPos(data[0]));
    for (var j = 1; j < data.length; j++) ctx.lineTo(xPos(j), yPos(data[j]));
    ctx.lineTo(xPos(data.length - 1), padT + chartH);
    ctx.lineTo(xPos(0), padT + chartH);
    ctx.closePath();
    ctx.fillStyle = fillColor;
    ctx.fill();
    /* Line */
    ctx.beginPath();
    ctx.moveTo(xPos(0), yPos(data[0]));
    for (var j = 1; j < data.length; j++) ctx.lineTo(xPos(j), yPos(data[j]));
    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 2.5;
    ctx.lineJoin = 'round';
    ctx.stroke();
    /* Dots */
    data.forEach(function(v, j) {
      ctx.beginPath();
      ctx.arc(xPos(j), yPos(v), 3.5, 0, Math.PI * 2);
      ctx.fillStyle = lineColor;
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    });
  }

  drawSeries(visits, priColor, priColor + '1A');
  drawSeries(uniques, secColor, secColor + '1A');

  /* X-axis labels */
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = txtColor;
  ctx.font = '10px system-ui, sans-serif';
  var labelSkip = Math.max(1, Math.floor(dates.length / 15));
  dates.forEach(function(d, j) {
    if (j % labelSkip === 0 || j === dates.length - 1) {
      var lbl = d.length >= 10 ? d.substring(5) : d;
      ctx.save();
      ctx.translate(xPos(j), padT + chartH + 6);
      ctx.rotate(-0.5);
      ctx.fillText(lbl, 0, 0);
      ctx.restore();
    }
  });

  /* Data value labels on top of dots */
  ctx.font = '10px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  visits.forEach(function(v, j) {
    if (v > 0 && (dates.length <= 20 || j % labelSkip === 0)) {
      ctx.fillStyle = priColor;
      ctx.fillText(v, xPos(j), yPos(v) - 6);
    }
  });
  uniques.forEach(function(v, j) {
    if (v > 0 && (dates.length <= 20 || j % labelSkip === 0)) {
      ctx.fillStyle = secColor;
      ctx.fillText(v, xPos(j), yPos(v) - 6);
    }
  });

  /* Legend */
  var lgX = padL + 4, lgY = 8;
  ctx.font = '12px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = priColor;
  ctx.fillRect(lgX, lgY, 14, 4);
  ctx.fillText('總瀏覽次數', lgX + 20, lgY + 2);
  ctx.fillStyle = secColor;
  ctx.fillRect(lgX + 110, lgY, 14, 4);
  ctx.fillText('不重複裝置數', lgX + 130, lgY + 2);
}

function filterLogs() {
  var user = ($('logFilterUser') ? $('logFilterUser').value : '').toLowerCase();
  var action = $('logFilterAction') ? $('logFilterAction').value : '';
  var dateFrom = $('logFilterDateFrom') ? $('logFilterDateFrom').value : '';
  var dateTo = $('logFilterDateTo') ? $('logFilterDateTo').value : '';
  var filtered = _allLogs.filter(function(l) {
    if (user && !(l.user || '').toLowerCase().includes(user)) return false;
    if (action && l.action !== action) return false;
    var logDate = (l.time || '').substring(0, 10);
    if (dateFrom && logDate < dateFrom) return false;
    if (dateTo && logDate > dateTo) return false;
    return true;
  });
  var wrap = $('logTableWrap'); if (!wrap) return;
  if (!filtered.length) { wrap.innerHTML = '<p style="color:var(--txt3);text-align:center;padding:20px">無符合條件的記錄 (' + _allLogs.length + ' 筆中)</p>'; return; }
  var h = '<p style="font-size:12px;color:var(--txt3);margin-bottom:6px">顯示 ' + filtered.length + ' / ' + _allLogs.length + ' 筆</p>';
  h += '<div style="overflow-x:auto"><table class="dtable"><thead><tr><th>時間</th><th>操作者</th><th>動作</th><th>目標</th><th>詳細</th></tr></thead><tbody>';
  filtered.forEach(function(l) {
    h += '<tr><td class="mono" style="font-size:11px">' + l.time + '</td><td>' + escHtml(l.user) + '</td><td><span class="badge b-info">' + escHtml(l.action) + '</span></td><td class="mono">' + escHtml(l.target) + '</td><td style="font-size:12px;color:var(--txt2)">' + escHtml(l.detail) + '</td></tr>';
  });
  h += '</tbody></table></div>';
  wrap.innerHTML = h;
}

  showConfirm('確定清除所有操作日誌？此操作不可復原。', function() {
    loading(true);
    google.script.run.withSuccessHandler(function() {
      loading(false); toast('操作日誌已清除', 'success'); _loadedTabs['logs'] = false; loadLogsTab();

  var code = ($('resetCode') ? $('resetCode').value : '').trim();
  if (code !== 'RESET-PRODUCTION-2026') { toast('確認碼錯誤', 'error'); return; }
  loading(true);
  google.script.run.withSuccessHandler(function(r) {
    loading(false);
    if (r.success) toast(r.message, 'success');
    else toast(r.message || 'Failed', 'error');
  }).withFailureHandler(function(e) {
    loading(false); toast(e.message || 'Error', 'error');
  }).productionReset(code);
}

// ==========================================
// Init: check session and load first tab
// ==========================================
(function init() {
  var raw = getCookie('regmaster_session');
  if (!raw) { toast('請先登入', 'error'); setTimeout(function() { window.location.href = '/'; }, 1200); return; }
  try {
    ME = JSON.parse(raw);
    if (!ME || !ME.username || !ME.sessionToken) throw new Error('invalid');
    if (ME.role !== 'system') { toast('僅限系統管理員', 'error'); setTimeout(function() { window.location.href = '/'; }, 1200); return; }
    $('meLabel').textContent = '👤 ' + (ME.displayName || ME.username);
    switchTab('sales');
  } catch (e) {
    toast('登入資訊異常，請重新登入', 'error');
    setTimeout(function() { window.location.href = '/'; }, 1200);
  }
})();
</script>

</body>
