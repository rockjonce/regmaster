<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RegMaster — 付款結果</title>
<style>
body{font-family:'Outfit','Noto Sans TC',sans-serif;background:#f1f5f9;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}
.card{background:#fff;border-radius:16px;padding:40px 32px;max-width:420px;width:100%;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.icon{font-size:56px;margin-bottom:12px}
h1{font-size:22px;font-weight:800;color:#0A437A;margin:0 0 8px}
p{font-size:15px;color:#475569;line-height:1.7;margin:0 0 20px}
.btn{display:inline-block;padding:12px 32px;background:#0A437A;color:#fff;border-radius:12px;font-size:16px;font-weight:600;text-decoration:none;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(10,67,122,.3)}
</style>
</head>
<body>
<div class="card">
  <div class="icon">✅</div>
  <h1>感謝您的購買！</h1>
  <p>系統正在處理您的訂單，授權碼將在交易確認後自動產生。<br>請返回 RegMaster 管理介面查看。</p>
  <a href="/" class="btn">🏠 返回 RegMaster</a>
</div>
</body>
</html>
