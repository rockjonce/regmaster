<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>找不到頁面 · RegMaster</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="/shared/styles.css">
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--ink); font-family:var(--f-tc,system-ui); }
  .e404-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:48px 24px; }
  .e404 { max-width:520px; text-align:center; }
  .e404 .code { font:800 96px/1 var(--f-display,system-ui); letter-spacing:-.04em;
    background:linear-gradient(120deg, var(--acc,#3d6bff), var(--amber-500,#f59e0b)); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:8px; }
  .e404 h1 { font:700 26px/1.2 var(--f-display,system-ui); margin:0 0 12px; }
  .e404 p { font:400 16px/1.6 var(--f-tc,system-ui); color:var(--ink-3,#667); margin:0 0 28px; }
  .e404 .links { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .e404 .btn { display:inline-flex; align-items:center; padding:11px 20px; border-radius:10px; font:600 14px/1 var(--f-tc,system-ui); text-decoration:none; }
  .e404 .btn-primary { background:var(--ink,#111); color:var(--surface,#fff); }
  .e404 .btn-quiet { border:1px solid var(--line,#ddd); color:var(--ink-2,#333); }
  .e404 .btn:hover { opacity:.88; }
</style>
</head>
<body>
  <div class="e404-wrap">
    <div class="e404">
      <div class="code">404</div>
      <h1>找不到這個頁面</h1>
      <p>您要找的頁面可能已被移動、刪除，或網址輸入有誤。</p>
      <div class="links">
        <a class="btn btn-primary" href="/">回首頁</a>
        <a class="btn btn-quiet" href="/events/">探索活動</a>
        <a class="btn btn-quiet" href="/contact.html">聯絡我們</a>
      </div>
    </div>
  </div>
</body>
</html>
